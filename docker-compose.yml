# Base production services — generated by keytec-drupal-deploy (recipe: komodo).
# Build-time values resolved at generation. Runtime ${VARS} come from the Komodo stack
# environment (set per branch by the keytec-ai CLI / Resource Sync TOML):
#   REGISTRY_IMAGE_PHP / REGISTRY_IMAGE_NGINX  image refs (registry, tagged per build)
#   STACK_NAME                                 unique per branch -> isolated ingress routers
#   DOMAIN, DB_*, DRUPAL_HASH_SALT             env + secrets (DOMAIN and the salt required)
services:
  # One-shot root service: the wodby php/nginx images run as uid 1000, but Docker
  # creates named volumes owned by root. This fixes ownership of files dirs + /tmp
  # (Drush compiles its DI container into /tmp) before php starts.
  init-perms:
    image: alpine:3
    command: sh -c "chown -R 1000:1000 /pf /privf /oauthkeys && chown 1000:1000 /tmpdir && chmod 1777 /tmpdir"
    volumes:
      - public_files:/pf
      - private_files:/privf
      - tmp_files:/tmpdir
      - oauth_keys:/oauthkeys
    restart: "no"

  db:
    image: "wodby/mariadb:10.11-3.30.1"
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - internal

  # One-shot deploy hook (scripts/deploy/site-deploy.sh) against the freshly-pulled image,
  # then exits. php waits on it completing successfully so a failed migration fails
  # `compose up` -> the CI DeployStack poll goes red. It installs only when the database is
  # reachable and has no table at all; any other non-Drupal state fails without touching data.
  deploy:
    image: "${REGISTRY_IMAGE_PHP}"
    restart: "no"
    depends_on:
      init-perms:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_DRIVER: "mysql"
      DB_PORT: "3306"
      DRUSH_OPTIONS_URI: "https://${DOMAIN}"
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:?Set DRUPAL_HASH_SALT}
      # SaaS: run-log storage stays off; only docker/compose/docker-compose.yml may enable it.
      FEATURE_FLAG_RUN_LOG_STORAGE: "0"
    volumes:
      - public_files:/var/www/html/web/sites/default/files
      - private_files:/var/www/html/private-files
      - tmp_files:/tmp
      - oauth_keys:/var/www/oauth-keys
    # Same script as the standalone stack: updates an installed site and installs only a
    # reachable, empty database; anything else fails. Komodo dumps the database beforehand.
    command: /var/www/html/scripts/deploy/site-deploy.sh
    networks:
      - internal

  # Explicit, opt-in FIRST INSTALL — profile-gated, so it NEVER starts on a normal
  # `up`/auto-deploy. Bring up a brand-new environment deliberately with:
  #   docker compose --profile install run --rm install
  # site:install DROPS and recreates the database — that is exactly why installing is a
  # separate, deliberate action and not wired into the auto deploy.
  #  INSTALL: site:install --existing-config (installs FROM config/sync, adopting the
  #           config UUID so a later deploy config:import passes the UUID check), then
  #           deploy:hook, then the OAuth keys. The public `bakers-cli` consumer comes with
  #           the install; the first admin signs in once with `drush uli`.
  install:
    image: "${REGISTRY_IMAGE_PHP}"
    profiles: [install]
    restart: "no"
    depends_on:
      init-perms:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_DRIVER: "mysql"
      DB_PORT: "3306"
      DRUSH_OPTIONS_URI: "https://${DOMAIN}"
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:?Set DRUPAL_HASH_SALT}
      # SaaS: run-log storage stays off; only docker/compose/docker-compose.yml may enable it.
      FEATURE_FLAG_RUN_LOG_STORAGE: "0"
      BB_OAUTH_GOOGLE_CLIENT_ID: ${BB_OAUTH_GOOGLE_CLIENT_ID:-}
      BB_OAUTH_GOOGLE_CLIENT_SECRET: ${BB_OAUTH_GOOGLE_CLIENT_SECRET:-}
    volumes:
      - public_files:/var/www/html/web/sites/default/files
      - private_files:/var/www/html/private-files
      - tmp_files:/tmp
      - oauth_keys:/var/www/oauth-keys
    command: |
      sh -c '
        set -e
        DRUSH=/var/www/html/vendor/bin/drush
        echo "[install] site:install --existing-config (DROPS + recreates the DB)"
        $$DRUSH -y site:install --existing-config
        $$DRUSH -y deploy:hook
        echo "[install] OAuth keys"
        mkdir -p /var/www/oauth-keys
        [ -f /var/www/oauth-keys/private.key ] || $$DRUSH simple-oauth:generate-keys /var/www/oauth-keys
      '
    networks:
      - internal

  php:
    # Built + pushed by GitLab CI (build job), pulled from the registry.
    image: "${REGISTRY_IMAGE_PHP}"
    restart: unless-stopped
    depends_on:
      init-perms:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      deploy:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_DRIVER: "mysql"
      DB_PORT: "3306"
      COLUMNS: 80
      DOCROOT_SUBDIR: ""
      HTTP_ROOT: /var/www/html/web
      APP_ROOT: /var/www/html
      CONF_DIR: /var/www/conf
      DRUPAL_VERSION: "11"
      DRUSH_OPTIONS_URI: "https://${DOMAIN}"
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:?Set DRUPAL_HASH_SALT}
      # SaaS: run-log storage stays off; only docker/compose/docker-compose.yml may enable it.
      FEATURE_FLAG_RUN_LOG_STORAGE: "0"
      # Outbound SMTP: settings.container.php reads these at runtime (getenv). The
      # values are per-stack Komodo variables declared in komodo/bakers.toml; the
      # stack .env carries them, but Drupal only sees them if the runtime
      # service forwards them explicitly here.
      MAIL_SMTP_DSN: ${MAIL_SMTP_DSN:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      BB_OAUTH_GOOGLE_CLIENT_ID: ${BB_OAUTH_GOOGLE_CLIENT_ID:-}
      BB_OAUTH_GOOGLE_CLIENT_SECRET: ${BB_OAUTH_GOOGLE_CLIENT_SECRET:-}
      PHP_FPM_USER: "wodby"
      PHP_FPM_GROUP: "wodby"
      PHP_FPM_CLEAR_ENV: "no"
    volumes:
      - public_files:/var/www/html/web/sites/default/files
      - private_files:/var/www/html/private-files
      # Writable /tmp for Drush's compiled DI container (named volume, per stack).
      - tmp_files:/tmp
      - oauth_keys:/var/www/oauth-keys
    networks:
      - internal

  nginx:
    image: "${REGISTRY_IMAGE_NGINX}"
    restart: unless-stopped
    depends_on:
      - php
    environment:
      NGINX_STATIC_OPEN_FILE_CACHE: "off"
      NGINX_BACKEND_HOST: php
      NGINX_SERVER_ROOT: /var/www/html/web
      NGINX_VHOST_PRESET: "drupal10"
      # The preset's `location ^~ /.well-known/` (defaults.conf) serves files only and never
      # reaches @drupal; the exact-match locations in this file take the two OAuth discovery
      # documents to Drupal and leave other well-known files static.
      NGINX_SERVER_EXTRA_CONF_FILEPATH: /etc/nginx/oauth-discovery.conf
    volumes:
      - public_files:/var/www/html/web/sites/default/files
    # Ingress (router labels + the public-facing network) is NOT declared here:
    # it differs per host. Each environment layers exactly one ingress overlay via
    # the Komodo stack's file_paths — docker-compose.traefik.yml on dev2 and the
    # prod server. The base stays ingress-agnostic.
    networks:
      - internal

  cron:
    image: "${REGISTRY_IMAGE_PHP}"
    restart: unless-stopped
    depends_on:
      init-perms:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      deploy:
        condition: service_completed_successfully
      php:
        condition: service_started
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_DRIVER: "mysql"
      DB_PORT: "3306"
      DRUSH_OPTIONS_URI: "https://${DOMAIN}"
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:?Set DRUPAL_HASH_SALT}
      # SaaS: run-log storage stays off; only docker/compose/docker-compose.yml may enable it.
      FEATURE_FLAG_RUN_LOG_STORAGE: "0"
      # Cron sends scheduled mail too, so it needs the same SMTP passthrough.
      MAIL_SMTP_DSN: ${MAIL_SMTP_DSN:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
    volumes:
      - public_files:/var/www/html/web/sites/default/files
      - private_files:/var/www/html/private-files
      - tmp_files:/tmp
    command: >
      sh -c 'while true; do
        /var/www/html/vendor/bin/drush core:cron || true;
        sleep ${CRON_INTERVAL:-300};
      done'
    networks:
      - internal

  # The public docs site and plugin marketplace (Dockerfile `docs` target), independent of the
  # app. Profile-gated: only the stacks that set COMPOSE_PROFILES=docs (develop, prod) run it.
  docs:
    image: "${REGISTRY_IMAGE_DOCS:-}"
    profiles: [docs]
    restart: unless-stopped
    environment:
      DOCS_DOMAIN: ${DOCS_DOMAIN:-}
    networks:
      - internal

volumes:
  db:
  public_files:
  private_files:
  tmp_files:
  oauth_keys:

networks:
  internal:
  # The public-facing ingress network (traefik_proxy) is declared by
  # the per-environment ingress overlay, not here — see the nginx service note.
