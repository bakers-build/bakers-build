# keytec-AI project config. Consumed by the keytec-ddev-addon (`ddev init`, `ddev init-worktree`,
# QA commands). bakers.build does NOT distribute an anonymized DB via the registry — `ddev init` installs
# from config/sync (existing-config) or a recipe, never a prod dump — so there is no
# providers.registry / sanitize block.
init:
  # DB/site bring-up dispatches to a DDEV provider. bakers.build ships two project-owned providers under
  # .ddev/providers/ — the default `existing-config` and the recipe-as-installer `recipe` /
  # `recipe-test` — replacing the former `--recipe` / `--test` flags of the local init:
  #   ddev init                        -> existing-config  (site:install --existing-config; mirrors
  #                                                          the server's CIM-from-config/sync install)
  #   ddev init --provider recipe      -> recipe-as-installer + bakers-init-playground (playground world)
  #   ddev init --provider recipe-test -> recipe-as-installer + bakers-init-test (e2e/test world; CI)
  default_sync_provider: existing-config
  # Recipe-as-Installer profile for the recipe/recipe-test providers (surfaced to the container as
  # INIT_PROFILE by config.keytec.yaml). The recipe imports its modules + config but NOT content;
  # the content world is seeded by the bakers-init-<world> command the provider invokes.
  profile: /var/www/html/recipes/bakers
  # BUILD (before the DB provision, hard-fail): PHP deps + frontend theme build. A fresh worktree
  # has no vendor/ and no theme dist/, and after a rebase composer.lock may add modules a stale
  # vendor/ lacks — always install. Needed by every provider (existing-config + recipe[-test]).
  build: "ddev composer install && ddev exec 'cd web/themes/custom/bb_theme && pnpm install --frozen-lockfile && pnpm build'"
  # DEPLOY: intentionally ABSENT since BB-378. It used to be
  # `rm -rf tests/playwright/.auth` — site:install rebuilds the DB, so the Playwright session cached
  # there pointed at a dropped session and had to be dropped for DrushAuthProvider to re-mint one.
  # BB-378 deleted the whole Playwright suite (only Storybook gates the web UI now), so that
  # directory cannot exist and the hook had nothing left to do. The key is removed rather than
  # stubbed with a no-op: this is a hard-fail hook, and a command that exists only to succeed is
  # worse than no hook at all. If a post-provision step is ever needed again, add it back here.
  # Bb worktree bootstrap, re-homed from the former local init-worktree (BB-142): the addon's
  # `ddev init-worktree` runs this shell string verbatim as its final step, in the worktree root,
  # with DDEV_WORKTREE_NAME exported. It copies the parent worktree's bakers client config (so
  # `bakers dropsh` auth works with no re-login) and then runs
  # `scripts/setup-test-project.sh --workspace-only`, which checks the skill-test workspace out and
  # wires it to this checkout — building the CLI only when a dist artifact is missing or stale
  # (BB-390 moved the build out of the bootstrap and into its only consumer; a FRESH worktree has
  # no dist/ and therefore still builds once), starting no DDEV, and writing nothing to any control
  # plane. It clones the fixture project from a local bare repository seeded from the committed
  # tests/fixtures/bakers-playground tree, so it needs no SSH key or network access.
  #
  # MUST be a script invocation, NOT inline shell: keytec-ai also surfaces this via `config to-env`
  # as INIT_WORKTREE_POST, which `ddev init` eval-loads under `set -u` — inline `$(...)`/`${var}`
  # would be command-substituted / hit an unbound var at that eval and break `ddev init`. The
  # eval-safe one-liner keeps the real logic in .ddev/worktree-post.sh (run verbatim).
  #
  # NB: the addon only surfaces INIT_WORKTREE_POST when `keytec-ai`/`npx` is reachable on the host;
  # on a host lacking BOTH, `ddev init-worktree` silently skips this post step. The conductor
  # `after_create` hook (.bakers/conductor.config.js) therefore ALSO invokes the script directly as a
  # belt-and-suspenders (it is sentinel-guarded, so the pair never repeats the work) — BB-142.
  worktree_post: "bash .ddev/worktree-post.sh"

# No top-level deploy: block — keytec-ai >= v0.3.2 resolves the stack, domain and secret
# variables entirely from komodo/*.toml (the Resource Sync declaration).
