# BB-684: an enabled template for the ticket-template scenarios. Nothing
# instantiates it at seed time, so the project has no generated ticket until a
# scenario does.
_meta:
  version: '1.0'
  entity_type: bb_ticket_template
  uuid: 684a0000-0000-4000-8000-000000000004
  default_langcode: en
  depends:
    db1a0000-0000-4000-8000-000000000022: bb_term
    684a0000-0000-4000-8000-000000000003: bb_project
    dbe50000-0000-4000-8000-000000000001: user
default:
  name:
    -
      value: "Fixture template"
  enabled:
    -
      value: true
  title_pattern:
    -
      value: "Fixture ticket {{date}}"
  description:
    -
      value: "Generated from the fixture template."
      format: bb_rich
  workflow:
    -
      value: "bb_work"
  ticket_type:
    -
      entity: "db1a0000-0000-4000-8000-000000000022"
  target_state:
    -
      value: "qualification"
  project_id:
    -
      entity: "684a0000-0000-4000-8000-000000000003"
  owner_user_id:
    -
      entity: "dbe50000-0000-4000-8000-000000000001"
