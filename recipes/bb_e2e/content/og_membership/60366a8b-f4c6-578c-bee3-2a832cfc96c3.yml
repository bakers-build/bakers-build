# api-conductor-owner's workspace membership — new, not a rename (F5).
#
# claims.feature calls `POST /jsonapi/bakers/claim-next` as this account, which
# `ConductorResolverTrait::resolveConductor()` gates on the plain Drupal
# permission `claim bakers tickets` (`hasPermission()`, no OG-chain walk). This
# account never carried an `og_membership` fixture at all in this repo's
# history. Before BB-462, `claim bakers tickets` shipped on the workspace
# `app` role (verified against the pre-BB-462 config, commit fbaded64d);
# D9 deleted that role without migrating the permission anywhere else, so
# no account — this one included — had a path to it until the sibling fix
# on `contributor`/`lead` restored it. `contributor` is the tier that now
# carries it.
