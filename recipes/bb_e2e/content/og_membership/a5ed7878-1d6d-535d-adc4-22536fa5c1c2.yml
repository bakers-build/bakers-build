# Explicit tenancy/rank precondition for API contract scenarios.
#
# BB-462 D9: the workspace `app` role is gone — a conductor's OAuth
# identity now sees exactly what its owning user sees, and this fixture's
# account is that owning user. `lead`, NOT narrowed to `contributor`: F12
# asked whether this over-granted, and a first pass narrowed it, reasoning
# from the CREATE half of `conductor-assignment.feature` alone — that half
# does pass on `contributor` via this account's own team membership
# (…/8aed87e4). The REASSIGN half does not: PATCHing an existing ticket's
# `conductor_id` is an `update`, which needs `update any bb_ticket`, a
# permission only the workspace `lead` (admin) tier carries — `contributor`
# has no update-any right at all. Measured by running the full suite: the
# narrowed version failed `Reassigning an existing ticket…` for `fixture-app`
# with 403. `lead` is therefore justified here, not merely convenient — the
# same admin-parity `app` always had — and this fixture stays on it.
