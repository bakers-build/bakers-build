# Explicit tenancy/rank precondition for API contract scenarios.
#
# BB-462 D1: the implicit `member` rank now grants nothing. ticket-api.steps.ts's
# "the session actor owns a running lease" step deliberately restores this
# membership to its "ordinary seeded rank" after registration (so only
# session write authority, not a registration-derived one, is under test) —
# under the OLD model that ordinary rank was the implicit `member`; under
# D1 the equivalent ordinary floor is the explicit `contributor`. Without
# it, comments.feature's comment-creation step 403/422s: the account has
# neither `create bb_comment` nor `use text format bb_rich`.
