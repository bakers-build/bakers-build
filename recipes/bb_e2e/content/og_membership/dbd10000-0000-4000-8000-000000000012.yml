# The e2e machine identity's SECOND workspace membership (BB-472).
#
# `fixture-agent` (the `client_credentials` identity behind
# `scripts/setup-test-project.sh`'s generated playground connection) was, before
# this fixture, a member of exactly the default workspace only — reached
# implicitly through the workspace `app` role `bb_core_bb_conductor_insert()`
# grants the owner of the seeded conductors, not through an explicit
# `og_membership`. A single-workspace identity cannot exercise BB-472's
# workspace list/switch at all: the picker has nothing to switch TO.
#
# This membership adds Southside Bakery (`dbc60000-…-000000000002`, the
# BB-350/415 wrong-workspace fixture, see its own docblock) as a second,
# ordinary membership — no bypass role, no project, no ticket, nothing else
# reachable through it. The point is narrow: give the harness identity a second
# workspace to appear in `discoverBbWorkspaces()`, so `bakers ui`'s workspace
# picker (Task 5) and `--workspace` (Task 4) have a real second entry to select
# against the SAME identity, with no second Drupal user/login involved.
#
# `south-contributor` (single-membership, `other` only) remains the negative
# reference for "must not reach the default workspace"; this fixture is the
# positive "can switch between two" counterpart for the machine identity rather
# than a human login.
#
# No `roles` key: `member` is OG's structurally REQUIRED role.
# OgMembership::preSave() revokes it as implicit and getRoles() re-adds it, so
# naming it here is rejected outright — see the `south-contributor` fixture for the
# same note in full.
_meta:
  version: '1.0'
  entity_type: og_membership
  uuid: dbd10000-0000-4000-8000-000000000012
  bundle: default
  default_langcode: en
  depends:
    dbc60000-0000-4000-8000-000000000002: bb_workspace
    25d160a3-a2cd-4ebf-acce-5273c92bf1bb: user
