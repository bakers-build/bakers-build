# Explicit tenancy/rank precondition for API contract scenarios.
#
# BB-462 D9: the workspace `app` role is gone — a conductor's OAuth
# identity now sees exactly what its owning user sees, and this fixture's
# account is that owning user. `lead` (the workspace admin tier) is kept
# here, unlike the sibling `…/a5ed7878` fixture (api-app) F12 narrowed to
# `contributor`: this account carries NO team membership fixture, and
# `registration.feature`'s "api-machine-app registration returns 201"
# scenario reads `project.home` through the `/jsonapi/bb_project`
# collection filter before registering a conductor on it — a query only
# `lead`'s workspace-wide see-all reach (or team membership, which this
# account has none of) can open. The write permissions the scenario also
# exercises (`register bakers conductor`) come from the account's OAuth
# scope, not from this rank; the rank is here solely for the READ.
