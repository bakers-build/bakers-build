# The human workspace lead (BB-318 D10; renamed from `admin` by BB-359 D12).
#
# `cwiedemann` holds the `lead` rank, which is the fixture the workspace see-all
# rule is observable against end to end rather than only in kernel tests:
# the account holds no bb_project membership at all and still reaches every
# project of the workspace (D4, D11).
#
# The workspace named here is BbWorkspace::DEFAULT_UUID — the one
# bb_core_install() creates on every install path (BB-350). It is
# deliberately NOT shipped as recipe content: `system.site.front` points at
# its slug, so a second e2e workspace would split the world into the one the
# fixtures live in and the one the front page opens.
