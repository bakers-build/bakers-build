# bakers-e2e-agent's DEFAULT workspace membership — new, not a BB-462 role fix.
#
# `bakers-e2e-project` deliberately sits on "Design Crew"
# (dbc70000-…-000000000002), NOT the "Platform Crew" team this agent already
# belongs to (…/dbd10000-…0006) — that project's own fixture states why: "ONE
# crew, and deliberately the OTHER one… giving the two fixtures different
# crews is what makes a team's computed project list distinguishable from
# 'every project'". Before BB-462, the agent reached this project anyway
# through the workspace `app` rank, which `bb_core_bb_conductor_insert()`
# granted automatically to every conductor's owning user. D9 removes that
# mechanism entirely (the function it called is retained only for deploy-hook
# history and is now a documented no-op) without shipping a replacement
# fixture — this is that replacement. `bakers-cli/conductor/tests/integration/`
# (writeback.test.ts, conductor.test.ts, workspace-isolation.test.ts) all
# authenticate as this agent via HTTP Basic Auth (never OAuth), so the
# `BbRankCapability::machineScopeAnswer()` branch that answers a PURE
# client_credentials identity from its OAuth scope does not apply here at
# all — this agent needs an ordinary OG rank exactly like any other
# delegated human account. `lead` (workspace admin), not `contributor`: D4's
# "workspace admin sees every project of their workspace without joining any
# team" is precisely the reach this fixture restores, and only `lead` carries
# it — `contributor` would still need Design Crew membership, defeating the
# project fixture's whole "different crews" point.
