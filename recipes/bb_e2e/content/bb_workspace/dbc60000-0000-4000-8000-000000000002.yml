# The wrong-workspace target (BB-350 D6), and since BB-415 also the
# second-tenant landing target.
#
# It owns no group, no project and no ticket. It is no longer memberless: the
# docblock used to state that nobody is a member of it, and
# `og_membership/dbd10000-…-000000000009` makes `other-member` one, holding
# nothing else. That account is the subject of BB-415's fourth acceptance
# criterion — a member of a non-`bakers` workspace must land in THEIRS — which
# is unobservable in a world where every account's only workspace is the
# default one.
#
# ITS ORIGINAL JOB IS UNCHANGED, and that is measured rather than assumed: the
# wrong-workspace 404 scenario's actor is still `cwiedemann`, and `cwiedemann`
# is still not a member of this workspace, so `/other/ticket/BB-142` still
# reaches the workspace check and still answers 404. The new membership belongs
# to a different account and adds a landing subject without removing a refusal
# subject.
#
# Its whole job is to be a second, existing, correctly-slugged workspace, so the
# browser suite can ask for a ticket of the `bakers` workspace under `/other/…`
# and measure a 404 that is the WORKSPACE CHECK talking.
#
# Without it the suite could only test an unknown slug (`/nope/…`), which never
# reaches the workspace check at all — the slug converter rejects it first. The
# case this ticket exists for is "the entity exists, the workspace is wrong", and
# it takes two workspaces to express.
#
# The workspace the rest of the e2e world lives in is NOT shipped here: it is
# BbWorkspace::DEFAULT_UUID, created on every install path by
# bb_core_install(). Shipping a second one would fork the world in two — one
# workspace holding the fixtures and another holding `system.site.front`.
_meta:
  version: '1.0'
  entity_type: bb_workspace
  uuid: dbc60000-0000-4000-8000-000000000002
  default_langcode: en
default:
  name:
    -
      value: "other workspace"
  slug:
    -
      value: "other"
