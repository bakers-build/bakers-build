# The guest reviewer of the ticket's inline addons card.
#
# A workspace GUEST of the seeded `bakers` workspace: it may view tickets, but
# not update them and not register a conductor. That is the account the
# addon access split is observed with — an action with `access: view` (Ports
# Share/Stop) is offered and accepted, one with `access: update` (Ports Reap)
# is neither offered nor accepted from it.
#
# No `user_role`: everything it can do comes from its memberships.
