name: 'bakers.build Base'
description: 'Minimal Drupal control-plane base without an admin theme. No node/media.'
type: 'Site'
install:
  - block
  # Core dynamic page cache (BB-683): anonymous/cacheable admin and product
  # responses are served from the page cache; personalised/uncacheable
  # responses are unaffected because they carry no cacheability that qualifies.
  - dynamic_page_cache
config:
  actions:
    # No admin theme: every route, core admin pages included, renders in the
    # default theme.
    system.theme:
      simpleConfigUpdate:
        admin: ''
