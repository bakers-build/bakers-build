langcode: en
status: true
dependencies:
  config:
    - island.app.bakers
    - system.menu.bakers-rail
  module:
    - bb_api_key
    - bb_core
    - bb_ticket_trigger
    - bb_track
    - bb_webhook
    - island_ui_patterns
    - system
    - ui_patterns
  theme:
    - bb_theme
  enforced:
    config:
      - island.app.bakers
id: bb_shell
label: 'bakers.build application shell'
app: bakers
layout: 'bb_theme:shell'
layout_settings: {  }
placements:
  # `nav`'s items come from the `bb_menu` source (the ui_patterns menu
  # source shaped for nav, see `BbMenuSource`) over the `bakers-rail` menu. The account side
  # is a separate profile, `bb_shell_account`, which matches account-area
  # routes through its `bb_user_area_route` condition and is weighted
  # ahead of this one. `nav`
  # fills the rail's own `navigation` slot,
  # `account_switcher` fills its `workspace` slot from the ambient workspace
  # (`bb_workspace_switcher`) and lists every workspace the account may enter
  # (`bb_workspace_switcher_panel`). `multiple` is true when that list has
  # more than one row, so a single-workspace account still renders as a plain
  # label. The rail's `actions` foot carries the signed-in account (linked to
  # its profile) beside the colour-mode toggle. `boost` and `target_placement`
  # are unchanged: they describe the placement's own island behaviour, not
  # which component fills it.
  shell_rail:
    plugin_id: ui_patterns_component
    slot: sidebar
    weight: 0
    enabled: true
    events:
      - bakers.team.created
      - bakers.entity.renamed
      - bakers.favorites.changed
    configuration:
      component:
        component_id: 'bb_theme:sidebar'
        variant_id: null
        props:
          label:
            source_id: textfield
            source:
              value: 'Workspace navigation'
        slots:
          workspace:
            sources:
              - source_id: component
                source:
                  component:
                    component_id: 'bb_theme:account_switcher'
                    variant_id: null
                    props:
                      multiple:
                        source_id: bb_workspace_switcher
                        source: {  }
                      workspace_label:
                        source_id: bb_workspace_switcher
                        source: {  }
                      workspace_initials:
                        source_id: bb_workspace_switcher
                        source: {  }
                      workspace_color:
                        source_id: bb_workspace_switcher
                        source: {  }
                      workspace_picture:
                        source_id: bb_workspace_switcher
                        source: {  }
                    slots:
                      workspace_panel:
                        sources:
                          - source_id: bb_workspace_switcher_panel
                            source: {  }
          navigation:
            sources:
              - source_id: component
                source:
                  component:
                    component_id: 'bb_theme:nav'
                    variant_id: null
                    props:
                      label:
                        source_id: textfield
                        source:
                          value: Primary
                      variant:
                        source_id: textfield
                        source:
                          value: main
                      items:
                        source_id: bb_menu
                        source:
                          menu: bakers-rail
                    slots: {  }
          actions:
            sources:
              - source_id: component
                source:
                  component:
                    component_id: 'bb_theme:person'
                    variant_id: null
                    props:
                      variant:
                        source_id: textfield
                        source:
                          value: compact
                      display_name:
                        source_id: bb_current_user_person_props
                        source: {  }
                      initials:
                        source_id: bb_current_user_person_props
                        source: {  }
                      color:
                        source_id: bb_current_user_person_props
                        source: {  }
                      picture:
                        source_id: bb_current_user_person_props
                        source: {  }
                      url:
                        source_id: bb_current_user_person_props
                        source: {  }
                      size:
                        source_id: textfield
                        source:
                          value: md
                    slots: {  }
                _weight: '0'
              - source_id: component
                source:
                  component:
                    component_id: 'bb_theme:mode_toggle'
                    variant_id: null
                    props:
                      label:
                        source_id: textfield
                        source:
                          value: 'Choose appearance'
                    slots: {  }
                _weight: '1'
      boost: true
      target_placement: shell_content_island
      also_placements:
        - shell_page_header
    data: {  }
  shell_page_header:
    plugin_id: ui_patterns_component
    slot: content
    weight: 1
    enabled: true
    events:
      - bakers.entity.renamed
    configuration:
      component:
        component_id: 'bb_theme:page_header'
        variant_id: null
        props:
          title:
            source_id: bb_page_title
            source: {  }
          description:
            source_id: bb_page_header_description
            source: {  }
        slots:
          subline:
            sources:
              - source_id: bb_page_header_description
                source: {  }
          leading:
            sources:
              - source_id: bb_entity_page_header_mark
                source: {  }
          breadcrumb:
            sources:
              - source_id: bb_run_breadcrumb
                source: {  }
              - source_id: bb_comment_breadcrumb
                source: {  }
          tabs:
            sources:
              - source_id: block
                source:
                  plugin_id: local_tasks_block
          actions:
            sources:
              - source_id: bb_create_action
                source:
                  route: entity.bb_ticket.create_form
                  screens:
                    - 'view.tickets.*'
                  query:
                    - '*'
                  route_query:
                    project: bb_project
              - source_id: bb_create_action
                source:
                  route: entity.bb_project.create_form
                  screens:
                    - view.projects.workspace_list
              - source_id: island_placement
                source:
                  placement: shell_project_favorite
              - source_id: bb_create_action
                source:
                  route: entity.bb_ticket_template.add_for_project
                  screens:
                    - view.bb_ticket_templates.project_list
              - source_id: bb_create_action
                source:
                  route: entity.bb_ticket_template.add_for_workspace
                  screens:
                    - view.bb_ticket_templates.workspace_list
              - source_id: bb_create_action
                source:
                  route: entity.bb_term.add_form
                  screens:
                    - view.bb_terms.types
                  route_parameters:
                    bb_vocabulary: type
                  label: 'Add type'
              - source_id: bb_create_action
                source:
                  route: entity.bb_term.add_form
                  screens:
                    - view.bb_terms.recipes
                  route_parameters:
                    bb_vocabulary: recipe
                  label: 'Add recipe'
              - source_id: bb_create_action
                source:
                  route: entity.bb_term.add_form
                  screens:
                    - view.bb_terms.labels
                  route_parameters:
                    bb_vocabulary: label
                  label: 'Add label'
              - source_id: bb_create_action
                source:
                  route: entity.bb_environment.add_for_project
                  screens:
                    - view.bb_environments.project_list
              - source_id: bb_create_action
                source:
                  route: entity.bb_ticket_trigger.add_form
                  screens:
                    - view.bb_ticket_triggers.template_list
              - source_id: bb_create_action
                source:
                  route: entity.bb_webhook.add_for_project
                  screens:
                    - view.bb_webhooks.project_list
              - source_id: bb_create_action
                source:
                  route: entity.bb_webhook.add_for_group
                  screens:
                    - view.bb_webhooks.group_list
              - source_id: bb_create_action
                source:
                  route: entity.bb_webhook.add_for_workspace
                  screens:
                    - view.bb_webhooks.workspace_list
              - source_id: bb_create_action
                source:
                  route: entity.bb_group.create_form
                  screens:
                    - view.groups.workspace_list
              - source_id: bb_create_action
                source:
                  route: bb_core.workspace_invite
                  screens:
                    - bb_core.bb_workspace.members
                  trigger_id: members-invite
              - source_id: bb_create_action
                source:
                  route: bb_core.bb_team.member_add
                  screens:
                    - bb_core.bb_team.members
                  trigger_id: members-add
              - source_id: bb_worklog_create_action
                source:
                  route: bb_track.worklog.add
                  screens:
                    - view.worklog.page
                    - view.worklog.personal
                    - view.worklog.team
                    - view.worklog.project
                  query:
                    - date
                    - project
                    - ticket
                    - submission
                  route_query:
                    project: bb_project
              - source_id: bb_create_action
                source:
                  route: bb_track.account_add
                  screens:
                    - bb_track.account
              - source_id: bb_create_action
                source:
                  route: bb_api_key.service_account.add
                  screens:
                    - view.bb_service_accounts.settings
      boost: true
      target_placement: shell_content_island
    data: {  }
  # The project overview's favorite toggle, embedded in the page header's
  # actions; its toggle announces `bakers.favorites.changed` to the rail.
  shell_project_favorite:
    plugin_id: bb_project_favorite
    slot: embedded
    weight: 0
    enabled: true
    configuration: {  }
    data: {  }
  shell_content_island:
    plugin_id: page_content
    slot: content
    weight: 2
    enabled: true
    configuration:
      content_source_id: shell_main
      also_placements:
        - shell_page_header
    data: {  }
  shell_status_bar:
    plugin_id: ui_patterns_component
    slot: footer
    weight: 3
    enabled: true
    configuration:
      component:
        component_id: 'bb_theme:status_bar'
        variant_id: null
        props: {  }
        slots: {  }
    data: {  }
weight: -10
# `/user/*` is account settings. The account-area routes match
# `bb_shell_account` first (lower weight); gate wins on `/user/login`,
# `/user/register`, `/user/check-mail` and `/user/reset/*` because it is
# selected first at the same weight.
condition_operator: and
conditions:
  request_path:
    id: request_path
    negate: false
    pages: |-
      /_workspace/*
      /user/*
      /time/submission/*
