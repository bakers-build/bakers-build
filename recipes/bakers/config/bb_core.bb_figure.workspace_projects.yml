langcode: en
status: true
dependencies:
  config:
    - bb_core.bb_measurement.closed_tickets
    - bb_core.bb_measurement.created_tickets
    - bb_core.bb_measurement.job_rating
    - bb_core.bb_measurement.open_tickets
    - bb_core.bb_measurement.rated_tickets
    - bb_core.bb_measurement.run_tokens
    - bb_core.bb_measurement.runs
    - bb_core.bb_measurement.runs_per_ticket
id: workspace_projects
label: Projects
description: "Closed, created and open tickets, runs per closed ticket, job rating and run tokens per project. Date basis: ticket closed_date, ticket creation time and run creation time. Attribution basis: the ticket's project in this workspace."
weight: 4
widget: table
measurements:
  - closed_tickets
  - created_tickets
  - open_tickets
  - runs
  - runs_per_ticket
  - job_rating
  - rated_tickets
  - run_tokens
categories:
  type: dimension
  dimension: project
  fill: true
series: {  }
ratio: {  }
filters:
  period:
    label: Period
    default: month
    options:
      -
        value: week
        label: Week
      -
        value: month
        label: Month
      -
        value: quarter
        label: Quarter
      -
        value: year
        label: Year
      -
        value: all
        label: 'All time'
      -
        value: custom
        label: Custom
  project:
    label: Project
    type: entities
    binding: project
  team:
    label: Team
    type: entities
    binding: team
  user:
    label: Person
    type: entities
    binding: user
context_shape:
  - workspace
conditions:
  workspace:
    id: bb_route_context
    negate: false
    context_mapping:
      entity: workspace
    entity_type: bb_workspace
