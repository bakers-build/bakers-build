module: views
description: |-
  Three listings of bb_conductor. The user-area rail item (user_list) is the
  conductors assigned to the account in the URL, any workspace. The project
  tab (project_list) is that project's conductors, any owner. The Board block
  (board) is that project's active conductors, placed below the Board columns.
  All walk project_id then group_id because bb_conductor carries no workspace
  field of its own. Both joins are INNER: a conductor whose project or group
  is gone has no workspace to be listed under.
