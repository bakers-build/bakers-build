langcode: en
status: true
dependencies:
  config:
    - bb_core.bb_measurement.closed_tickets
    - bb_core.bb_measurement.job_rating
    - bb_core.bb_measurement.rated_tickets
    - bb_core.bb_measurement.run_tokens
    - bb_core.bb_measurement.runs
id: user_projects
label: 'My projects'
description: "Closed tickets, runs per closed ticket, job rating and run tokens per project. Date basis: ticket closed_date and run creation time. Attribution basis: the ticket's current assignee, in every workspace."
weight: 2
widget: table
measurements:
  - closed_tickets
  - runs
  - job_rating
  - rated_tickets
  - run_tokens
categories:
  type: dimension
  dimension: project
series: {  }
ratio: {  }
filters:
  period:
    label: Period
    default: month
    options:
      -
        value: week
        label: Week
      -
        value: month
        label: Month
      -
        value: quarter
        label: Quarter
      -
        value: year
        label: Year
      -
        value: all
        label: 'All time'
      -
        value: custom
        label: Custom
  project:
    label: Project
    type: entities
    binding: project
context_shape:
  - user
conditions:
  user:
    id: bb_route_context
    negate: false
    context_mapping:
      entity: user
    entity_type: user
