weight: 0
widget: grouped_horizontal_bars
measurements:
  - closed_tickets
  - runs
categories:
  type: dimension
  dimension: project
series: {  }
ratio: {  }
filters:
  period:
    label: Period
    default: week
    options:
      -
        value: week
        label: Week
      -
        value: month
        label: Month
      -
        value: quarter
        label: Quarter
      -
        value: year
        label: Year
      -
        value: all
        label: 'All time'
      -
        value: custom
        label: Custom
context_shape:
  - team
  - user
conditions:
  team:
    id: bb_route_context
    negate: false
    context_mapping:
      entity: team
    entity_type: bb_team
  user:
    id: bb_route_context
    negate: false
    context_mapping:
      entity: user
    entity_type: user
