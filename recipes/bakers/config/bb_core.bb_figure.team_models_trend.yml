    - bb_core.bb_measurement.run_tokens
id: team_models_trend
label: 'Token spend by model over time'
description: "Token spend by model, per day or month bucket, for this team. Date basis: run creation time. Attribution basis: the run's ticket's project, which belongs to this team. Token unit: consumption."
weight: 1
widget: line
measurements:
  - run_tokens
categories:
  type: days
series:
  dimension: model
  limit: 5
ratio: {  }
filters:
  period:
    label: Period
    default: week
    options:
      -
        value: week
        label: Week
      -
        value: month
        label: Month
      -
        value: quarter
        label: Quarter
      -
        value: year
        label: Year
      -
        value: all
        label: 'All time'
      -
        value: custom
        label: Custom
context_shape:
  - team
conditions:
  team:
    id: bb_route_context
    negate: false
    context_mapping:
      entity: team
    entity_type: bb_team
