# The keytec team member's workspace membership (BB-391 D5).
#
# BB-391 D2 deletes the site-wide `bb_agent`/`bb_session` roles this
# account used to carry, and D5 moves the OAuth consumer selector in
# `scripts/deploy/ensure-oauth.php` off that role and onto workspace membership.
# Both changes make this fixture load-bearing: without it the account would hold
# no capability at all AND would be skipped by the consumer seed — and neither
# failure announces itself, because the seed script prints a line per consumer it
# creates and says nothing about an account it never selected.
#
# At the base commit NINE user fixtures carried `bb_agent` and exactly ONE
# carried a membership, so the selector change alone would have cut the seed from
# nine team members to one. SiteWideRoleResidueTest asserts the parity over the
# fixture SETS, so a team user added later without a membership fails loudly.
#
# Only cw holds an explicit rank: `bb_project_manager` was migrated onto
# `lead` by BB-359. Every other membership carries no `roles` key at all —
# OG derives the implicit `member` rank on read and refuses to store it
# (BB-561), so naming it here would describe a state OG does not model.
#
# The workspace named here is BbWorkspace::DEFAULT_UUID, the one
# bb_core_install() creates on every install path (BB-350); it is
# deliberately not shipped as recipe content, because `system.site.front`
# points at its slug.
