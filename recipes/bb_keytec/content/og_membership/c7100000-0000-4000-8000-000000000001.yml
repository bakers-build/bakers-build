      value: 2a92d03c-c4c6-41dc-b194-31aa299ed064
  uid:
    -
      entity: "3b72a85c-4455-4c86-b207-bdcc7de4fdc6"
  roles:
    -
      target_id: bb_workspace-bb_workspace-lead
  state:
    -
      value: active
