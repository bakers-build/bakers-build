# Slack app of the PM bot. Create it by hand: api.slack.com/apps → Create New App →
# From a manifest, then install it and invite the bot to the allowed channels.
# Socket Mode, channel messages and mentions only; no direct messages.
display_information:
  name: PM Bot
features:
  bot_user:
    display_name: pm-bot
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  socket_mode_enabled: true
