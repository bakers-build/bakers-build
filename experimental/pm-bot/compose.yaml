# The PM bot in a Coder workspace (README.md). The workspace template's pm-bot.sh brings it up on
# every start with docker compose -p pm-bot, setting the PM_BOT_* variables below:
#   PM_BOT_IMAGE  the pinned bot image (template variable pm_bot_image, tag and digest)
#   PM_BOT_DATA   ~/.pm-bot/data: Hermes' home with sessions, memories and the env file
#   PM_BOT_CLONE  ~/.pm-bot/clone: the secret-free clone of the project's repository
#   PM_BOT_UID, PM_BOT_GID  the workspace user, whom Hermes maps its hermes user to
#
# The container sees those two directories only, the clone read-only, and never the Docker
# socket. Hermes' bootstrap starts as root to remap its user and prepare the data directory,
# then drops to it; these are the only capabilities that bootstrap needs, and the s6
# supervisor that runs it needs DAC_OVERRIDE to reach the directories it hands to hermes.
services:
  pm-bot:
    image: ${PM_BOT_IMAGE}
    restart: unless-stopped
    env_file: ${PM_BOT_DATA}/.env
    environment:
      HERMES_UID: ${PM_BOT_UID}
      HERMES_GID: ${PM_BOT_GID}
    volumes:
      - ${PM_BOT_DATA}:/opt/data
      - ${PM_BOT_CLONE}:/opt/clone:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN # cap
      - SETUID # cap
      - SETGID # cap
      - DAC_OVERRIDE # cap
    security_opt:
      - no-new-privileges:true
