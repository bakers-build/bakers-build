<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden;font-family:var(--font-sans)}
  .main{flex:1;background:var(--gin-primary);display:flex;align-items:center;justify-content:center}
  .mark{color:#fff;font-weight:800;font-size:300px;letter-spacing:-.02em;line-height:1}
  .strip{width:320px;display:flex;flex-direction:column}
  .strip > div{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><div class="mark">bakers.build</div></div>
  <div class="strip">
    <div style="background:#FFC024"></div>
    <div style="background:#4BB9AE"></div>
    <div style="background:#8197F8"></div>
    <div style="background:#FF4E42"></div>
  </div>
</div>
</body>
</html>
