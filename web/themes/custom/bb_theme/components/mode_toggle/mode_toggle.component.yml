$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Mode Toggle
status: stable
group: Action
description: >-
  Appearance picker: Light, Dark or System, where System follows the operating
  system's colour scheme. Persists the choice locally through the synchronous
  mode bootstrap (js/skin.src.js).
provider: bb_theme
props:
  type: object
  properties:
    mode:
      type: string
      enum:
        - light
        - dark
        - system
      title: Mode
      description: >-
        Choice checked before the runtime reads the stored one, for static
        rendering only -- the runtime source of truth is js/skin.src.js, which
        sets html[data-mode].
    label:
      type: string
      title: Accessible label
      description: aria-label for the button.
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
