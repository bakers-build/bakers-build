$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Brand
status: stable
group: Shell
description: bakers.build login heading with the logo and wordmark.
props:
  type: object
  properties:
    size:
      type: string
      enum:
        - default
        - compact
      title: Size
      description: >-
        `default` is the full mark onboarding uses. `compact` is the 128px mark
        the gate chrome uses, so a gate page's message rather than its mark is
        the dominant element. The compact mark is a plain image, leaving the
        screen its h1; its width comes from `component.brand.compact.width` and
        does not follow the layout density.
      default: default
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
