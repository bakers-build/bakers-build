$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Select
status: stable
group: Form
description: >-
  Native select element styled like `form_input`, and never wider than its
  container. It carries no label (the wrapping form_label/form_element owns it)
  and passes the real Drupal `attributes` straight through. `options` is the
  shape Drupal's `form_select_options()` gives `select.html.twig`: `{ value,
  label, selected }` entries and `{ type: optgroup, label, options }` groups.
provider: bb_theme
props:
  type: object
  properties:
    name:
      type: string
      title: Name attribute
    id:
      type: string
      title: ID attribute
    options:
      type: array
      title: Options
      description: >-
        Options in display order. An entry is `{ value, label, selected }`; an
        entry with `type: optgroup` groups its own `options` under `label`.
      items:
        type: object
        properties:
          type:
            type: string
            enum:
              - option
              - optgroup
            title: Entry type
          value:
            type: string
            title: Value
          label:
            type: string
            title: Label
          selected:
            type: boolean
            title: Selected
          options:
            type: array
            title: Group options
            items:
              type: object
              properties:
                value:
                  type: string
                label:
                  type: string
                selected:
                  type: boolean
    multiple:
      type: boolean
      title: Multiple
    required:
      type: boolean
      title: Required
    disabled:
      type: boolean
      title: Disabled
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
