$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Sidebar
status: stable
group: Shell
description: >-
  Linear-style left navigation rail: workspace switcher on top, the primary
  navigation below it, a collapse toggle on the rail's right edge and an actions
  area at the foot. Collapsed it keeps the icons and drops the labels; the state
  is a prop and the toggle drives the same accessible attributes at runtime.
provider: bb_theme
props:
  type: object
  properties:
    collapsed:
      type: boolean
      title: Collapsed
      description: Render the icon-only rail. The toggle flips the same state at runtime.
    id:
      type: string
      title: Id
      description: Base id for the rail; the collapsible body derives its id from it.
    label:
      type: string
      title: Accessible label for the rail landmark
slots:
  workspace:
    title: Workspace
    description: Workspace switcher at the head of the rail.
  navigation:
    title: Navigation
    description: Primary navigation — the rail is the navigation landmark.
  actions:
    title: Actions
    description: Optional actions at the foot of the rail.
variants:
  expanded:
    title: Expanded
    description: >-
      Full rail with the workspace name, the navigation labels and the nested
      settings sub-navigation.
  collapsed:
    title: Collapsed
    description: >-
      Icon-only rail; the labels and the workspace name are hidden, the six
      entries stay as icons.
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
