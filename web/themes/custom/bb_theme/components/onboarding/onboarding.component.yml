$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Onboarding
status: stable
group: Shell
description: >-
  The onboarding chrome — `gate`'s sibling and the third chrome after `shell`.
  One centred column: the product mark, the current step's heading and its
  one-sentence description, and below them a surface card holding the form. The
  copy arrives as props from the wizard form rather than from the Island
  Profile, because it belongs to the step and a profile's layout settings are
  static config.
provider: bb_theme
props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Current-step heading, and the frame's single h1.
    description:
      type: string
      title: Description
      description: One sentence explaining the current step.
slots:
  mark:
    title: Mark
    description: The product mark, above the step's heading.
  content:
    title: Content
    description: The wizard form, inside the surface card below the copy.
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
