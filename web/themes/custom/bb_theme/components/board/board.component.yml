$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Board
status: stable
group: Data Display
description: >-
  A board: its controls, the active filters, ONE bounded scroll region of
  columns, and the conductors below it. The board owns its columns: a column is
  DATA (`columns`, Designbook) or a rendered Views column display
  (`column_views`, the project Board), and both draw their chrome through the
  `column()` macro this template declares - there is no column component,
  because a column is an item of the board exactly as a row is an item of a
  table (D2/D3; tests/contract/data-display-components.sh B1).


  THE COLUMN MACRO. `{% import 'bb_theme:board' as board %}{{ board.column(c)
  }}` draws one column from a hash `c`: `label` (column name, or the exact state
  key when nested), `count`, `tone` (running | attention | wait | idle |
  neutral: the header dot), `caption` ("last 7 days"), `hints` (list of strings
  such as "empty: review"), `toggle` ({label, url}: "Show done", "Show older"),
  `collapsed` (header, caption and toggle only), `group` (a panel whose content
  is a row of nested columns; its count is the sum), `nested` (a state
  sub-column inside a group: mono label, count, no dot), `terminal` (the Done
  column: dashed outline, no fill), `content` (rendered cards, or nested columns
  for a group), `empty` (what an empty column says, such as "No ticket matches
  these filters."), `pager` and `attributes`. The header sticks to the top of
  the scroll region; an empty column keeps its header and count. This is the
  same address `list` uses for `table`'s `cell()`: a component id resolves in
  Drupal and in Storybook alike.


  THE COLUMN AREA IS THE ONLY SIDEWAYS SCROLL REGION. It is bounded to the
  viewport height (`max-h-shell-height`) and scrolls both ways, so column
  headers stick to its top while the page header, the toolbar, the active
  filters and the conductors stay put. Columns keep at least 240 px at the
  default density. Native scrolling only: Shift + mouse wheel scrolls the region
  sideways without any script, and no scrollbar is drawn. A hairline with the
  shadow-2 token sticks to the right edge while columns are cut off; a cover of
  the page surface at the end of the row hides it once the last column is in
  view.


  `details` and `done_open` are the real Details and Done preferences: on the
  data columns they split Working by state and open Done. The story-only
  operational mode (Owner select, Done 10/25/50, client-side filtering) is gone
  (BAKERS-55 Decision 23).
provider: bb_theme
props:
  type: object
  properties:
    columns:
      type: array
      title: Columns
      description: >-
        The columns, in render order, as DATA - never rendered column
        components. Each renders through the `column()` macro of this template.
        A column named Working splits by state with `details`; a column named
        Done collapses unless `done_open`.
      items:
        type: object
        properties:
          name:
            type: string
            title: Phase name
            description: Phase heading.
          count:
            type: integer
            title: Card count
            description: Displayed count; defaults to the number of cards.
          dot:
            type: string
            enum:
              - running
              - attention
              - wait
              - idle
            title: Header tone
            description: >-
              Tone of the column header dot: wait for Not assigned, attention
              for Intake, running for Working, idle for Done. The name always
              says what the column is, so the dot never carries meaning alone.
          cards:
            type: array
            title: Cards
            description: >-
              The cards in this column, each a plain-data record of
              `board-card`'s own props plus the three values its footer line is
              composed from. Empty or absent, the column shows the `empty` slot.
            items:
              type: object
              properties:
                identifier:
                  type: string
                  title: Card identifier
                title:
                  type: string
                  title: Card title
                status:
                  type: string
                  enum:
                    - running
                    - attention
                    - needs_input
                    - wait
                    - idle
                  title: Derived status
                  description: >-
                    The card's accent edge, and the tone of the footer's state
                    badge. One value, read twice by design — never two values
                    that can disagree.
                priority:
                  type: string
                  enum:
                    - p1
                    - p2
                    - p3
                  title: Priority label
                type:
                  type: string
                  title: Type key
                  description: >-
                    Drives the card colour. Accepts the short key or the
                    workflow id; the leading prefix is stripped for the lookup.
                state:
                  type: string
                  title: Workflow state key
                  description: >-
                    The card's EXACT state, rendered as the LABEL of the
                    footer's dotted badge. The column carries only the phase, so
                    this is the only place the state is legible — and it is
                    text, never colour alone.
                url:
                  type: string
                  title: Canonical URL
                lease:
                  type: string
                  title: Machine holding the lease
                  description: >-
                    The machine id, rendered as a mono lease badge with a lock.
                    Absent where no lease is held, and absent rather than empty:
                    a badge with no label would claim a machine owns the card.
                assignee_name:
                  type: string
                  title: Assignee name
                assignee_initials:
                  type: string
                  title: Assignee initials
                  description: >-
                    The presence of initials is what puts an assignee on the
                    footer at all; an unassigned card renders none rather than
                    an empty avatar.
                assignee_color:
                  type: string
                  enum:
                    - running
                    - attention
                    - unassigned
                    - lease
                    - offline
                  title: Assignee avatar colour key
                blocked_by:
                  type: array
                  items:
                    type: string
                  title: Blocked by
                  description: >-
                    Identifiers of the open blockers the reader may view,
                    rendered in mono after "Blocked by". Replaces the former
                    `blocked` flag, which counted closed blockers too.
                blocked_hidden:
                  type: boolean
                  default: false
                  title: Hidden blocker
                  description: >-
                    The ticket has an open blocker the reader may not view. With
                    an empty `blocked_by` the marker reads "Blocked by" alone
                    and names nothing, so no identifier leaks across access.
                run_count:
                  type: integer
                  title: Run count
                  description: >-
                    How many runs the ticket has. Zero or absent renders no run
                    line.
                last_run_state:
                  type: string
                  enum:
                    - claimed
                    - running
                    - done
                    - expired
                    - failed
                    - cancelled
                  title: Newest run state
                  description: >-
                    The state of the newest run. `failed` and `expired` turn the
                    run line red.
          caption:
            type: string
            title: Caption
            description: Meta line under the header, such as "last 7 days".
          toggle:
            type: object
            title: Toggle link
            description: >-
              "Show done" or "Show older" for the Done column; a link, so it
              works without JavaScript.
            properties:
              label:
                type: string
              url:
                type: string
            required:
              - label
              - url
    details:
      type: boolean
      default: false
      title: Details
      description: >-
        States instead of Phases: the data column named Working becomes a group
        with one nested column per state plan, working and review that has
        cards, and the hint "empty: <state>" for each that has none. Its count
        stays the sum.
    done_open:
      type: boolean
      default: false
      title: Done open
      description: >-
        Shows the cards of the data column named Done; closed, that column keeps
        only its header, caption and toggle.
slots:
  empty:
    title: Empty
    description: >-
      What an empty data column says: the caller's sentence. Without it the
      column keeps only its header and count.
  toolbar:
    title: Toolbar
    description: 'The filter bar above the columns: `bb_theme:filters` with layout toolbar.'
  column_views:
    title: Column views
    description: >-
      The paged Views column displays, each drawn through `board.column()`. When
      filled, the data `columns` are not rendered.
  filters_active:
    title: Filters Active
    description: >-
      The active filter chips with their counts and "N of M open tickets":
      `bb_theme:active-filters`.
  conductors:
    title: Conductors
    description: >-
      The Active conductors section below the columns, not affected by ticket
      filters.
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
