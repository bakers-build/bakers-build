$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Board
status: stable
group: Data Display
description: >-
  A board that owns its columns and cards. Optional operational controls filter
  by lane, limit Done to the 10, 25 or 50 most recently closed cards from the
  Done column, and split Working by exact workflow state.
provider: bb_theme
props:
  type: object
  properties:
    columns:
      type: array
      title: Columns
      description: >-
        The columns, in render order, as DATA — never rendered column
        components, which is what the removed `columns` slot used to take. The
        order is the board's: a card does not choose a column, it is placed in
        one.
      items:
        type: object
        properties:
          name:
            type: string
            title: Phase name
            description: Phase heading.
          count:
            type: integer
            title: Card count
            description: Legacy count; operational boards derive the visible count.
          dot:
            type: string
            enum:
              - running
              - attention
            title: Header tone
            description: >-
              Present where the phase itself has a status worth showing; the
              header badge then carries the tone and a dot. Absent, the header
              is the name alone — a dot with nothing to say is worse than no
              dot.
          cards:
            type: array
            title: Cards
            description: >-
              The cards in this column, each a plain-data record of
              `board-card`'s own props plus the three values its footer line is
              composed from. Empty or absent, the column shows the `empty` slot.
            items:
              type: object
              properties:
                identifier:
                  type: string
                  title: Card identifier
                title:
                  type: string
                  title: Card title
                status:
                  type: string
                  enum:
                    - running
                    - attention
                    - needs_input
                    - wait
                    - idle
                  title: Derived status
                  description: >-
                    The card's accent edge, and the tone of the footer's state
                    badge. One value, read twice by design — never two values
                    that can disagree.
                priority:
                  type: string
                  enum:
                    - p1
                    - p2
                    - p3
                  title: Priority label
                type:
                  type: string
                  title: Type key
                  description: >-
                    Drives the card colour. Accepts the short key or the
                    workflow id; the leading prefix is stripped for the lookup.
                state:
                  type: string
                  title: Workflow state key
                  description: >-
                    The card's EXACT state, rendered as the LABEL of the
                    footer's dotted badge. The column carries only the phase, so
                    this is the only place the state is legible — and it is
                    text, never colour alone.
                url:
                  type: string
                  title: Canonical URL
                lease:
                  type: string
                  title: Machine holding the lease
                  description: >-
                    The machine id, rendered as a mono lease badge with a lock.
                    Absent where no lease is held, and absent rather than empty:
                    a badge with no label would claim a machine owns the card.
                assignee_name:
                  type: string
                  title: Assignee name
                assignee_initials:
                  type: string
                  title: Assignee initials
                  description: >-
                    The presence of initials is what puts an assignee on the
                    footer at all; an unassigned card renders none rather than
                    an empty avatar.
                assignee_color:
                  type: string
                  enum:
                    - running
                    - attention
                    - unassigned
                    - lease
                    - offline
                  title: Assignee avatar colour key
                assignee_id:
                  type: string
                  title: Assignee ID; empty means unassigned
                lane_id:
                  type: string
                  title: Owner lane ID; empty means unassigned
                closed_date:
                  type: string
                  title: ISO 8601 closing timestamp; empty means unavailable
                blocked:
                  type: boolean
                  default: false
    controls_enabled:
      type: boolean
      default: false
      title: Operational controls
    details_default:
      type: boolean
      default: false
      title: Initial Details state
      description: >-
        True for developer contexts (including dual roles), false for PM
        contexts.
    as_of:
      type: string
      title: Clock for closing-date filters
      description: >-
        ISO 8601 timestamp used to exclude future closing dates; defaults to the
        current time.
    filter_title:
      type: string
      title: Filter label
      description: >-
        Visible label of the operational people filter. The Project Board
        preview passes the Drupal control's label; other stories may omit it and
        keep the generic default.
    filter_options:
      type: object
      title: Filter choices
      properties:
        lanes:
          type: array
          items:
            type: object
            required:
              - value
              - label
            properties:
              value:
                type: string
              label:
                type: string
slots:
  empty:
    title: Empty
    description: >-
      What a column with no cards shows — a sentence that names WHAT is absent
      over what period, which is a thing a screen knows and a board does not.
      ONE slot rather than one per column, exactly as `table` and `list` have
      one: a slot per column would be a slot per item again, which is the escape
      hatch the container exists to close.
  toolbar:
    title: Toolbar
    description: >-
      Exposed people filter. When filled, the board does not paint its own
      select. Designbook stories leave this empty and keep the Alpine control.
  column_views:
    title: Column views
    description: >-
      Four paged column displays. When filled, the board does not iterate the
      columns prop. Designbook stories leave this empty and keep the data
      columns.
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
