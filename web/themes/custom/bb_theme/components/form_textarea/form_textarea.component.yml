$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Textarea
status: stable
group: Form
description: Lean multi-line text input; the textarea counterpart of form_input.
provider: bb_theme
props:
  type: object
  properties:
    name:
      type: string
      title: Name attribute
    id:
      type: string
      title: ID attribute
    value:
      type: string
      title: Value
    placeholder:
      type: string
      title: Placeholder
    rows:
      type: integer
      title: Visible row count
    autocomplete:
      type: string
      title: Autocomplete token
    required:
      type: boolean
      title: Required
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
