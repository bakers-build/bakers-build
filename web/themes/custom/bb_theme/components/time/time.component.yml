$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Time
status: stable
group: Data Display
description: >-
  ONE displayed point in time: `<time datetime title>label</time>`. The label
  is the readable form ("2 hours ago", "15 Jun, 13:30", "15 Jun 2025"), the
  `datetime` the ISO 8601 stamp and the `title` the full absolute date and time,
  so the exact moment is one hover away. All three come from
  `Drupal\bb_core\Time\BbDate::time()`, the single product formatting path; a
  template never formats a date itself. Tabular figures, never mono: a date is
  read, not matched character by character.
provider: bb_theme
props:
  type: object
  properties:
    label:
      type: string
      title: Label
      description: The displayed text.
    datetime:
      type: string
      title: Machine-readable stamp
      description: ISO 8601, as the `datetime` attribute.
    title:
      type: string
      title: Full date and time
      description: The absolute stamp in the reader's timezone, shown on hover.
  required:
    - label
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
