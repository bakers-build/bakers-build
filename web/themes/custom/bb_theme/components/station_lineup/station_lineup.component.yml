$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Station lineup
status: stable
group: Shell
description: >-
  The login page's brand column: the slogan as the page's h1, a dashed hairline,
  and an ordered line-up of stations, each a plain decorative circle with a role
  and an action as text. The reader's own station is filled lime. Roles only: no
  tool icons, illustrations, personal names, quotes or customer logos (CI
  contract).
provider: bb_theme
props:
  type: object
  required:
    - headline
  properties:
    headline:
      type: string
      title: Headline
      description: The slogan, rendered as the page's only h1.
    stations:
      type: array
      title: Stations
      description: >-
        The stations in order. The reader's own one is `current`; it is marked
        `aria-current="step"` and its circle is filled lime. Optional: when
        empty, the agreed copy renders (your client · approves the plan, agents ·
        write the code, you · decide what ships), because no Island profile
        source can supply an array of objects.
      items:
        type: object
        required:
          - role
          - action
        properties:
          role:
            type: string
            title: Role
          action:
            type: string
            title: Action
          current:
            type: boolean
            title: Current
            default: false
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
