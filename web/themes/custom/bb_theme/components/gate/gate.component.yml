$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Gate
status: stable
group: Shell
description: >-
  The product's second chrome, and the peer of `shell` rather than a variant of
  it: a flat butter band with the product mark and the slogan beside the page's
  own title and content, framing everything standing BEFORE the product
  (sign-in, workspace choice and create, device sign-in, OAuth, errors), on a
  surface that is by definition outside every workspace. It carries no
  navigation and no link out — the rail is workspace-ambient and would render a
  menu whose entries lead nowhere — and it shares no slot with `shell`. From
  `lg` the band and the content sit side by side in one rounded frame of about
  1100×640px centred on the page; below that the band stacks on top.
provider: bb_theme
props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: >-
        The page's heading, its single `h1`. A prop rather than a slot because it is a scalar the
        page layout supplies once for every screen this chrome frames.
    description:
      type: string
      title: Description
      description: >-
        One sentence under the heading, naming what this gate is for. Optional:
        a chooser whose list speaks for itself needs none.
    claim:
      type: string
      title: Claim
      description: >-
        The slogan under the mark in the band, plain text and never a heading:
        the page's title is its single `h1`. Defaults to the owner's call to action,
        "Knead it. Ship it."
    explanation:
      type: string
      title: Explanation
      description: >-
        Optional plain text under the slogan in the band, saying what this page is for.
        A multi-step flow such as onboarding sets one per step; sign-in and the other
        gates leave it out and render unchanged.
    progress:
      type: string
      title: Progress
      description: >-
        The reader's position in a multi-step flow, such as "Step 3 of 4", as a caption in the
        band. It carries `aria-current="step"`. Optional.
    steps:
      type: array
      title: Steps
      description: >-
        The steps of a multi-step flow, shown as a list in the band from `lg` and replacing the
        slogan. Each has a label and a state: `done`, `current` or `upcoming`. Optional;
        sign-in and the other gates leave it out.
      items:
        type: object
        properties:
          label:
            type: string
          state:
            type: string
            enum:
              - done
              - current
              - upcoming
        required:
          - label
          - state
    focus_title:
      type: boolean
      title: Focus title
      description: >-
        Moves keyboard focus to the heading when the gate renders. For a flow that swaps
        its steps in place, so a screen reader announces the new step; off by default.
slots:
  mark:
    title: Mark
    description: >-
      The product mark above the slogan in the band. A slot and not a prop because
      a mark is rendered content — an icon component or an image — and props
      carry scalar data only.
  content:
    title: Content
    description: >-
      The one region a screen fills. A scene opens with `scene:
      "design-system:gate"` and fills exactly this, the same way a product
      screen fills `shell`'s `content`.
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
