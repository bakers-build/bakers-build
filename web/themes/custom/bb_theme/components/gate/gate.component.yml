$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Gate
status: stable
group: Shell
description: 'The product''s second chrome, and the peer of `shell` rather than a variant of it: a centred card that frames everything standing BEFORE the product, on a surface that is by definition outside every workspace. It carries no navigation — the rail is workspace-ambient and would render a menu whose entries lead nowhere — and it shares no slot with `shell`, which is a full-viewport flex layout with sidebar/header/content/footer/overlay. Its first and only inhabitant is the workspace chooser, in its two states: the list of the reader''s workspaces, and the named absence for a reader who belongs to none. The auth pages are its intended second inhabitant and are a later change to one page-layout condition, not a change to this component.'
provider: bb_theme
props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: The card's heading. A prop rather than a slot because it is a scalar the page layout supplies once for every screen this chrome frames.
    description:
      type: string
      title: Description
      description: 'One sentence under the heading, naming what this gate is for. Optional: a chooser whose list speaks for itself needs none.'
slots:
  mark:
    title: Mark
    description: The product mark above the heading. A slot and not a prop because a mark is rendered content — an icon component or an image — and props carry scalar data only.
  content:
    title: Content
    description: 'The one region a screen fills. A scene opens with `scene: "design-system:gate"` and fills exactly this, the same way a product screen fills `shell`''s `content`.'
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
