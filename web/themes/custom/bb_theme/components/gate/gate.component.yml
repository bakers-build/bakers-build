$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Gate
status: stable
group: Shell
description: >-
  The product's second chrome, and the peer of `shell` rather than a variant of
  it: a top bar with the product mark and one quiet Docs link over a centred
  card, framing everything standing BEFORE the product (sign-in, workspace
  choice and create, device sign-in, OAuth, errors), on a surface that is by
  definition outside every workspace. It carries no navigation — the rail is
  workspace-ambient and would render a menu whose entries lead nowhere — and it
  shares no slot with `shell`. When `aside` is filled (the login page's brand
  column), the body becomes two columns from `lg`, brand first, and stacks below
  that.
provider: bb_theme
props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: >-
        The card's heading. A prop rather than a slot because it is a scalar the
        page layout supplies once for every screen this chrome frames.
    description:
      type: string
      title: Description
      description: >-
        One sentence under the heading, naming what this gate is for. Optional:
        a chooser whose list speaks for itself needs none.
    docs_url:
      type: string
      title: Docs URL
      description: >-
        Target of the quiet Docs link at the top right of the bar, the gate's
        only link out.
      default: https://bakers.build
slots:
  mark:
    title: Mark
    description: >-
      The product mark at the top left of the bar. A slot and not a prop because
      a mark is rendered content — an icon component or an image — and props
      carry scalar data only.
  aside:
    title: Aside
    description: >-
      Brand column beside the card from `lg`, above it when stacked. Empty on
      every gate page except login.
  content:
    title: Content
    description: >-
      The one region a screen fills. A scene opens with `scene:
      "design-system:gate"` and fills exactly this, the same way a product
      screen fills `shell`'s `content`.
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
