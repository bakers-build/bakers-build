$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Board Card
status: stable
group: Data Display
description: >-
  Compact card for one item of a board: an identifier, an optional priority tag,
  a clamped title, and a footer slot for the claim, the status and the assignee.


  ITS NAME WAS ALREADY GENERIC AND ITS CONTRACT WAS NOT. Every prop title named
  the one entity the board happened to hold, which made a card that draws an
  identifier, a title, a tag and an accent edge read as though it could draw
  nothing else. What a board holds is the BOARD'S knowledge, and the mapping's:
  the card takes an identifier and a title, and it does not ask what they
  identify.



  A BLOCKED CARD NAMES ITS BLOCKERS AND A CARD STATES ITS RUNS (BAKERS-55). The
  blocked marker reads "Blocked by" plus the identifiers in `blocked_by`, or
  "Blocked by" alone with `blocked_hidden`. The run line reads "N runs - last
  <state>" ("1 run" for one), red for a failed or expired newest run, and is
  absent without runs. The "Cancelled" marker is unchanged.
provider: bb_theme
libraryOverrides:
  dependencies:
    - core/drupal.dialog.ajax
    - core/drupal.dialog.off_canvas
props:
  type: object
  properties:
    identifier:
      type: string
      title: Identifier
    title:
      type: string
      title: Title
    status:
      type: string
      enum:
        - running
        - attention
        - needs_input
        - wait
        - idle
      title: Derived status (accent edge)
    priority:
      type: string
      enum:
        - p1
        - p2
        - p3
      title: Priority label
    type:
      type: string
      title: Kind — drives the card colour
      description: >-
        Accepts the short type or the bb_<type> workflow id; the leading bb_ is
        stripped for the colour lookup.
    state:
      type: string
      title: Workflow state key (e.g. qualification, plan, working)
    url:
      type: string
      title: Canonical URL
    lease:
      type: string
      title: Holder of the lease
      description: >-
        Rendered in the footer when the footer slot is empty. Absent rather than
        empty when no lease is held.
    assignee_name:
      type: string
      title: Assignee name
    assignee_initials:
      type: string
      title: Assignee initials
    assignee_color:
      type: string
      enum:
        - running
        - attention
        - unassigned
        - lease
        - offline
      title: Assignee avatar colour key
    done_label:
      type: string
      title: Done time label
      description: >-
        When a closed ticket was done, formatted by BbDate ("3 days ago"). With
        it or `mr_url` the footer says "Done …" and links the merge request
        instead of the lease and state line.
    done_datetime:
      type: string
      title: Done time, ISO 8601
    done_title:
      type: string
      title: Done time, full date shown on hover
    mr_url:
      type: string
      title: Merge request URL
    mr_label:
      type: string
      title: Merge request label
    blocked_by:
      type: array
      items:
        type: string
      title: Blocked by
      description: >-
        Identifiers of the open blockers the reader may view, rendered in mono
        after "Blocked by". Replaces the former `blocked` flag, which counted
        closed blockers too.
    blocked_hidden:
      type: boolean
      default: false
      title: Hidden blocker
      description: >-
        The ticket has an open blocker the reader may not view. With an empty
        `blocked_by` the marker reads "Blocked by" alone and names nothing, so
        no identifier leaks across access.
    run_count:
      type: integer
      title: Run count
      description: How many runs the ticket has. Zero or absent renders no run line.
    last_run_state:
      type: string
      enum:
        - claimed
        - running
        - done
        - expired
        - failed
        - cancelled
      title: Newest run state
      description: >-
        The state of the newest run. `failed` and `expired` turn the run line
        red.
  required:
    - identifier
    - title
slots:
  footer:
    title: Footer
    description: >-
      Footer line, in this order: the lease badge where a lease is held, a
      spacer, a dotted badge whose label is the card's EXACT workflow state as
      text (plan, working, review — the column carries only the phase), then the
      assignee. When this slot is empty the card composes that line from its
      lease, state and assignee props. The state must never be conveyed by
      colour alone: the badge's label is what names it, while its dot and the
      card's accent edge encode the derived status.
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
