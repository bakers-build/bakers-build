$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Active Filters
status: stable
group: Data Display
description: >-
  The summary of what the `filters` aside has narrowed the list to (Polaris's
  `appliedFilters`; renamed from `selected_facets` — BB-378 D9/D15, and "active"
  is the state after applying, which is what this states). It renders in
  `canvas.main`, above the results, which is where `facet_sidebar` already put
  it before the layout moved into `canvas`. One chip per chosen filter, SITTING
  ABOVE THE ROWS it describes: one chip per chosen facet reading field, operator
  and values — `State is either of working, review` — and, when nothing is
  chosen, a single plain statement that the list is unfiltered. It is the second
  half of C22: the aside is where the narrowing is DONE, and a column of eight
  controls does not answer "what am I looking at" at a glance, so the answer is
  stated once, where the results are. It spent the third iteration at the top of
  the aside and the human moved it back out at the fourth gate. ITS LAYOUT
  FOLLOWS FROM WHERE IT LIVES: the chips wrap in a ROW and the position
  indicator sits beneath them, left-aligned, because the results column is as
  wide as the table and a column of chips would push the rows down for nothing.
  What is not restored along with the row is the spacer that used to shove the
  indicator to the far right — the human asked for this left-aligned, and a
  value flung to the opposite edge of a wide region is read last rather than
  read with the chips. There is one layout, because it renders in one place. THE
  OPERATOR ADAPTS TO THE NUMBER OF VALUES, derived rather than typed: one value
  reads `is`, several read `is either of`. That is Linear's own behaviour and it
  is a rendering decision, so it lives in the component — a scene that had to
  type the right operator per facet would eventually type the wrong one. A facet
  may override it (`includes any of` for labels, `is not` for a negation) and
  the override is then that facet's own word. WHAT THIS IS NOT: it reads props
  and nothing else. It performs no query, writes no URL, and persists no filter
  set — Linear keeps ad-hoc filters in the URL and a saved set as a custom view
  in the sidebar, and both of those are wiring that belongs to the ticket which
  gives this screen a real query. A CHIP IS REMOVABLE, and the affordance is a
  LINK rather than a button or a script. An earlier revision of this component
  said the opposite — that a chip is only a statement and that a dismiss
  affordance here would do nothing — and it deferred the wiring to "the ticket
  which gives this screen a real query". That ticket arrived: the caller now
  owns the address the list was narrowed by, so it can hand each facet the
  address MINUS that facet, and following it is a real removal. The `x` is an
  anchor because the region this renders inside is boosted: the removal swaps
  that region's fragment and pushes the shorter URL exactly as picking a facet
  does, and it still works with JavaScript off. Nothing here posts, which is the
  part that never changed. THE LINK REMOVES THE WHOLE FACET, NOT ONE VALUE: a
  chip is one facet and its sentence is about the facet — `State is either of
  Working, Review` is one statement, so one control that undoes one statement is
  the honest granularity, and the accessible name says which (`Remove the State
  filter`). THAT NAME CARRIES NO COLON ON PURPOSE: it read `Remove filter:
  State` until 2026-09-04, and on the one surface that matters the strip is a
  plain-string `#markup` put through `Xss::filterAdmin()`, which
  protocol-filters attribute values — `filterBadProtocol()` reads everything up
  to the first colon as a scheme, so the name arrived as ` State`. Measured on
  the live page. Removing a single value is the filter panel's job, where every
  option row is already a real control. A facet with no `remove_url` renders no
  `x` at all, which is what keeps this component usable by a caller that has no
  address to offer. THERE ARE TWO WAYS TO GIVE IT ITS CHIPS, AND THE `chips`
  SLOT IS THE SECOND: `facets` is the props route for a caller that holds the
  applied set as data, and `chips` is the slot route for a caller that can only
  hand over already-rendered chips — a Views area whose markup another component
  produced. The slot wins when both are given, because a caller that filled it
  has markup this component cannot second-guess. IT EXISTS BECAUSE `empty_label`
  WAS OTHERWISE UNREACHABLE: `views_filters_summary`'s area is declared `empty:
  true`, so it renders `['#markup' => '']` when no filter has a value and Views'
  `header` is truthy either way — no Views option, no config and no condition
  tells "the module stated nothing" from "the module was never asked". A
  component can, because a slot that renders nothing renders nothing:
  `chips|render|striptags|trim` is the whole test. `striptags` rather than
  `trim` alone is a claim about the SLOT'S CONTRACT and not about the tickets
  surface, where `Xss::filterAdmin()` has already removed every comment
  (measured): a caller that fills the slot from an ordinary render with
  `twig.config.debug` on hands over `<!-- THEME DEBUG -->` comments, which
  `trim` keeps. The cost is that a slot whose only content is an image states
  nothing by this test. THE `chips_only` VARIANT IS THE INNER HALF OF THAT
  ARRANGEMENT: it writes the sentences from `facets` and renders NO WRAPPER — no
  root element, no border, no padding, no meta — so the caller nests it inside
  an outer one that owns the wrapper, the accessible name and the unfiltered
  statement. A wrapper would double the border the outer already draws, and an
  always-present wrapper would make the emptiness test always false, which is
  the defect the variant exists to fix. With no facets it emits nothing at all.
  THE `x` IS A TEXT GLYPH AND NOT A SPRITE ICON, which is a correction rather
  than a preference. It used to include `bb_theme:icon` with `x-circle`, and
  `Xss::getAdminTagList()` holds neither `svg` nor `use`: on the filtered
  surface the icon was deleted and the anchor arrived with no content, which has
  a zero box and cannot be clicked. A stylesheet rule used to put a `x` back
  through `::after`; the glyph belongs here instead, and a text `x` is something
  no XSS filter has a reason to remove. EVERY STORY OF THIS COMPONENT NOW STATES
  `variant` EXPLICITLY, INCLUDING THE ONES THAT WANT THE DEFAULT.
  `storybook-addon-sdc` builds a component's base args as `...content.variants
  && { variant: Object.keys(content.variants)[0] }` and spreads them into every
  generated story, so a story that omits `variant` renders the FIRST DECLARED
  VARIANT rather than the default one — measured: before `variant: ""` was added
  below, `active-filters--default` rendered the bare `chips_only` strip with no
  wrapper and no meta line. The same behaviour already breaks `table--default`,
  `table--delivery` and `table--unassigned`, which is where it was first seen;
  `table--bare` is the one table story that escapes it, and it escapes by
  carrying `variant: ""` exactly as these do. It is a prop in the STORY and not
  in the component: the SDC schema forbids a `variant` prop under `props:` while
  `variants:` is populated, and this is the story's arg rather than the
  component's contract. THE DEFAULT STORY EXERCISES THE THREE OPERATOR CASES the
  component can produce — a single value (`is`), several values with the
  operator derived (`is either of`), and a field whose own vocabulary overrides
  it (`includes any of`) — and gives only some of them a `remove_url`, so both
  renderings of a chip are visible at once. That sentence used to be a comment
  inside the story file; it is restated here because the story is serialised by
  the workflow that owns it and cannot carry comments.
provider: bb_theme
props:
  type: object
  properties:
    label:
      type: string
      title: Accessible name
      description: >-
        Names the summary region, so a screen reader reaching it knows the chips
        describe the list below rather than being controls for it.
    facets:
      type: array
      title: Chosen facets
      description: >-
        One entry per facet that has a value. A facet with no value is simply
        absent — an empty chip would claim a constraint that is not there.
      items:
        type: object
        properties:
          field:
            type: string
            title: Field name
            description: The facet's own name as the operator reads it, e.g. `State`.
          operator:
            type: string
            title: Operator
            description: >-
              Overrides the derived operator. Left out, one value reads `is` and
              several read `is either of`; set it where the field's own
              vocabulary differs — `includes any of` for labels, `is not` for a
              negation.
          values:
            type: array
            title: Chosen values
            description: >-
              The values themselves, rendered in full. The number of them is
              what decides the operator when none is given. Left out or empty,
              the chip reads the field alone, with no operator: a filter that is
              a state rather than a field with values, such as "Unhealthy".
            items:
              type: string
          remove_url:
            type: string
            title: Removal address
            description: >-
              The address this list would be at without this facet — the current
              URL minus this facet's whole entry, computed by the caller because
              only the caller knows the address. Left out, the chip renders no
              dismiss affordance, which is the honest rendering for a caller
              that cannot answer it.
          count:
            type: integer
            title: Match count
            description: >-
              How many results this filter matches, shown after the sentence as
              "· N" (BAKERS-55: "Priority is High · 5", "Unhealthy · 3").
    empty_label:
      type: string
      title: Unfiltered statement
      description: >-
        What the summary says when no facet is chosen, e.g. `All tickets`.
        Rendered instead of the chips, never beside them — an empty strip would
        read as a rendering fault rather than as an unfiltered list.
slots:
  chips:
    title: Chips
    description: >-
      Already-rendered chips, for a caller that cannot hand over the applied set
      as data. Filled, it replaces `facets`; rendering to nothing is what states
      an unfiltered list, so a caller that fills it with an always-present
      wrapper makes `empty_label` unreachable again.
  meta:
    title: Meta
    description: >-
      Trailing region, right-aligned — on the tickets list the
      `collection-position` indicator, so "what am I looking at" and "where in
      it am I" are answered on one line.
variants:
  chips_only:
    title: Chips only
    description: >-
      The inner half of a nested pair: the chip sentences with no wrapper, no
      unfiltered statement and no meta line, so an outer one can own those and
      test whether this rendered anything.
  inline:
    title: Inline
    description: >-
      The chips and the meta in one wrapping row, vertically centred, as the
      Board filter bar shows them.
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
