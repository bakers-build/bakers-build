$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Stat Breakdown
status: stable
group: Data Display
description: >-
  A figure split into entries - per project, per person, per whatever axis the
  figure was configured with - each row carrying its own trailing totals. It
  answers where a single total came from, for a figure whose one number hides a
  distribution. It emits no table markup of its own: it composes the existing
  table component, which is the only template in this theme permitted to render
  a table row. The bars display shows the same entries as parts of one total,
  each with value, share label and a share bar, as the Insights AI-usage lists
  do.
provider: bb_theme
props:
  type: object
  properties:
    label:
      type: string
      title: Label
      description: The figure's own name, rendered as the block heading.
    columns:
      type: array
      title: Columns
      minItems: 1
      description: The trailing period columns, in display order.
      items:
        type: object
        properties:
          key:
            type: string
            title: Column key
            description: The key each row's counts are stored under.
          label:
            type: string
            title: Header label
            description: The column heading.
        required:
          - key
          - label
    entries:
      type: array
      title: Rows
      description: One entry per axis value. Empty renders the named absence instead.
      items:
        type: object
        properties:
          label:
            type: string
            title: Row label
            description: >-
              The row's name, already resolved by the caller, including the
              explicit wording used for entries that could not be attributed.
          counts:
            type: object
            title: Counts
            description: The row's values, keyed by the column keys.
          value:
            type: string
            title: Value
            description: The row's preformatted figure in the bars display (`17.9 B`).
          share:
            type: number
            minimum: 0
            maximum: 100
            title: Share
            description: >-
              The row's share of the whole in percent, drawn as the bar length
              in the bars display.
          share_label:
            type: string
            title: Share label
            description: >-
              The preformatted share (`63 %`), so the bar is never the only
              carrier of the number.
          exact:
            type: string
            title: Exact value
            description: >-
              The unabbreviated value and its calculation in the bars display.
              Shown when the value is hovered or focused, dismissed with Escape;
              the value becomes focusable when set.
        required:
          - label
          - counts
    empty:
      type: string
      title: Empty message
      description: >-
        The sentence shown when there are no entries, naming what is absent and
        over what period.
    source:
      type: string
      title: Source
      description: >-
        Where the figure is read from, available in a native Data source
        disclosure.
    display:
      type: string
      enum:
        - table
        - bars
      default: table
      title: Display
      description: >-
        `table` keeps the per-period columns. `bars` lists each entry with its
        value, its share label and a share bar (Figma 84:452), for a figure
        split into parts of one total; `columns` is then ignored.
    caption:
      type: string
      title: Caption
      description: >-
        One line under the heading naming what is counted and over which period
        (`Tokens, 1 – 19 Oct. Not a billable quantity.`).
  required:
    - label
    - columns
    - entries
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
