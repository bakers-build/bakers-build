$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Input
status: stable
group: Form
description: >-
  Lean text-based input element; the input type is set via the type prop.
  `compact` makes it the 32 px field of a one-row toolbar.
provider: bb_theme
props:
  type: object
  properties:
    type:
      type: string
      title: HTML input type
    name:
      type: string
      title: Name attribute
    id:
      type: string
      title: ID attribute
    value:
      type: string
      title: Value
    placeholder:
      type: string
      title: Placeholder
    autocomplete:
      type: string
      title: Autocomplete token
    required:
      type: boolean
      title: Required
    disabled:
      type: boolean
      title: Disabled
    readonly:
      type: boolean
      title: Readonly
    compact:
      type: boolean
      default: false
      title: Compact field
      description: >-
        The 32 px field of a one-row toolbar, such as the Board filter bar
        search (BAKERS-55). Left out, the field keeps its 38 px form height.
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
