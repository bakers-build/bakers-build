$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Inspector
status: stable
group: Layout
description: >-
  The trailing column of editable properties — what Xcode, Figma, Unity and
  SwiftUI all call the inspector (BB-378 D9, renamed from `meta_rail`). It
  fills `canvas.inspector`: a sticky `<aside>` of `meta_row` rows that stays in
  view (`position: sticky; top: 0; align-self: start`) while the main region
  beside it scrolls past. It is deliberately NOT a scroll container — no
  `overflow-y: auto` — because that would make it a scrolling ancestor of the
  four inline-edit pickers a `meta_row` can hold, and an absolutely positioned
  picker panel cannot escape a scrolling ancestor (D3, BB-332 R9).
provider: bb_theme
props:
  type: object
  properties:
    surface:
      type: boolean
      title: Surface
      description: >-
        Default false. When true the rail is ONE lifted panel (`bg-surface`,
        `border-border-2`, `rounded-sm`, `p-4`) and every DIRECT child of `rows`
        is a block: blocks are separated by exactly one quiet divider, with the
        block rhythm set here, and the footer is the last block behind one
        divider. Rows inside a block should use `list` layout `plain`, which
        draws no line of its own, so no line ever doubles. Without
        it the rail renders exactly as before.
slots:
  rows:
    title: Rows
    description: The meta_row components, in the fixed order the caller's fields are read.
  footer:
    title: Footer
    description: >-
      Optional intervention footer at the bottom of the rail, after a divider
      (GitHub issue-sidebar pattern): the exceptional actions a human may take
      on the record — a danger outline Cancel ticket — and a low-prominence More
      settings link. Renders nothing when empty.
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
