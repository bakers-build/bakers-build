$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Button
status: stable
group: Action
description: >-
  Atomic action control with an optional leading icon slot. Renders an anchor
  when href is set and a button otherwise. Distinct from the submit component,
  which is form-bound.
provider: bb_theme
props:
  type: object
  properties:
    label:
      type: string
      title: Label
    href:
      type: string
      title: Href
      description: When set the control renders as an anchor instead of a button.
    type:
      type: string
      title: Button type attribute
      enum:
        - button
        - submit
        - reset
    disabled:
      type: boolean
      title: Disabled
    icon_only:
      type: boolean
      title: Icon only
      description: Render the icon alone and move the label into aria-label.
    tone:
      type: string
      enum:
        - wait
        - attention
        - running
        - critical
        - idle
      title: Tone
      description: >-
        Optional fill from the badge token vocabulary, for a control that is
        also a labelled state (Board work-state and priority chips). When set it
        replaces the variant colours. The label still names the value.
    pressed:
      type: boolean
      title: Pressed
      description: >-
        Makes the control a TOGGLE and says whether it is on. A `<button>`
        carries `aria-pressed` true or false; a link (a filter that navigates,
        such as an assignee avatar on the Board filter bar) carries
        `aria-current="true"` while it is on, because a link cannot be pressed.
        On, it takes the primary look, the house look of an active filter chip.
        Absent, the control is not a toggle and renders as before.
    aria_label:
      type: string
      title: Accessible name
      description: >-
        Overrides the accessible name when the visible content does not say
        enough, such as an avatar and a count: "Christian Wiedemann, 18 tickets"
        for a toggle that shows "CW 18". Wins over the `icon_only` name.
  required:
    - label
slots:
  icon:
    title: Icon
    description: Optional leading icon rendered before the label.
variants:
  neutral:
    title: Neutral
    description: White surface, dark text and a subtle border for authentication actions.
  primary:
    title: Primary
    description: Dominant weight, used for the New ticket call to action.
  ghost:
    title: Ghost
    description: >-
      No border, no background — the sidebar collapse toggle and other icon-only
      controls.
  danger:
    title: Danger
    description: >-
      Quiet outline in the semantic danger role — transparent background, danger
      border and text, a danger tint on hover. For intervention actions that
      stop or end work (Cancel ticket, Cancel run); there is deliberately no
      filled danger.
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
