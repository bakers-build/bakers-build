    projects:
      title: Projects
      purpose: >-
        The projects of the workspace named in the URL, five columns. A LISTING
        IS A

        VIEW: the row this replaced was a bb_project.bb_project.teaser view
        mode,

        and BB-389 removed it because a list row was never a view mode.


        THE ROWS COME FROM THE URL, and that is this view's own argument rather
        than the

        query-access layer's doing. BbWorkspaceReadScope resolves an ACCOUNT's
        scope —

        the union of every OG membership, with no workspace parameter — so for a
        user

        who belongs to several workspaces it admits more rows than the URL asked
        for.

        The `workspace_id` argument narrows to the one workspace, walking the
        group_id

        relationship because bb_project carries no workspace field of its own.
        Its

        `default_action` is `access denied` rather than a fallback to all: a
        view that

        listed every workspace the moment a route stopped supplying the
        parameter is how

        ambient scoping turns into a disclosure. Query access stays the floor

        underneath — the two layers answer two different questions.


        THE TWO RELATIONSHIPS DISAGREE ABOUT `required` ON PURPOSE.
        owner_user_id is a

        LEFT JOIN, and the reason stated here used to be that
        BbProject::owner_user_id

        is not setRequired(TRUE). That is now FALSE — the field has carried

        setRequired(TRUE) since 66780aa93 — and the LEFT JOIN is still right, so
        only

        the rationale is corrected. setRequired() is a VALIDATION constraint on
        a write

        to the project; it is not delete protection on the account referenced.
        bb_core

        guards that nowhere — no preDelete, no cascade, no reference constraint
        — so a

        stored project can still be left pointing at a deleted user, and an
        inner join

        on it drops the whole project from this listing the moment that happens:
        no

        message, no empty cell, no row. group_id stays an INNER JOIN, and for a
        positive

        reason rather than the same one: it carries the workspace argument, so a
        project

        whose group is gone has no workspace to be listed under, and the honest
        answer

        is no workspace rather than every workspace. That the referenced rows
        can vanish

        at all is a data-integrity gap, not this listing's to paper over.


        TWO DESIGNED COLUMNS ARE ABSENT, NAMED HERE RATHER THAN LEFT TO AN EMPTY
        SPACE.

        Teams is absent, and the reason stated here used to be that bb_project
        carries

        no `teams` field at all. That is now FALSE, in the same way the
        owner_user_id

        sentence above was: BB-419 added `teams` as a required,
        unlimited-cardinality

        entity_reference (BbProject.php), so the n:m assignment DOES exist and
        the

        cancelled BB-356 no longer describes the state of the field. What is
        true is

        that this listing still renders no teams column, and no decision has
        been

        recorded that it should not — so this is an open question about the
        listing

        rather than a structural impossibility, and it is named as one here
        instead of

        being justified by a field that is gone from the reasoning. Environments
        is

        absent for a reason that does still hold: it is a COUNT over a
        multi-value

        entity reference and core views has no field for that; a column showing
        the

        first referenced environment instead of the count would be a different
        and

        wrong value.


        IT COMPOSES A CANVAS WHOSE HEADING LIVES IN THE SHELL. The screen title,

        tabs and New-project action are the `page_header` island on

        `island.profile.bb_shell`. This display's tree is `bb_theme:canvas`

        with a `bb_theme:zone` in `main` wrapping `view_rows` plus `view_pager`.

        The `empty` area is untouched, because ui_patterns' own `view_rows`
        source

        renders a view's empty areas when it has no rows.


        THE ROWS ARE STILL CORE'S `table` WITH `row: type: fields`, AND NOT FOR
        THE

        REASON D1 GAVE. D1 priced the alternative as a bespoke ui_patterns
        Source, and that

        is not what it costs: a PRESENTER TEMPLATE — a markup-free template that

        transforms what views handed it and include()s the component, reached by
        core's

        own theme suggestion (ViewExecutable::buildThemeFunctions() emits

        views_view_table__projects) — needs no plugin and would leave this file
        exactly

        as it is. What IS true is that site building cannot do it: `rows` is a
        PROP

        holding an array of objects, and no shipped ui_patterns source serves
        such a

        prop type — ui_patterns_views's view_rows declares `prop_types: [slot]`,
        and

        across all 22 shipped sources the prop types are attributes, boolean,
        enum,

        enum_list, enum_set, identifier, links, list, number, slot, string, url
        and

        variant. That absence is the condition under which a presenter is the
        right

        answer rather than a trick. BB-413 owns that template; when it lands
        this

        listing renders through bb_theme:table with no change here.
