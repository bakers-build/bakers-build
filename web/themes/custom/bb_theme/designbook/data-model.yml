content:
  bb_project:
    bb_project:
      title: bakers.build project
      purpose: >-
        The work unit: key, next_number, repository, environments. BB-462 D7
        REVERSES what this field used to say: the project carries NO membership
        or role of its own any more — it is deregistered from og.settings
        entirely, and its three roles (non-member, member, lead) are deleted
        from both config paths. Visibility now comes from bb_project.teams (D4):
        a project is visible to the members of a team it names, or to a
        workspace admin. The two levels that grant rights are the workspace
        (create/edit/delete rights, via
        bb_workspace-bb_workspace-{contributor,lead}) and, per-project, its
        teams (visibility only — a team carries no rights of its own, BB-462
        D3). A screen must not offer a permission control on the project.
      view_modes:
        teaser:
          template: field-map
        full:
          template: field-map
        epics:
          template: field-map
          label: Epics
      fields:
        created:
          type: datetime
          title: Created
          required: false
          multiple: false
        changed:
          type: datetime
          title: Changed
          required: false
          multiple: false
        group_id:
          type: reference
          title: Group
          required: true
          multiple: false
          reference: bb_group
        name:
          type: string
          title: Name
          required: true
          multiple: false
        description:
          type: string
          title: Description
          description: >-
            Optional plain text, one or two sentences, at most 280 characters;
            rendered beneath the listing row's meta line and absent when empty.
          required: false
          multiple: false
        image:
          type: image
          title: Image
          description: >-
            Optional single image (png, gif, jpg, webp; 2 MB), stored privately
            under project-images, shown uncropped as the listing row's leading
            avatar; initials when absent.
          required: false
          multiple: false
        repository:
          type: object
          title: Repository
          description: >-
            The project repository (URL, default branch, branch naming
            convention). Single-valued: a project has at most one repository.
          required: false
          multiple: false
          settings:
            properties:
              url: string
              default_branch: string
              branch_convention: string
        coder_config:
          type: object
          title: Coder config
          required: false
          multiple: false
        env_vars:
          type: text
          title: Environment variables
          description: >-
            Project defaults supplied to hooks and the agent on every run, as
            .env-style KEY=value lines. A parent ticket and the ticket itself
            override a key set here. Readable by anyone who can view this
            project.
          required: false
          multiple: false
        teams:
          type: reference
          title: Teams
          description: >-
            The teams this project belongs to. A project belongs to AT LEAST ONE
            team, so the field is required and multi-valued. The assignment is
            STRUCTURE and confers no rights: it makes the team the project's
            structural parent, and team membership is not a source of ticket
            visibility. Visibility stays at direct project membership or
            workspace see-all (BB-419, which deliberately left
            BbWorkspaceReadScope untouched).
          required: true
          multiple: true
          reference: bb_team
        key:
          type: string
          title: Key
          description: Ticket identifier prefix, e.g. "bakers.build" in BB-328.
          required: false
          multiple: false
        next_number:
          type: integer
          title: Next number
          description: >-
            Next per-project ticket number; floors to max(number)+1 on
            allocation.
          required: false
          multiple: false
        owner_user_id:
          type: reference
          title: Owner
          required: false
          multiple: false
          reference: user
        environments:
          type: reference
          title: Environments
          description: Managed environments belonging to this project.
          required: false
          multiple: true
          reference: bb_environment
          computed: true
          readonly: true
      omitted:
        id: Entity key, not a modelled field.
        uuid: Entity key.
  bb_comment:
    bb_comment:
      title: bakers.build comment
      view_modes:
        full:
          template: field-map
        teaser:
          template: field-map
      fields:
        created:
          type: datetime
          title: Created
          required: false
          multiple: false
        changed:
          type: datetime
          title: Changed
          required: false
          multiple: false
        ticket_id:
          type: reference
          title: Ticket
          required: true
          multiple: false
          reference: bb_ticket
        author:
          type: reference
          title: Author
          required: true
          multiple: false
          reference: user
        body:
          type: text
          title: Body
          required: true
          multiple: false
        type:
          type: string
          title: Type
          description: >-
            Free text, not an enum (BB-227). Values in use include comment,
            qualification, spec, test and acceptance, so a screen must render an
            unknown value rather than assume a closed set.
          required: true
          multiple: false
        author_name:
          type: string
          title: Author name
          required: false
          multiple: false
          computed: true
          readonly: true
        author_initials:
          type: string
          title: Author initials
          required: false
          multiple: false
          computed: true
          readonly: true
        author_color:
          type: string
          title: Author colour
          required: false
          multiple: false
          computed: true
          readonly: true
      omitted:
        id: Entity key, not a modelled field.
        uuid: Entity key.
    review:
      title: bakers.build review comment
      purpose: >-
        A private review of a ticket. Drafts stay with the assigned author;
        submitted reviews wait for the current assignee; accepted reviews
        publish into the ordinary comment timeline. Rejected reviews stay
        unpublished. The Boolean published flag is server-owned.
      view_modes:
        full:
          template: field-map
        teaser:
          template: field-map
      fields:
        created:
          type: datetime
          title: Created
          required: false
          multiple: false
        changed:
          type: datetime
          title: Changed
          required: false
          multiple: false
        ticket_id:
          type: reference
          title: Ticket
          required: true
          multiple: false
          reference: bb_ticket
        author:
          type: reference
          title: Author
          required: true
          multiple: false
          reference: user
        body:
          type: text
          title: Body
          required: true
          multiple: false
        type:
          type: string
          title: Type
          required: true
          multiple: false
        status:
          type: boolean
          title: Published
          required: false
          multiple: false
        review_state:
          type: string
          title: Review state
          required: false
          multiple: false
          settings:
            allowed_values:
              draft: Draft
              submitted: Submitted
              accepted: Accepted
              rejected: Rejected
        submitted_at:
          type: datetime
          title: Submitted at
          required: false
          multiple: false
        decided_at:
          type: datetime
          title: Decided at
          required: false
          multiple: false
        decided_by:
          type: reference
          title: Decided by
          required: false
          multiple: false
          reference: user
        author_name:
          type: string
          title: Author name
          required: false
          multiple: false
          computed: true
          readonly: true
        author_initials:
          type: string
          title: Author initials
          required: false
          multiple: false
          computed: true
          readonly: true
        author_color:
          type: string
          title: Author colour
          required: false
          multiple: false
          computed: true
          readonly: true
      omitted:
        id: Entity key, not a modelled field.
        uuid: Entity key.
  bb_activity:
    bb_activity:
      title: bakers.build activity
      purpose: >-
        One persisted ticket event per row: `created` when a ticket is created,
        `status_changed` per state change (with the step's summary comment, and
        with the run it closed and that run's conductor when an agent did the
        work), `claimed` only for the first run outside qualification, and
        `run_ended` when a run ends failed, expired or cancelled without moving
        the ticket. Writes come only from the bb_activity kinds, called where
        the change happens. Each row is this bundle's `full` view mode
        (`bb_theme:event` with a structured lead); there is no second activity
        view mode.
      view_modes:
        full:
          template: field-map
      fields:
        created:
          type: datetime
          title: Created
          required: false
          multiple: false
        ticket_id:
          type: reference
          title: Ticket
          required: true
          multiple: false
          reference: bb_ticket
        kind:
          type: string
          title: Kind
          description: >-
            `created`, `status_changed`, `claimed` or `run_ended`. Tags:
            created, status, started (claimed) and the run outcome for
            run_ended.
          required: true
          multiple: false
          settings:
            allowed_values:
              - created
              - status_changed
              - claimed
              - run_ended
        actor:
          type: reference
          title: Actor
          required: false
          multiple: false
          reference: user
        workflow:
          type: string
          title: Workflow
          required: false
          multiple: false
        previous_state:
          type: string
          title: Previous state
          required: false
          multiple: false
        new_state:
          type: string
          title: New state
          required: false
          multiple: false
        step:
          type: string
          title: Step
          description: >-
            The run's state_at_start for claimed and run_ended rows. Unused for
            created and status rows.
          required: false
          multiple: false
        run_id:
          type: reference
          title: Run
          required: false
          multiple: false
          reference: bb_run
          description: >-
            The run a claimed or run_ended row reports, or the run a status
            change closed. Empty for created rows and human status changes; its
            presence makes the row an agent row.
        conductor_id:
          type: reference
          title: Conductor
          required: false
          multiple: false
          reference: bb_conductor
          description: The conductor of the referenced run.
        comment_id:
          type: reference
          title: Summary comment
          description: >-
            The ticket's summary comment published since the ticket entered the
            state a status row leaves. Empty when none.
          required: false
          multiple: false
          reference: bb_comment
        claim_key:
          type: string
          title: Claim key
          required: false
          multiple: false
          description: >-
            The claimed run's UUID; unique, guards a second claimed row for the
            same run. NULL on other kinds.
        ticket_identifier:
          type: string
          title: Ticket identifier
          description: >-
            Computed from ticket_id.identifier so the event body can name the
            ticket without the mapping joining collections.
          required: false
          multiple: false
          computed: true
          readonly: true
        author_name:
          type: string
          title: Author name
          required: false
          multiple: false
          computed: true
          readonly: true
          description: >-
            The run's model (else harness, else agent) on rows with a viewable
            run; otherwise the actor's display name.
        author_initials:
          type: string
          title: Author initials
          required: false
          multiple: false
          computed: true
          readonly: true
        author_color:
          type: string
          title: Author colour
          required: false
          multiple: false
          computed: true
          readonly: true
        conductor_label:
          type: string
          title: Conductor label
          description: Computed from conductor_id.label.
          required: false
          multiple: false
          computed: true
          readonly: true
        run_harness:
          type: string
          title: Run harness
          description: Computed from run_id.harness; shown beside the model on agent rows.
          required: false
          multiple: false
          computed: true
          readonly: true
        run_duration:
          type: string
          title: Run duration
          description: >-
            Computed from run_id duration_s (or started_at to the row time),
            formatted.
          required: false
          multiple: false
          computed: true
          readonly: true
        run_outcome:
          type: string
          title: Run outcome
          description: >-
            Computed from run_id.state on run_ended rows: failed, expired or
            cancelled.
          required: false
          multiple: false
          computed: true
          readonly: true
        run_error_line:
          type: string
          title: Run error line
          description: Computed first non-empty line of a failed run's error log.
          required: false
          multiple: false
          computed: true
          readonly: true
      omitted:
        id: Entity key, not a modelled field.
        uuid: Entity key.
        changed: Activity rows are immutable; nothing writes a changed stamp.
  bb_conductor:
    bb_conductor:
      title: bakers.build conductor
      view_modes:
        full:
          template: field-map
      fields:
        created:
          type: datetime
          title: Created
          required: false
          multiple: false
        changed:
          type: datetime
          title: Changed
          required: false
          multiple: false
        machine_id:
          type: string
          title: Machine ID
          required: true
          multiple: false
        label:
          type: string
          title: Label
          required: false
          multiple: false
        owner_user_id:
          type: reference
          title: Owner
          required: false
          multiple: false
          reference: user
        status:
          type: string
          title: Status
          required: false
          multiple: false
          settings:
            allowed_values:
              online: Online
              offline: Offline
        project_id:
          type: reference
          title: Project
          required: true
          multiple: false
          reference: bb_project
        states:
          type: string
          title: States
          description: The claimable ticket states this conductor picks up.
          required: false
          multiple: true
          settings:
            allowed_values:
              - qualification
              - plan
              - working
              - review
        workspace_root:
          type: string
          title: Workspace root
          required: false
          multiple: false
        active:
          type: boolean
          title: Active
          description: >-
            Whether the conductor may be assigned and claim work; separate from
            online/offline status.
          required: false
          multiple: false
        max_parallel:
          type: integer
          title: Max parallel
          required: false
          multiple: false
        current_load:
          type: integer
          title: Current load
          required: false
          multiple: false
        last_seen:
          type: datetime
          title: Last seen
          required: false
          multiple: false
        lease_expires_at:
          type: datetime
          title: Lease expires at
          required: false
          multiple: false
        conductor_name:
          type: string
          title: Conductor name
          description: The config-file stem `--conductor <name>` selects.
          required: false
          multiple: false
        last_pid:
          type: integer
          title: Last PID
          description: >-
            Reported by the serve loop that owns the process; used by a verified
            stop.
          required: false
          multiple: false
        credential_health:
          type: text
          title: Credential health
          description: >-
            The JSON list of credential checks the conductor last reported on
            its heartbeat: name, status (ok | warning | error), expires_at
            (YYYY-MM-DD, optional) and reason.
          required: false
          multiple: false
        node_status:
          type: string
          title: Node status
          description: running | stale | offline — the shared liveness vocabulary.
          required: false
          multiple: false
          computed: true
          readonly: true
        node_states_label:
          type: string
          title: Claimed states
          required: false
          multiple: false
          computed: true
          readonly: true
        node_load_label:
          type: string
          title: Load
          required: false
          multiple: false
          computed: true
          readonly: true
        last_seen_label:
          type: string
          title: Last seen
          required: false
          multiple: false
          computed: true
          readonly: true
      omitted:
        id: Entity key, not a modelled field.
        uuid: Entity key.
  bb_machine:
    bb_machine:
      title: bakers.build machine
      purpose: >-
        Host capacity for concurrent runs, owned by one user account. Capacity
        (max_parallel / current_load) belongs to the machine, not to each
        per-project conductor; a conductor links its machine. host_key is the
        machine-context stem, not the composed conductor registration key.
        Machines are not in the workspace read scope: the owner sees them under
        the account Machines listing, and the full view is the machine page
        /user/{user}/machine/{bb_machine}.
      view_modes:
        full:
          template: field-map
      fields:
        created:
          type: datetime
          title: Created
          required: false
          multiple: false
        changed:
          type: datetime
          title: Changed
          required: false
          multiple: false
        name:
          type: string
          title: Name
          required: true
          multiple: false
        host_key:
          type: string
          title: Host key
          description: Machine-context machine_id stem, unique per machine.
          required: true
          multiple: false
        max_parallel:
          type: integer
          title: Max parallel
          description: Concurrent runs this machine accepts; default 5.
          required: false
          multiple: false
        current_load:
          type: integer
          title: Current load
          description: Runs currently claimed on this machine; default 0.
          required: false
          multiple: false
        owner_user_id:
          type: reference
          title: Owner
          required: false
          multiple: false
          reference: user
          settings:
            target_type: user
        owner_label:
          type: string
          title: Owner label
          description: >-
            Display name of the owner, read through owner_user_id; the machine
            page shows it.
          required: false
          multiple: false
          computed: true
          readonly: true
      omitted:
        id: Entity key, not a modelled field.
        uuid: Entity key.
  bb_group:
    bb_group:
      title: bakers.build group
      purpose: >-
        The customer. Bundles projects and carries the cost centre for
        re-invoicing. Carries NO permissions and is NOT an OG group —
        og.settings registers only bb_workspace and bb_team since BB-462 D7
        deregisters bb_project — it is not a rights level, so no screen may
        offer a permission control on it.
      view_modes:
        teaser:
          template: field-map
        full:
          template: field-map
      fields:
        created:
          type: datetime
          title: Created
          required: false
          multiple: false
        changed:
          type: datetime
          title: Changed
          required: false
          multiple: false
        name:
          type: string
          title: Name
          required: true
          multiple: false
        description:
          type: string
          title: Description
          description: >-
            Optional plain text, one or two sentences, at most 280 characters;
            rendered beneath the listing row's meta line and absent when empty.
          required: false
          multiple: false
        image:
          type: image
          title: Image
          description: >-
            Optional single image (png, gif, jpg, webp; 2 MB), stored privately
            under group-images, shown uncropped as the listing row's leading
            avatar; initials when absent.
          required: false
          multiple: false
        billing_profile:
          type: object
          title: Billing profile
          description: >-
            The customer COST CENTRE for re-invoicing. Same field type and name
            as bb_workspace.billing_profile, deliberately, and a different
            meaning: contract or subscription at the top, customer cost centre
            below. Both exist; neither replaces the other.
          required: false
          multiple: false
        owner_user_id:
          type: reference
          title: Owner
          required: false
          multiple: false
          reference: user
        workspace_id:
          type: reference
          title: Workspace
          description: >-
            The tenant this customer belongs to. Built by BB-316; on
            feat/bb-315-multi-workspace, not yet on develop.
          required: false
          multiple: false
          reference: bb_workspace
      omitted:
        id: Entity key, not a modelled field.
        uuid: Entity key.
  bb_ticket:
    bb_ticket:
      title: bakers.build ticket
      view_modes:
        teaser:
          template: field-map
        full:
          template: field-map
      fields:
        created:
          type: datetime
          title: Created
          required: false
          multiple: false
        changed:
          type: datetime
          title: Changed
          required: false
          multiple: false
        project_id:
          type: reference
          title: Project
          required: false
          multiple: false
          reference: bb_project
        identifier:
          type: string
          title: Identifier
          required: true
          multiple: false
        workflow:
          type: string
          title: Workflow
          required: false
          multiple: false
          settings:
            allowed_values:
              - bb_work
        title:
          type: string
          title: Title
          required: true
          multiple: false
        description:
          type: text
          title: Description
          required: false
          multiple: false
        state:
          type: string
          title: State
          description: >-
            One of the ticket's workflow states; which subset applies is decided
            by `workflow`. `human_input` is not a state.
          required: false
          multiple: false
          settings:
            allowed_values:
              - qualification
              - plan
              - working
              - review
              - done
              - cancelled
        ticket_type:
          type: reference
          title: Type
          description: >-
            The ticket's type term (vocabulary `type`). A ticket whose type term
            is named `epic` is an epic.
          required: false
          multiple: false
          reference: bb_term
        recipe:
          type: reference
          title: Recipe
          description: The ticket's recipe term (vocabulary `recipe`).
          required: false
          multiple: false
          reference: bb_term
        labels:
          type: reference
          title: Labels
          required: false
          multiple: true
          reference: bb_term
          description: The ticket's label terms (vocabulary `label`).
        assignee_user_id:
          type: reference
          title: Assignee user
          required: false
          multiple: false
          reference: user
        reviewers:
          type: reference
          title: Reviewers
          required: false
          multiple: true
          reference: user
        priority:
          type: integer
          title: Priority
          required: false
          multiple: false
          settings:
            allowed_values:
              '1': High
              '2': Medium
              '3': Low
        parent_id:
          type: reference
          title: Parent ticket
          required: false
          multiple: false
          reference: bb_ticket
        blocked_by:
          type: reference
          title: Blocked by
          required: false
          multiple: true
          reference: bb_ticket
        origin:
          type: string
          title: Origin URL
          required: false
          multiple: false
        links:
          type: link
          title: Links
          description: >-
            Typed links (uri, title, options.bakers.kind); kind is
            server-derived.
          required: false
          multiple: true
        comments:
          type: reference
          title: Comments
          required: false
          multiple: true
          reference: bb_comment
          computed: true
          readonly: true
        pending_reviews:
          type: reference
          title: Pending reviews
          description: >-
            Submitted reviews awaiting a decision by the current assignee
            (computed; never writable). Private; not part of the ordinary
            comment timeline.
          required: false
          multiple: true
          reference: bb_comment
          computed: true
          readonly: true
        branch_name:
          type: string
          title: Branch name
          required: false
          multiple: false
        closed:
          type: boolean
          title: Closed
          required: false
          multiple: false
        frozen:
          type: boolean
          title: Frozen
          description: >-
            Operator hold. A frozen ticket is not claimable; an active run is
            left running.
          required: false
          multiple: false
        frozen_at:
          type: datetime
          title: Frozen at
          description: When the operator hold started. Server-stamped, cleared on unfreeze.
          required: false
          multiple: false
          readonly: true
        closed_date:
          type: datetime
          title: Closed date
          required: false
          multiple: false
        number:
          type: integer
          title: Number
          description: Per-project running number, allocated once on first save and frozen.
          required: false
          multiple: false
          readonly: true
        conductor_id:
          type: reference
          title: Conductor
          description: Assigning a conductor is what starts a run.
          required: false
          multiple: false
          reference: bb_conductor
        time_estimate:
          type: integer
          title: Estimated time
          description: >-
            Estimated effort in SECONDS, proposed at qualification, confirmed by
            a human.
          required: false
          multiple: false
        time_spent:
          type: integer
          title: Spent time
          description: >-
            Accounted effort in SECONDS, proposed at review, confirmed by a
            human.
          required: false
          multiple: false
        referenced_tickets:
          type: reference
          title: Referenced tickets
          description: Tickets carried by this deployment (the release batch).
          required: false
          multiple: true
          reference: bb_ticket
        environments:
          type: reference
          title: Environments
          description: The managed environments this ticket concerns.
          required: false
          multiple: true
          reference: bb_environment
        env_vars:
          type: text
          title: Environment variables
          description: >-
            .env-style KEY=value lines. Inherited by sub-tickets. Readable by
            anyone who can view this ticket.
          required: false
          multiple: false
        metrics:
          type: object
          title: Metrics
          description: Named success metrics for this ticket.
          required: false
          multiple: true
          settings:
            properties:
              name: string
              value: string
              unit: string
              recorded: datetime
        cleaned_up:
          type: boolean
          title: Cleaned up
          description: The herdr worktree has been torn down. Distinct from `closed`.
          required: false
          multiple: false
        owner_user_id:
          type: reference
          title: Owner
          required: false
          multiple: false
          reference: user
        base_branch:
          type: string
          title: Base branch
          description: >-
            Parent's branch, else the first project repo default_branch, else
            "main".
          required: false
          multiple: false
          computed: true
          readonly: true
        effective_env_vars:
          type: text
          title: Effective environment variables
