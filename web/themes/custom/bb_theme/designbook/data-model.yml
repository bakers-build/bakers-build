            shown under the workspace's name in the switcher panel and on the
            join screen, absent when empty.
          required: false
          multiple: false
        image:
          type: image
          title: Image
          description: >-
            Optional single image (png, gif, jpg, webp; 2 MB), stored privately
            and shown uncropped as the workspace's mark in the switcher and on
            the join screen; initials when absent.
          required: false
          multiple: false
        billing_profile:
          type: object
          title: Billing profile
          description: >-
            The CONTRACT or SUBSCRIPTION this tenant is served under. Same field
            type and name as bb_group.billing_profile, deliberately, and a
            different meaning: contract or subscription at the top, customer
            cost centre below. There is no `contract` field and there will not
            be one — the billing profile IS the contract level.
          required: false
          multiple: false
        owner_user_id:
          type: reference
          title: Owner
          required: false
          multiple: false
          reference: user
      omitted:
        id: Entity key, not a modelled field.
        uuid: Entity key.
  bb_team:
    bb_team:
      title: bakers.build team
      purpose: >-
        The stable crew, cutting across customer projects, and since BB-419 also
        their structural parent: a project is assigned to teams n:m through
        bb_project.teams and belongs to at least one. BB-462 D4 REVERSES what
        this field used to say: the assignment now DECIDES VISIBILITY — an
        account sees exactly the projects of the teams it belongs to (or every
        project, if it holds the workspace admin tier) — while still granting no
        RIGHTS of its own; a team answers "what do you see", the workspace alone
        answers "what may you do" (D2/D3). Is an OG group (registered in
        og.settings) with the roles non-member, member, lead (BB-456 D9,
        team-scoped statistics visibility) and owner (BB-462 D3, manages the
        team itself — who may join it and its own settings). The implicit member
        rank stays empty by design: team membership is a visibility fact, not a
        rights tier.
