          type: reference
          title: Projects
          description: >-
            The projects assigned to this team. Derived from bb_project.teams
            and never stored here, so the two directions cannot disagree.
          required: false
          multiple: true
          reference: bb_project
          computed: true
          readonly: true
        owner_user_id:
          type: reference
          title: Owner
          required: false
          multiple: false
          reference: user
  og_membership:
    default:
      title: OG membership
      purpose: >-
        Membership is ONE mechanism, modelled once: a user x group row reused by
        workspace and team rather than re-invented per level. This is NOT a
        bakers.build invention — it is contrib Organic Groups' own og_membership
        entity, whose only bundle is `default` (og.og_membership_type.default).
        BB-462 D7 REVERSES what this field used to say: og.settings now
        registers only bb_workspace and bb_team as OG groups — bb_project is
        deregistered entirely, and every membership row anchored on a project is
