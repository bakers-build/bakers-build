        uid:
          type: reference
          title: User
          description: The member. OG's own field name — not `user_id`.
          required: true
          multiple: false
          reference: user
        entity_type:
          type: string
          title: Group entity type
          description: >-
            Which level this membership is in. A workspace or project membership
            grants rights; a team membership does not, because the team carries
            no permissions.
          required: false
          multiple: false
          settings:
            allowed_values:
              - bb_workspace
              - bb_project
              - bb_team
        entity_bundle:
          type: string
          title: Group bundle
          description: >-
            Bundle of the group entity. Each of the three types has one bundle
            of its own name.
          required: false
          multiple: false
        entity_id:
          type: string
          title: Group entity ID
          description: >-
            Id of the group named by entity_type. A plain STRING in OG, not a
            reference, because the target entity type varies per row — so no
            screen can rely on an entity-reference widget here.
          required: false
          multiple: false
        state:
          type: string
          title: State
          description: >-
            Defaults to active. Only an active membership grants what its roles
            carry.
          required: true
          multiple: false
          settings:
            allowed_values:
              - active
              - pending
              - blocked
        roles:
          type: reference
          title: Roles
          description: >-
            MULTI-VALUE (OG sets cardinality unlimited) and a reference to
            og_role config objects by their full id, e.g.
            bb_workspace-bb_workspace-lead. The `member` role is never stored:
            OgMembership::preSave() revokes it and getRoles() prepends it on
            read, so a row that looks role-less is still a member.
          required: false
          multiple: true
          reference: og_role
      omitted:
        id: Entity key, not a modelled field.
        uuid: Entity key.
        language: >-
          Entity key; bakers.build memberships are single-language and no screen
          renders a language.
  bb_addon:
    bb_addon:
      title: bakers.build addon
      purpose: >-
        An addon definition at one version (name@version), registered by the
        conductors that run it. Entity access is admin-only; workspace leads see
        the addons in the workspace Settings › Addons tab, one row per name at
