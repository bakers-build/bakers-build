  bb_workspace:
    bb_workspace:
      title: bakers.build workspace
      purpose: >-
        The tenancy root: the object that says this data belongs to operator X
        and not operator Y. It holds all people and decides WHICH RIGHTS an
        account holds — BB-462 makes the workspace the ONLY level that carries
        rights: admin/contributor/guest (D2). Visibility of a project is a
        separate, per-team question (D4) that carries no rights of its own. Is
        an OG group (registered in og.settings) with the roles non-member,
        member, contributor, lead (labelled "Admin") and guest — five, not six:
        `owner`/`admin` were already consolidated into `lead` by BB-359 D12, and
        the machine principal `app` is GONE (BB-462 D9, its rank is answered
        entirely from OAuth scope now). Built by BB-316; the role set is
        BB-462's.
