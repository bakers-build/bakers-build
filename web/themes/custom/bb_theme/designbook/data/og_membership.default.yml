# One membership mechanism for two levels: workspace and team. BB-462 D7
# deregisters bb_project as an OG group entirely — there is no third arm
# any more, and every membership row that used to anchor on a project is
# GONE (deleted by the migration), not converted. Note what is NOT here: the
# `member` role. OgMembership::preSave() revokes it and getRoles() prepends it
# on read, so it is never stored — an active membership with an empty `roles`
# IS a member, and under BB-462 D1 that now means the account holds NO
# right at all (the implicit rank is emptied). `contributor`, `lead` (labelled
# "Admin") and `guest` are the three EXPLICIT workspace tiers a membership can
# hold; `owner` is the one team-level tier (BB-462 D3).
- id: '1'
  created: '2026-01-05T08:00:00+00:00'
  changed: '2026-01-05T08:00:00+00:00'
  type: default
  uid: '1'
  entity_type: bb_workspace
  entity_bundle: bb_workspace
  entity_id: '1'
  state: active
  roles:
    - bb_workspace-bb_workspace-lead
  __designbook:
    section: settings
- id: '2'
  created: '2026-01-08T09:30:00+00:00'
  changed: '2026-01-08T09:30:00+00:00'
  type: default
  uid: '2'
  entity_type: bb_workspace
  entity_bundle: bb_workspace
  entity_id: '1'
  state: active
  # An EMPTY roles array is the implicit `member` rank, and BB-462 D1 empties
  # it of every right — OG ranks are additive and cannot be narrowed, so any
  # right left here would be inherited by every membership including guests.
  # This account therefore holds nothing on this workspace; contrast with
  # uid 8 below (id '19'), the explicit `contributor` this ticket adds.
  roles: []
  __designbook:
    section: settings
