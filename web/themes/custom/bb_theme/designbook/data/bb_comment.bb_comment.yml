- id: '5'
  created: '2026-06-29T16:20:00+00:00'
  changed: '2026-06-29T16:20:00+00:00'
  ticket_id: '9'
  author: '4'
  author_name: bakers.build agent
  author_initials: GA
  author_color: offline
  type: summary
  body: >-
    <p><strong>Summary:</strong> The address step is rebuilt. Postcodes now
    validate per country against the shop's existing country table, and every
    entered value survives a failed submit, so a rejected write no longer costs
    the customer their typing.</p><p><strong>What changed.</strong> The step was
    one controller holding both the country lookup and the postcode rules, which
    is why adding a country meant editing the validator. The rules moved into a
    per-country strategy resolved from the country table, so a new country is a
    table row rather than a code change. The controller kept exactly one job:
    collect the submitted values, ask the resolved strategy whether they are
    acceptable, and re-render the step with them still in place when they are
    not.</p><p><strong>Why the values used to disappear.</strong> The step
    rebuilt its form from the persisted order rather than from the submitted
    request, so anything the customer typed after the last successful save was
    gone by the time the error rendered. The form now rebuilds from the request
    first and falls back to the order, which is the same ordering the rest of
    the checkout already used and the reason this was a one-line fix once it was
    found rather than a rewrite.</p><p><strong>What was tested.</strong>
    Fourteen postcode formats across nine countries, including the three that
    are genuinely ambiguous (Ireland's Eircode, the Netherlands'
    four-digit-plus-two-letter form, and Canada's alternating pattern), plus the
    two failure paths that matter: an unknown country falling back to a
    permissive rule rather than refusing, and a submit rejected twice in a row
    keeping the typed values both times. Coverage on the checkout module is at
    71.5%, up from 64.2%, and the two uncovered branches are both in the legacy
    address importer this ticket does not touch.</p><p><strong>What is
    deliberately not done.</strong> The country table is still read on every
    request rather than cached; measured at 0.4ms it is not worth a cache and a
    cache invalidation path yet, and saying so is cheaper than a reader
    rediscovering it. Address autocompletion was raised during the work and is
    not in scope — it needs a third-party provider, a contract and a failure
    path, so it belongs to its own ticket rather than to this one's tail
    end.</p><p><strong>How to look at it.</strong> The pipeline link carries the
    run; the report link carries the fourteen format cases as named scenarios,
    which is faster to read than the diff if the question is "does it handle my
    country".</p>
  __designbook:
    section: bb_ticket
- id: '6'
  created: '2026-06-29T16:35:00+00:00'
  changed: '2026-06-29T16:35:00+00:00'
  ticket_id: '9'
  author: '4'
  author_name: bakers.build agent
  author_initials: GA
  author_color: offline
  type: test
  body: >-
    <p>Fourteen postcode formats across nine countries, each as its own named
    scenario rather than a table-driven loop, so a failure names the country
    instead of a row index. The three ambiguous formats are called out
    separately because they are the ones a regression would hit first: Ireland's
    Eircode (no fixed length, letters and digits mixed), the Netherlands' four
    digits plus two letters with an optional space, and Canada's strict
    alternating letter-digit pattern.</p><p>Two failure paths are covered as
    deliberately as the happy ones. An unknown country falls back to a
    permissive rule rather than refusing the address — refusing would make the
    shop unreachable from any country nobody has added yet, which is a worse
    failure than accepting a postcode it cannot check. And a submit rejected
    twice in a row keeps the typed values both times, because the bug being
    fixed was specifically that the second rejection cleared what the first one
    had preserved.</p>
  __designbook:
    section: bb_ticket
- id: '7'
  created: '2026-06-29T17:05:00+00:00'
  changed: '2026-06-29T17:05:00+00:00'
  ticket_id: '9'
  author: '3'
  author_name: Marieke van Dijk
  author_initials: MD
  author_color: lease
  type: review
  body: >-
    <p>Read the strategy resolution twice before I was happy with it. The thing
    I was looking for and did not find is a silent default: an unknown country
    resolves to the permissive rule <em>explicitly</em>, and the resolution logs
    which rule it picked, so "why did this postcode pass" is answerable from the
    log rather than by reading the table. That is the difference between a
    fallback and an accident.</p><p>One thing I asked to change and one I did
    not. The changed one: the country table lookup was inside the loop over
    submitted fields, so a five-field address hit it five times — hoisted. The
    one I left: the table is not cached. At 0.4ms it does not pay for a cache
    invalidation path, and the summary says so, which is what I wanted rather
    than the cache itself.</p>
  __designbook:
    section: bb_ticket
