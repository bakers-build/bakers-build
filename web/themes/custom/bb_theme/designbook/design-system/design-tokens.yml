primitive:
  layout:
    spacing:
      base:
        $value: 4px
        $type: dimension
      space-1:
        $value: 4px
        $type: dimension
      space-2:
        $value: 8px
        $type: dimension
      space-3:
        $value: 12px
        $type: dimension
      space-4:
        $value: 16px
        $type: dimension
      space-5:
        $value: 20px
        $type: dimension
      space-6:
        $value: 24px
        $type: dimension
    row-h:
      $value: 34px
      $type: dimension
    control-h:
      $value: 28px
      $type: dimension
    radius:
      '5':
        $value: 5px
        $type: dimension
      '7':
        $value: 7px
        $type: dimension
      '10':
        $value: 10px
        $type: dimension
  style:
    color:
      flour:
        $value: '#F5EBDA'
        $type: color
      rye:
        $value: '#2B2116'
        $type: color
      butter:
        $value: '#F3CE3A'
        $type: color
      lime:
        $value: '#BFE07A'
        $type: color
      rose:
        $value: '#F4AFC0'
        $type: color
      crust:
        $value: '#B8692E'
        $type: color
      muted:
        $value: '#8A7860'
        $type: color
    fontFamily:
      sans:
        $value: >-
          system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          sans-serif
        $type: fontFamily
      mono:
        $value: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace
        $type: fontFamily
    fontSize:
      '11':
        $value: 11px
        $type: dimension
      '12':
        $value: 12px
        $type: dimension
      '13':
        $value: 13px
        $type: dimension
      '16':
        $value: 16px
        $type: dimension
      '24':
        $value: 24px
        $type: dimension
    fontWeight:
      regular:
        $value: 400
        $type: fontWeight
      medium:
        $value: 500
        $type: fontWeight
      semibold:
        $value: 600
        $type: fontWeight
      bold:
        $value: 700
        $type: fontWeight
    lineHeight:
      tight:
        $value: 1.2
        $type: number
      snug:
        $value: 1.3
        $type: number
      relaxed:
        $value: 1.5
        $type: number
      normal:
        $value: 1.45
        $type: number
    elevation:
      '1':
        $value:
          color: '#14171A'
          offsetX: 0px
          offsetY: 0px
          blur: 4px
          spread: 0px
          opacity: 0.06
        $type: shadow
      '2':
        $value:
          color: '#14171A'
          offsetX: 0px
          offsetY: 0px
          blur: 12px
          spread: 0px
          opacity: 0.1
        $type: shadow
      '3':
        $value:
          color: '#14171A'
          offsetX: 0px
          offsetY: 0px
          blur: 24px
          spread: 0px
          opacity: 0.14
        $type: shadow
    lineWeight:
      hairline:
        $value: 1px
        $type: dimension
      emphasis:
        $value: 2px
        $type: dimension
    duration:
      '120':
        $value: 120ms
        $type: duration
      '200':
        $value: 200ms
        $type: duration
    focusRing:
      width:
        $value: 2px
        $type: dimension
      color:
        $value: '{primitive.style.color.rye}'
        $type: color
semantic:
  color:
    app:
      $value: '#F7F2E8'
      $type: color
    surface:
      $value: '#FFFDF8'
      $type: color
    surface-2:
      $value: '#F0E9DC'
      $type: color
    surface-3:
      $value: '#E6DDCD'
      $type: color
    input:
      $value: '#FFFDF8'
      $type: color
    canvas:
      $value: '#F0E9DC'
      $type: color
    text:
      $value: '{primitive.style.color.rye}'
      $type: color
    text-light:
      $value: '#63584A'
      $type: color
    text-faint:
      $value: '#63584A'
      $type: color
    title:
      $value: '{primitive.style.color.rye}'
      $type: color
    primary:
      $value: '{primitive.style.color.rye}'
      $type: color
    chart-series-a:
      $value: '{primitive.style.color.crust}'
      $type: color
      $description: First comparison series (solid / circle).
    chart-series-b:
      $value: '#718F39'
      $type: color
      $description: Second comparison series (dashed / square).
    chart-series-c:
      $value: '#A28317'
      $type: color
      $description: Third comparison series (dotted / circle).
    chart-series-d:
      $value: '#DE5779'
      $type: color
      $description: Fourth comparison series (dash-dot / square).
    chart-series-e:
      $value: '#C8432F'
      $type: color
      $description: Fifth comparison series (sparse-dot / circle).
    chart-series-f:
      $value: '#6E5D49'
      $type: color
      $description: Sixth comparison series (even-dash / square).
    chart-flow-new:
      $value: '{primitive.style.color.crust}'
      $type: color
      $description: >-
        Flow chart "new" line, points and end label. Observed as chart-series-a
        (#494fe5) in reference 3a2b0e29e246a9d7/c8ecb5b726386e24.
    chart-flow-done:
      $value: '#718F39'
      $type: color
      $description: >-
        Flow chart "done" line, points and end label. Observed as the Figma
        proposal chart-outflow (#0d9488) in reference
        3a2b0e29e246a9d7/c8ecb5b726386e24; teal-600 is the closest existing
        primitive, so no new primitive is added.
    chart-flow-grows:
      $value: '#F8D9D0'
      $type: color
      $description: >-
        Flow chart fill where new exceeds done (backlog grows). Observed as the
        state-unassigned-tint colour.
    chart-flow-shrinks:
      $value: '#E8F1D6'
      $type: color
      $description: >-
        Flow chart fill where done exceeds new (backlog shrinks). Observed as
        the state-running-tint colour.
    control-border:
      $value: '#857A68'
      $type: color
    on-primary:
      $value: '#FFFFFF'
      $type: color
    border:
      $value: '#E0D6C4'
      $type: color
    border-2:
      $value: '#EDE6D8'
      $type: color
    link:
      $value: '{primitive.style.color.rye}'
      $type: color
    focus-ring:
      $value: '{primitive.style.focusRing.color}'
      $type: color
    state-unassigned:
      $value: '#C8432F'
      $type: color
    state-attention:
      $value: '{primitive.style.color.butter}'
      $type: color
    state-running:
      $value: '{primitive.style.color.muted}'
      $type: color
    state-lease:
      $value: '{primitive.style.color.crust}'
      $type: color
    state-offline:
      $value: '{primitive.style.color.muted}'
      $type: color
    type-feature:
      $value: '#718F39'
      $type: color
    type-bug:
      $value: '#C8432F'
      $type: color
    type-chore:
      $value: '{primitive.style.color.crust}'
      $type: color
    state-unassigned-tint:
      $value: '#F8D9D0'
      $type: color
    state-attention-tint:
      $value: '#FCEFC0'
      $type: color
    state-running-tint:
      $value: '#EFE9DE'
      $type: color
    state-lease-tint:
      $value: '#F3E4D7'
      $type: color
    state-offline-tint:
      $value: '#ECE6DA'
      $type: color
    state-unassigned-ink:
      $value: '#8A2A1B'
      $type: color
    state-attention-ink:
      $value: '#5A4500'
      $type: color
    state-running-ink:
      $value: '#3D3224'
      $type: color
    state-lease-ink:
      $value: '#6B3A14'
      $type: color
    state-ink:
      $value: '{primitive.style.color.rye}'
      $type: color
      $description: >-
        Ink for text placed on a state fill (state-attention, state-review,
        state-done, avatar-*). Every pair reaches 4.5:1 in both modes.
    state-attention-mark:
      $type: color
      $value: '#8F6B00'
      $description: >-
        Dot, line or border that says "waits for you" on a light surface, where
        butter itself is too light.
    state-offline-ink:
      $type: color
      $value: '#4A3E30'
      $description: Text on state-offline-tint.
    state-review:
      $type: color
      $value: '{primitive.style.color.rose}'
      $description: Fill of the review state.
    state-done:
      $type: color
      $value: '{primitive.style.color.lime}'
      $description: Fill of the done state.
    avatar-a:
      $type: color
      $value: '{primitive.style.color.rose}'
      $description: Avatar initials fill behind state-ink text.
    avatar-b:
      $type: color
      $value: '#CFE69A'
      $description: Avatar initials fill behind state-ink text.
    avatar-c:
      $type: color
      $value: '#EAC6A4'
      $description: Avatar initials fill behind state-ink text.
    avatar-d:
      $type: color
      $value: '#D9D3C9'
      $description: Avatar initials fill behind state-ink text.
  typography:
    display:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.24}'
        fontWeight: '{primitive.style.fontWeight.bold}'
        lineHeight: '{primitive.style.lineHeight.tight}'
      $type: typography
    heading:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.16}'
        fontWeight: '{primitive.style.fontWeight.bold}'
        lineHeight: '{primitive.style.lineHeight.tight}'
      $type: typography
    section:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.16}'
        fontWeight: '{primitive.style.fontWeight.bold}'
        lineHeight: '{primitive.style.lineHeight.tight}'
      $type: typography
    body:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.13}'
        fontWeight: '{primitive.style.fontWeight.regular}'
        lineHeight: '{primitive.style.lineHeight.normal}'
      $type: typography
    lead:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.13}'
        fontWeight: '{primitive.style.fontWeight.regular}'
        lineHeight: '{primitive.style.lineHeight.normal}'
      $type: typography
    caption:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.12}'
        fontWeight: '{primitive.style.fontWeight.regular}'
        lineHeight: '{primitive.style.lineHeight.normal}'
      $type: typography
    eyebrow:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.11}'
        fontWeight: '{primitive.style.fontWeight.bold}'
        lineHeight: '{primitive.style.lineHeight.tight}'
      $type: typography
    mono:
      $value:
        fontFamily: '{primitive.style.fontFamily.mono}'
        fontSize: '{primitive.style.fontSize.12}'
        fontWeight: '{primitive.style.fontWeight.semibold}'
        lineHeight: '{primitive.style.lineHeight.normal}'
      $type: typography
  fontWeight:
    regular:
      $value: '{primitive.style.fontWeight.regular}'
      $type: fontWeight
    medium:
      $value: '{primitive.style.fontWeight.medium}'
      $type: fontWeight
    semibold:
      $value: '{primitive.style.fontWeight.semibold}'
      $type: fontWeight
    bold:
      $value: '{primitive.style.fontWeight.bold}'
      $type: fontWeight
  lineHeight:
    tight:
      $value: '{primitive.style.lineHeight.tight}'
      $type: number
    snug:
      $value: '{primitive.style.lineHeight.snug}'
      $type: number
    relaxed:
      $value: '{primitive.style.lineHeight.relaxed}'
      $type: number
    normal:
      $value: '{primitive.style.lineHeight.normal}'
      $type: number
  radius:
    xs:
      $value: '{primitive.layout.radius.5}'
      $type: dimension
    sm:
      $value: '{primitive.layout.radius.7}'
      $type: dimension
    md:
      $value: '{primitive.layout.radius.10}'
      $type: dimension
  shadow:
    shadow-1:
      $value: '{primitive.style.elevation.1}'
      $type: shadow
    shadow-2:
      $value: '{primitive.style.elevation.2}'
      $type: shadow
    shadow-3:
      $value: '{primitive.style.elevation.3}'
      $type: shadow
  transition:
    fast:
      $value: '{primitive.style.duration.120}'
      $type: duration
    base:
      $value: '{primitive.style.duration.200}'
      $type: duration
component:
  empty-state:
    icon:
      $value: 64px
      $type: dimension
      $description: Regular state illustration size, independent of layout density.
    compact-icon:
      $value: 24px
      $type: dimension
      $description: Compact state illustration size, independent of layout density.
  shell:
    offset:
      $value: var(--drupal-displace-offset-top, 0px)
      $type: dimension
    height:
      $value: calc(100dvh - var(--drupal-displace-offset-top, 0px))
      $type: dimension
  section:
    padding-y:
      $value: '{primitive.layout.spacing.space-5}'
      $type: dimension
  grid:
    gap:
      $value: '{primitive.layout.spacing.space-5}'
      $type: dimension
  container:
    max-width:
      $value: 1280px
      $type: dimension
  row:
    height:
      $value: '{primitive.layout.row-h}'
      $type: dimension
  control:
    height:
      $value: '{primitive.layout.control-h}'
      $type: dimension
  brand:
    compact:
      braid-width:
        $value: 24px
        $type: dimension
        $description: >-
          Width of the braid in the compact brand the gate chrome uses. Fixed:
          it does not follow the layout density.
      braid-height:
        $value: 38.4px
        $type: dimension
        $description: >-
          Height of the braid in the compact brand, keeping the default braid's
          40:64 proportion.
      wordmark-width:
        $value: 96px
        $type: dimension
        $description: >-
          Width of the wordmark in the compact brand; its height follows the SVG
          aspect ratio.
      gap:
        $value: 8px
        $type: dimension
        $description: >-
          Gap between braid and wordmark in the compact brand (24 + 8 + 96 =
          128px combined).
  gate:
    body:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.16}'
        fontWeight: '{primitive.style.fontWeight.regular}'
        lineHeight: '{primitive.style.lineHeight.normal}'
      $type: typography
      $description: >-
        Body copy of a standalone gate result, such as the device sign-in
        confirmation: readable at 16px rather than the 13px product body.
  zone:
    gap:
      sm:
        $value: '{primitive.layout.spacing.space-3}'
        $type: dimension
        $description: 'Zone cell gap `sm`: the space-3 step (12px, 16px cozy).'
      md:
        $value: '{primitive.layout.spacing.space-5}'
        $type: dimension
        $description: 'Zone cell gap `md`, the default: the space-5 step (20px, 24px cozy).'
      lg:
        $value: '{primitive.layout.spacing.space-6}'
        $type: dimension
        $description: 'Zone cell gap `lg`: the space-6 step (24px, 32px cozy).'
themes:
  cozy:
    primitive:
      layout:
        spacing:
          base:
            $value: 6px
            $type: dimension
          space-1:
            $value: 8px
            $type: dimension
          space-2:
