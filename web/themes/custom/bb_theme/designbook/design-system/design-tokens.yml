semantic:
  color:
    app:
      $value: '{primitive.style.color.neutral-100}'
      $type: color
    surface:
      $value: '{primitive.style.color.neutral-50}'
      $type: color
    surface-2:
      $value: '{primitive.style.color.neutral-200}'
      $type: color
    surface-3:
      $value: '{primitive.style.color.neutral-300}'
      $type: color
    input:
      $value: '{primitive.style.color.neutral-100}'
      $type: color
    canvas:
      $value: '{primitive.style.color.neutral-200}'
      $type: color
    text:
      $value: '{primitive.style.color.neutral-800}'
      $type: color
    text-light:
      $value: '{primitive.style.color.neutral-600}'
      $type: color
    text-faint:
      $value: '{primitive.style.color.neutral-600}'
      $type: color
    title:
      $value: '{primitive.style.color.neutral-900}'
      $type: color
    primary:
      $value: '{primitive.style.color.violet-600}'
      $type: color
    chart-series-a:
      $value: '{primitive.style.color.violet-600}'
      $type: color
      $description: First comparison series (solid / circle).
    chart-series-b:
      $value: '{primitive.style.color.teal-500}'
      $type: color
      $description: Second comparison series (dashed / square).
    chart-series-c:
      $value: '{primitive.style.color.amber-500}'
      $type: color
      $description: Third comparison series (dotted / circle).
    chart-series-d:
      $value: '{primitive.style.color.indigo-400}'
      $type: color
      $description: Fourth comparison series (dash-dot / square).
    chart-series-e:
      $value: '{primitive.style.color.red-500}'
      $type: color
      $description: Fifth comparison series (sparse-dot / circle).
    chart-series-f:
      $value: '{primitive.style.color.neutral-600}'
      $type: color
      $description: Sixth comparison series (even-dash / square).
    chart-flow-new:
      $value: '{primitive.style.color.violet-600}'
      $type: color
      $description: >-
        Flow chart "new" line, points and end label. Observed as chart-series-a
        (#494fe5) in reference 3a2b0e29e246a9d7/c8ecb5b726386e24.
    chart-flow-done:
      $value: '{primitive.style.color.teal-600}'
      $type: color
      $description: >-
        Flow chart "done" line, points and end label. Observed as the Figma
        proposal chart-outflow (#0d9488) in reference
        3a2b0e29e246a9d7/c8ecb5b726386e24; teal-600 is the closest existing
        primitive, so no new primitive is added.
    chart-flow-grows:
      $value: '{primitive.style.color.red-100}'
      $type: color
      $description: >-
        Flow chart fill where new exceeds done (backlog grows). Observed as the
        state-unassigned-tint colour.
    chart-flow-shrinks:
      $value: '{primitive.style.color.teal-100}'
      $type: color
      $description: >-
        Flow chart fill where done exceeds new (backlog shrinks). Observed as
        the state-running-tint colour.
    control-border:
      $value: '{primitive.style.color.neutral-500}'
      $type: color
    on-primary:
      $value: '#ffffff'
      $type: color
    border:
      $value: '{primitive.style.color.neutral-300}'
      $type: color
    border-2:
      $value: '{primitive.style.color.neutral-200}'
      $type: color
    link:
      $value: '{primitive.style.color.violet-600}'
      $type: color
    focus-ring:
      $value: '{primitive.style.focusRing.color}'
      $type: color
    state-unassigned:
      $value: '{primitive.style.color.red-500}'
      $type: color
    state-attention:
      $value: '{primitive.style.color.amber-500}'
      $type: color
    state-running:
      $value: '{primitive.style.color.teal-500}'
      $type: color
    state-lease:
      $value: '{primitive.style.color.indigo-400}'
      $type: color
    state-offline:
      $value: '{primitive.style.color.neutral-500}'
      $type: color
    type-feature:
      $value: '{primitive.style.color.indigo-400}'
      $type: color
    type-bug:
      $value: '{primitive.style.color.red-500}'
      $type: color
    type-chore:
      $value: '{primitive.style.color.amber-500}'
      $type: color
    state-unassigned-tint:
      $value: '{primitive.style.color.red-100}'
      $type: color
    state-attention-tint:
      $value: '{primitive.style.color.amber-100}'
      $type: color
    state-running-tint:
      $value: '{primitive.style.color.teal-100}'
      $type: color
    state-lease-tint:
      $value: '{primitive.style.color.indigo-100}'
      $type: color
    state-offline-tint:
      $value: '{primitive.style.color.neutral-200}'
      $type: color
    state-unassigned-ink:
      $value: '{primitive.style.color.red-700}'
      $type: color
    state-attention-ink:
      $value: '{primitive.style.color.amber-800}'
      $type: color
    state-running-ink:
      $value: '{primitive.style.color.teal-800}'
      $type: color
    state-lease-ink:
      $value: '{primitive.style.color.indigo-800}'
      $type: color
    state-ink:
      $value: '#000000'
      $type: color
      $description: >-
        Mode-invariant ink for text placed directly on a state-hue background
        (state.running/attention/unassigned/lease/offline base colors, not their
        tints). Those hues do not invert between light and dark mode, so an ink
        that DOES invert (like semantic.color.title) drops below WCAG contrast
        in one of the two modes; this token stays constant in both and keeps
        ≥4.5:1 against every state hue.
  typography:
    display:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.24}'
        fontWeight: '{primitive.style.fontWeight.bold}'
        lineHeight: '{primitive.style.lineHeight.tight}'
      $type: typography
    heading:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.16}'
        fontWeight: '{primitive.style.fontWeight.bold}'
        lineHeight: '{primitive.style.lineHeight.tight}'
      $type: typography
    section:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.16}'
        fontWeight: '{primitive.style.fontWeight.bold}'
        lineHeight: '{primitive.style.lineHeight.tight}'
      $type: typography
    body:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.13}'
        fontWeight: '{primitive.style.fontWeight.regular}'
        lineHeight: '{primitive.style.lineHeight.normal}'
      $type: typography
    lead:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.13}'
        fontWeight: '{primitive.style.fontWeight.regular}'
        lineHeight: '{primitive.style.lineHeight.normal}'
      $type: typography
    caption:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.12}'
        fontWeight: '{primitive.style.fontWeight.regular}'
        lineHeight: '{primitive.style.lineHeight.normal}'
      $type: typography
    eyebrow:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.11}'
        fontWeight: '{primitive.style.fontWeight.bold}'
        lineHeight: '{primitive.style.lineHeight.tight}'
      $type: typography
    mono:
      $value:
        fontFamily: '{primitive.style.fontFamily.mono}'
        fontSize: '{primitive.style.fontSize.12}'
        fontWeight: '{primitive.style.fontWeight.semibold}'
        lineHeight: '{primitive.style.lineHeight.normal}'
      $type: typography
  fontWeight:
    regular:
      $value: '{primitive.style.fontWeight.regular}'
      $type: fontWeight
    medium:
      $value: '{primitive.style.fontWeight.medium}'
      $type: fontWeight
    semibold:
      $value: '{primitive.style.fontWeight.semibold}'
      $type: fontWeight
    bold:
      $value: '{primitive.style.fontWeight.bold}'
      $type: fontWeight
  lineHeight:
    tight:
      $value: '{primitive.style.lineHeight.tight}'
      $type: number
    snug:
      $value: '{primitive.style.lineHeight.snug}'
      $type: number
    relaxed:
      $value: '{primitive.style.lineHeight.relaxed}'
      $type: number
    normal:
      $value: '{primitive.style.lineHeight.normal}'
      $type: number
  radius:
    xs:
      $value: '{primitive.layout.radius.5}'
      $type: dimension
    sm:
      $value: '{primitive.layout.radius.7}'
      $type: dimension
    md:
      $value: '{primitive.layout.radius.10}'
      $type: dimension
  shadow:
    shadow-1:
      $value: '{primitive.style.elevation.1}'
      $type: shadow
    shadow-2:
      $value: '{primitive.style.elevation.2}'
      $type: shadow
    shadow-3:
      $value: '{primitive.style.elevation.3}'
      $type: shadow
  transition:
    fast:
      $value: '{primitive.style.duration.120}'
      $type: duration
    base:
      $value: '{primitive.style.duration.200}'
      $type: duration
component:
  empty-state:
    icon:
      $value: 64px
      $type: dimension
      $description: Regular state illustration size, independent of layout density.
    compact-icon:
      $value: 24px
      $type: dimension
      $description: Compact state illustration size, independent of layout density.
  shell:
    offset:
      $value: var(--drupal-displace-offset-top, 0px)
      $type: dimension
    height:
      $value: calc(100dvh - var(--drupal-displace-offset-top, 0px))
      $type: dimension
  section:
    padding-y:
      $value: '{primitive.layout.spacing.space-5}'
      $type: dimension
  grid:
    gap:
      $value: '{primitive.layout.spacing.space-5}'
      $type: dimension
  container:
    max-width:
      $value: 1280px
      $type: dimension
  row:
    height:
      $value: '{primitive.layout.row-h}'
      $type: dimension
  control:
    height:
      $value: '{primitive.layout.control-h}'
      $type: dimension
  brand:
    compact:
      width:
        $value: 128px
        $type: dimension
        $description: >-
          Width of the logo with wordmark in the compact brand the gate chrome
          uses; its height follows the SVG aspect ratio. Fixed: it does not
          follow the layout density.
  gate:
    body:
      $value:
        fontFamily: '{primitive.style.fontFamily.sans}'
        fontSize: '{primitive.style.fontSize.16}'
        fontWeight: '{primitive.style.fontWeight.regular}'
        lineHeight: '{primitive.style.lineHeight.normal}'
      $type: typography
      $description: >-
        Body copy of a standalone gate result, such as the device sign-in
        confirmation: readable at 16px rather than the 13px product body.
  zone:
    gap:
      sm:
        $value: '{primitive.layout.spacing.space-3}'
        $type: dimension
        $description: 'Zone cell gap `sm`: the space-3 step (12px, 16px cozy).'
      md:
        $value: '{primitive.layout.spacing.space-5}'
        $type: dimension
        $description: 'Zone cell gap `md`, the default: the space-5 step (20px, 24px cozy).'
      lg:
        $value: '{primitive.layout.spacing.space-6}'
        $type: dimension
        $description: 'Zone cell gap `lg`: the space-6 step (24px, 32px cozy).'
