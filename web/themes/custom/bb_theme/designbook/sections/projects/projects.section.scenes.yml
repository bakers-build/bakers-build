  - name: project-detail-members
    group: Screens
    section: projects
    docs: >-
      MEMBERS AS ITS OWN FACE (BB-435). It was the second of two blocks on the
      Settings tab, which filed the project's people under infrastructure while
      the team screen — which has had a Members face since BB-419 — filed the
      same object under people. One object cannot be two kinds of thing
      depending on which screen is open, so this face exists and Settings kept
      Environments.

      THIS FACE AND THE TEAM'S MEMBERS FACE ARE ONE SURFACE, parameterised by
      the group they render for. That is what BB-419 established and this
      ticket keeps: the roster, the add form and the remove control do not know
      which kind of group they belong to, and the ONE place the kind shows is
      what the visible labels require — the noun in the remove sentence, and
      whether the item carries a role at all.

      A MEMBER IS ADDED THROUGH A FORM, AND ONLY HERE. The projects section used
      to prescribe the opposite — an assignment picker where the pick IS the
      write — and that contradicted `action-pattern.md`, which it sat beside.
      Adding a person CREATES an `og_membership`; *Inline edit*'s reason does not
      reach a create, because there is no value to put back. So the surface is a
      `form` the operator submits: one person control in `pills`, one primary
      submit in `actions`, and nothing that commits on select.

      IT IS A FORM IN THE MAIN CONTENT AND NOT A DIALOG, which is a decision
      with a reason rather than an exception. The dialog rule is written for a
      create surface with a LIST CONTEXT to lose; this control lives inside the
      face it changes, and a successful submit re-renders that face alone — the
      tab strip, the rail and the shell stay put. A dialog would take the list
      away in order to add to it.

      THE ROSTER IS A `list`, NOT A TABLE, which is the settings section's rule
      reaching this screen: no columns and no header row, `layout: cards`
      with `spacing: comfortable` (BB-638),
      because a membership is a person read one at a time and not a row of
      comparable figures. Putting the values in cells aligned to a grid would
      promise a comparison the data does not support.

      EACH MEMBER IS ONE LINE OF FACTS, NOT A LEFT-TO-RIGHT RUN OF CELLS:
      each item is a patterned row (BB-638) — `headline: [person]`,
      `meta: [joined, team]`, `right: [state, role, transfer, remove]` —
      so the person and the joined date sit on the left and the role or
      state, transfer and remove are right-aligned, as
      GroupMembersForm::listZone() renders it.

      THE ROLE IS PICKED ON THE MEMBER'S OWN ITEM. A role IS reversible, so here
      the pick genuinely is the write — no save button, no dirty state, no
      confirmation. A project ships exactly two roles, and they are the two the
      site actually has: `lead` and `member`. `member` is `role_type: required`,
      so `OgMembership::preSave()` revokes it and `getRoles()` prepends it on
      read — it is never stored, and an empty `roles` array IS a member. The
      scene draws the control as a `picker` cell because that is the design's
      statement; on the server the same control arrives as a `rendered` cell,
      because a pick that IS the write has to be a named submit trigger of the
      enclosing form and a cell is DATA. One design, one delivery mechanism.

      REMOVE NAMES ITS EFFECT AND IS NOT CONFIRMED. The rule confirms an action
      exactly when it ends or discards the ticket; a membership removal does
      neither. But on a rights-granting surface it revokes somebody's access,
      which is a server-side effect, so the control names it. The sentence is the
      accessible name of an icon-only button and never visible text.

      ALL THREE WRITE NOW, on the server. In a scene nothing posts and nothing
      opens: Storybook never calls `Drupal.attachBehaviors`, so the open state
      below is a prop and the panel is markup. The scene proves the shape; the
      browser suite proves the behaviour.
    items:
      - scene: "design-system:shell"
        with:
          # An entity place opens no create surface of its own. The add form is
          # part of this face, in the main content — see the docs above.
          overlay: ""
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: bakers.build Platform
                      description: Members · the people of this project
                    slots:
                      tabs:
                        component: bb_theme:tabs
                        props:
                          label: Project sections
                          items:
                            - label: Overview
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-overview
                              active: false
                            - label: Board
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-board
                              active: false
                            - label: Tickets
                              url: /?path=/story/designbook-sections-tickets-scenes--ticket-list
                              active: false
                            - label: Stats
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-stats
                              active: false
                            - label: Runs
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-runs
                              active: false
                            - label: Members
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-members
                              active: true
                            - label: Settings
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-settings
                              active: false
                main:
                  - component: bb_theme:zone
                    props:
                      gap: none
                      description: A project is a rights level — a member's role is picked on their own item
                    slots:
                      heading: Members
                      # NO `[+]` IN THE ACTIONS SLOT, deliberately. The add surface is
                      # a form on the face rather than a control behind an action, so
                      # there is nothing here to open — and an action that duplicated
                      # the form would be a second way to add, which is exactly what
                      # criterion 1 forbids.
                      content:
                        - component: bb_theme:form
                          slots:
                            # ONE PEER PROPERTY, so one pill. The widget grammar allows
                            # at most one emphasised property per surface and this
                            # surface has nothing to emphasise against, so the pill is
                            # not `prominent`.
                            pills:
                              - component: bb_theme:property_pill
                                props:
                                  name: account
                                  label: Person
                                  icon: user
                                  picker_id: project-detail-add-member
                                  prominent: false
                                  multiple: false
                                  open: false
                                  searchable: true
                                  search_placeholder: Search by name
                                  search_label: Search by name
                                  aria_label: Choose the person to add to bakers.build Platform.
                                  value_label: ""
                                  value_labels: []
                                  values: []
                                  clearable: false
                                  clear_label: ""
                                  creatable: false
                                  create_label: ""
                                  options:
                                    - value: '5'
                                      label: Lena Fischer
                                      description: lena.fischer@keytec.example
                                      selected: false
                                    - value: '6'
                                      label: Tom Beckett
                                      description: tom.beckett@partner.example
                                      selected: false
                            # ONE PRIMARY SUBMIT AND NOTHING ELSE. The grammar allows a
                            # second, secondary action — Cancel or create-another — and
                            # neither applies: there is nothing to cancel on a face the
                            # operator is already on, and adding one person at a time is
                            # the whole interaction.
                            actions:
                              - component: bb_theme:button
                                props:
                                  variant: primary
                                  type: submit
                                  label: Add member
                                  disabled: false
                                  icon_only: false
                        # THE ROSTER IS ONE `list` NODE. A slot holding two single-entity
                        # nodes IS a hand-rolled listing, which is what the container
                        # exists to remove; the form above it is not part of that rule,
                        # because a form is not an item of the list.
                        - component: bb_theme:list
                          props:
                            layout: cards
                            spacing: comfortable
                            pattern:
                              headline:
                                - person
                              meta:
                                - joined
                                - team
                              right:
                                - state
                                - role
                                - transfer
                                - remove
                            items:
                              # BOTH INTERACTIVE CELLS ARE `rendered` (BB-435): the role picker's
                              # panel and the remove button are markup `option_picker`/`button`
                              # produce, addressed by the cell's key rather than shaped by `list`
                              # itself — see the section prose above. Storybook never calls
                              # `Drupal.attachBehaviors`, so no panel opens in a build; `markup` here
                              # is the same tag-free, escaped-string stand-in `list.rendered.story.yml`
                              # establishes, and the live picker/button proof is that story plus the
                              # Kernel test that reads the real rendered surface.
                              - cells:
                                  person:
                                    kind: person
                                    display_name: Christian Wiedemann
                                    initials: CW
                                    color: unassigned
                                    mail: christian.wiedemann@keytec.example
                                  role:
                                    kind: rendered
                                    markup: Lead
                                  joined:
                                    kind: mono
                                    value: joined 2026-01-15
                                  remove:
                                    kind: rendered
                                    markup: Remove
                              - cells:
                                  person:
                                    kind: person
                                    display_name: Sven Gruber
                                    initials: SG
                                    color: running
                                    mail: sven.gruber@keytec.example
                                  role:
                                    kind: rendered
                                    markup: Member
                                  joined:
                                    kind: mono
                                    value: joined 2026-01-15
                                  remove:
                                    kind: rendered
                                    markup: Remove
