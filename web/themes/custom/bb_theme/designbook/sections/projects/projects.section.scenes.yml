  - name: project-detail-billing
    group: Screens
    section: projects
    docs: 'THE BILLING FACE (BB-666). The page header says what it holds — "Who recorded time on this
      project is billed to" — and carries New billing account top right; the content is the list alone,
      with no heading of its own. A project owns several billing accounts and exactly one of them is the
      project default: every ticket that links no account, and has no ancestor that links one, is booked
      to it.


      THE ACCOUNTS ARE A `list` OF PATTERNED ROWS, NOT A TABLE: `headline: [name]`, `meta: [type, tickets]`,
      `right: [default, make_default, edit, archive]`. An account is read one at a time, not compared down
      a column.


      THE DEFAULT AND TICKET LINKS EXCLUDE EACH OTHER. The default row carries the Default badge and no
      Archive — make another account the default first, so a project always has one. An account with linked
      tickets offers no Make default. Only an unlinked, non-default account offers both.


      TICKETS ARE LINKED ON THE TICKET, NEVER HERE (the inspector''s Billing row). This face only names
      them in the meta line.


      ARCHIVED ACCOUNTS STAY READABLE, collapsed below, because existing bookings keep their reference.
      Make default, Edit and Archive are drawn as `action` cells; on the server they arrive as named submit
      triggers of the face''s form.'
    items:
      - scene: design-system:shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: Billing
                      description: Who recorded time on this project is billed to
                    slots:
                      tabs:
                        component: bb_theme:tabs
                        props:
                          label: Project sections
                          items:
                            - label: Overview
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-overview
                              active: false
                            - label: Board
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-board
                              active: false
                            - label: Tickets
                              url: /?path=/story/designbook-sections-tickets-scenes--ticket-list
                              active: false
                            - label: Time
                              url: /?path=/story/designbook-sections-projects-scenes--project-time
                              active: false
                            - label: Stats
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-stats
                              active: false
                            - label: Runs
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-runs
                              active: false
                            - label: Members
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-members
                              active: false
                            - label: Billing
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-billing
                              active: true
                            - label: Settings
                              url: /?path=/story/designbook-sections-projects-scenes--project-detail-settings
                              active: false
                      actions:
                        component: bb_theme:button
                        props:
                          variant: primary
                          label: New billing account
                          icon_only: true
                        slots:
                          icon:
                            component: bb_theme:icon
                            props:
                              name: plus
                              size: sm
                main:
                  - component: bb_theme:zone
                    props:
                      gap: lg
                    slots:
                      content:
                        - component: bb_theme:list
                          props:
                            layout: cards
                            spacing: comfortable
                            pattern:
                              headline:
                                - name
                              meta:
                                - type
                                - tickets
                              right:
                                - default
                                - make_default
                                - edit
                                - archive
                            items:
                              - cells:
                                  name:
                                    kind: text
                                    value: bakers.build Platform internal
                                    emphasis: strong
                                  type:
                                    kind: text
                                    value: Internal
                                    emphasis: faint
                                  tickets:
                                    kind: text
                                    value: Booked for every ticket without its own account
                                    emphasis: faint
                                  default:
                                    kind: badge
                                    label: Default
                                    tone: running
                                    dot: true
                                  edit:
                                    kind: action
                                    label: Edit
                                    variant: ghost
                              - cells:
                                  name:
                                    kind: text
                                    value: Kunde X maintenance
                                    emphasis: strong
                                  type:
                                    kind: text
                                    value: Time & Material
                                    emphasis: faint
                                  tickets:
                                    kind: text
                                    value: Linked to BB-12, BB-40
                                    emphasis: faint
                                  edit:
                                    kind: action
                                    label: Edit
                                    variant: ghost
                                  archive:
                                    kind: action
                                    label: Archive
                                    variant: ghost
                              - cells:
                                  name:
                                    kind: text
                                    value: Relaunch fixed price
                                    emphasis: strong
                                  type:
                                    kind: text
                                    value: Fixed Price
                                    emphasis: faint
                                  tickets:
                                    kind: text
                                    value: No linked tickets
                                    emphasis: faint
                                  make_default:
                                    kind: action
                                    label: Make default
                                    variant: ghost
                                  edit:
                                    kind: action
                                    label: Edit
                                    variant: ghost
                                  archive:
                                    kind: action
                                    label: Archive
                                    variant: ghost
                        - component: bb_theme:collapsible
                          props:
                            open: false
                          slots:
                            label: Archived accounts (1)
                            content:
                              - component: bb_theme:list
                                props:
                                  layout: cards
                                  spacing: comfortable
                                  pattern:
                                    headline:
                                      - name
                                    meta:
                                      - type
                                    right:
                                      - state
                                  items:
                                    - cells:
                                        name:
                                          kind: text
                                          value: Pilot phase
                                        type:
                                          kind: text
                                          value: Fixed Price
                                          emphasis: faint
                                        state:
                                          kind: badge
                                          label: Archived
                                          tone: offline
