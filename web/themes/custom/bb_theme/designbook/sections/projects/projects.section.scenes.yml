  - name: project-create
    group: Actions
    section: projects
    docs: >-
      THE CREATE DIALOG OF THE PROJECTS SCREEN, centered in the shell's `overlay`
      slot over the list it was opened from. It is the same hull BB-332 agreed
      and BB-335 built for `ticket-create`, obeying the same rule:
      `action-pattern.md` › *Create and edit surfaces* — a create surface is a
      centered `dialog` in the shell's `overlay` slot, not an off-canvas tray and
      not a standalone route.

      IT WAS A FULL-PAGE ROUTE UNTIL THE CODING GATE, and the reversal is what
      this scene is now for. The design gate argued that the rule's own reason
      for rejecting a route — a route loses the LIST CONTEXT and cannot serve the
      edit and cancel cases, which must overlay a detail screen — did not reach a
      project form, because a project has no detail screen and no edit case at
      all. The human read the first half of that reason back: a project form has
      no detail screen, true, but it does have a LIST, and this dialog overlays
      exactly the list context the reason is about. So the rule applies here as
      written, `action-pattern.md` records NO exception any more, and the design
      system carries one pattern instead of a pattern plus a footnote. A pattern
      with a footnote invites the next surface to claim one.

      THE SCREEN BEHIND THE DIALOG IS THE `projects` SCENE ITSELF, aliased
      (`*projects_screen`) rather than retyped. That is not a saving: it is what
      makes "the create surface preserves the list context" a property of the
      file. A retyped list would drift from the screen it claims to be the
      context of, and the drift would be invisible — two screens that look alike
      is exactly the failure this design keeps catching elsewhere.

      WHAT DID NOT CHANGE IS THE FORM. The widget grammar is the one every create
      surface uses, and moving the hull changed none of it: no visible labels,
      three borderless text lines, a `property_row` of `option_picker` pills, a
      pill showing the field name when nothing is set and the name beside the
      value when something is, and one primary submit beside one cancel. The
      panel's clear row is first and its create row last WHEREVER EITHER IS
      OFFERED — on this surface neither is, and the paragraph on selection-only
      pickers below says why. What the route needed and the dialog does not is
      its hand-built action bar: the `dialog` component owns an `actions` slot
      that already right-aligns, so the titleless `page_header` the route used as
      an action bar is gone.

      WHERE THE ACTION ROW RENDERS, WHICH IS NOW WHERE THIS SCENE PUTS IT. This
      paragraph used to record the delivery's one named divergence: the scene
      composed Cancel and `Create project` into the `dialog`'s own `actions`
      slot and the BUILT dialog rendered them INSIDE THE BODY instead, beneath
      the surface, because the generic hull filled `message` and `body` and
      nothing else and there was no footer for the row to reach. THE DIVERGENCE
      IS CLOSED and the scene is what the build matches. What closed it is the
      choice named two paragraphs down: the generic hull grew an `actions` slot,
      and a wrapped form lifts its row into it. The lift is the mechanism worth
      knowing, because it is not free — the hull is the form's ANCESTOR, so the
      row renders OUTSIDE the `<form>`, and the submit only submits because it
      is stamped with a `form` attribute naming its own form's id.

      THE HULL CARRIES NO ID OF THIS SURFACE'S, WHICH IS WHY THIS SCENE STATES
      NONE. The generic wrapper passes `open`, `title` and `dismissible` and no
      `id`, so the component falls back to its own default — and with ONE hull
      serving every create dialog in the product, a per-surface id is not
      something the build can give. The scene therefore renders the same default
      the page does. What names THIS surface, for a test or for an
      `aria-controls`, is the FORM's own id, which is stable and unique per
      subject: the browser suite binds `dialog[data-dialog]:has(form#…-form)` on
      both create dialogs for exactly that reason.

      TWO WAYS TO CLOSE IT WERE WEIGHED, AND (2) WAS TAKEN — on the operator
      ruling of 2026-09-08 that the two create dialogs must behave the same.
      (1) A HULL TEMPLATE OF THIS FORM'S OWN, composing `bb_theme:dialog` and
      setting `#island_own_hull => FALSE` so the generic wrapper stands aside —
      which is what the ticket dialog used to do, and which buys a footer at the
      cost of a second hull to keep in step with the first. (2) AN `actions`
      SLOT ON THE GENERIC `island` HULL, so any wrapped route can hand it a row
      and the body template's boolean becomes unnecessary — one hull for
      everything, at the cost of teaching a generic wrapper about a shape only
      forms have. This scene predicted the trigger correctly and it is worth
      recording that it did: "two hand-composed hulls is the point at which (1)
      stops being the cheap answer." That point arrived, the ticket dialog gave
      up its own hull rather than this one gaining a second, and the body
      template's boolean is gone. THE COMING TEAM-ADD AND GROUP-ADD DIALOGS
      INHERIT THE ANSWER instead of meeting the choice.

      THE GROUP PILL LEADS AND IS PROMINENT, above the title line, the same
      position `workflow` holds on the ticket create dialog and for the same
      reason: it decides the cost centre this project is re-invoiced through and
      cannot be changed cheaply afterwards.

      EVERY PICKER ON THIS SURFACE SELECTS ONLY, and that is BB-421's
      operator decision reversing an earlier one taken in the same session
      (spec D7). `group_id` and `teams` carried `creatable`, and neither does
      now: no picker here offers a create row. `teams` also carried a CLEAR
      row, and a field the operator cannot clear is how this design system says
      "this always holds a value" — `bb_project.teams` and `.group_id` are
      both entity-required, so the clear row was offering a state the server
      refuses. Both pickers therefore render selection and nothing else.

      WHICH LEAVES A NAMED PRODUCT GAP, and it is recorded here rather than
      quietly dropped. This scene used to argue that the group panel's create
      row "is where a group is created now that it has no page". With the row
      gone that is FALSE for this dialog. Groups is now its own listing screen
      with a New group affordance; this picker still offers selection only.
      `action-pattern.md` › *Creating the thing you are looking for* still
      specifies the create row as a pattern, and the pattern is still right —
      it is simply unwired here, and wiring it belongs to whichever ticket
      gives these pickers a write endpoint.

      THREE TEXT LINES, and the second and third are the REPOSITORY's URL and
      DEFAULT BRANCH — the fields being `repository` and `default_branch`, which
      is what this scene names them so that a reader can find the thing the form
      actually submits. A project has no description field, so the grammar's
      second and third lines carry the thing a new project actually needs typed:
      the repository URL and the branch runs base work on and merge requests
      target. `default_branch` is optional and falls back to `main` server-side
      (spec D5, amended `9d718d2a`) — a repository is rarely useful without
      naming it, so the field is shown rather than deferred to Settings.
      `branch_convention` and `env_vars` stay off this surface: they are
      configuration a project acquires after it exists. `key` and `next_number`
      are deliberately not on this surface — `key` is derived from the name by
      whoever wires this up, and `next_number` is machine-owned. Stated here
      rather than left as a gap for a reader to find.

      AND NO IMPORT PILL. `import_connector` sat in the pill row until BB-421
      dropped it (spec D4). BB-554 retires the import surface entirely — the
      two fields it read are gone from `bb_project` — so the pill does not
      return.

      NO CONTEXT CONTROL IN THE DIALOG HEAD, AND NO UNRESOLVED-CONTEXT STATE.
      Rule 8's breadcrumb exists because a ticket needs a project and the
      operator may have opened the create dialog from somewhere that resolves
      none — BB-335 spends a whole scene on that case. This dialog opens from
      the projects screen of ONE workspace, and the workspace switches globally
      in the shell rather than per surface, so the context is resolved by
      construction: there is nothing for a breadcrumb to change, the submit has
      no reason to be disabled, and a `project-create (unresolved context)` scene
      would render a state that cannot occur. The `context` slot is therefore
      left empty rather than filled with a control that would decide nothing.

      NO CONFIRMATION. Creating a project is reversible and has no server-side
      side effect of the kind the conductor field has, so by the rule it is
      single-step and nothing is named. And nothing posts HERE: the submit is a
      control in this scene, not a write, and opening and closing the dialog is
      Drupal behaviour, which Storybook never runs. The close button DOES have a
      handler in the running app — it and Escape are wired by `island`'s own
      `island.dialog.js`, which this component reaches by declaring
      `island/dialog` as a library dependency. This paragraph used to say the
      button "carries no handler"; that was false from the commit that added
      one, and the true statement is the narrower one: Storybook runs no Drupal
      behaviour, so nothing closes in a story.
    items:
      - scene: "design-system:shell"
        with:
          content: *projects_screen
          # THE CREATE SURFACE IS THE SHELL'S OVERLAY, over the list it was opened
          # from (`action-pattern.md` › *Create and edit surfaces*). The screen
          # behind it is the `projects` scene itself, aliased rather than retyped,
          # which is what makes "the create surface preserves the list context" a
          # property of this file.
          overlay:
            - component: bb_theme:dialog
              props:
                open: true
                title: New project
                label: New project
                # NO `id`, deliberately — see the docs above. `island`'s generic
                # wrapper passes none, so the built hull falls back to the
                # component's own default, and one hull now serves every create
                # dialog. Stating one here would render a surface the build
                # cannot produce.
                dismissible: true
              slots:
                body:
                    # THE WHOLE ADD SURFACE IS ONE `form` NODE. It used to be four kinds of node
                    # assembled here by hand — the separated lead row, two borderless lines, the
                    # wrapping row of peer pills — and the widget grammar that says how they go
                    # together lived in prose beside them. It is carried by the NAMED REGIONS now:
                    # there is no slot that would take a second pill in the lead row, stack the
                    # pills into a column, or turn a line into a labelled row.
                    # The regions are SLOTS rather than props since BB-420 Task 20, because the
                    # same surface is built by real Drupal field widgets on the server and a widget
                    # renders itself. `lead`'s at-most-one is the one thing a slot cannot carry, so
                    # it is enforced at the form display instead — see form.component.yml.
                    # The action row is NOT in this node: it is in the hull's own `actions` slot
                    # below, and the build puts it there too. This comment used to say the opposite
                    # — "the BUILD renders it in the body" — which was the pre-ruling state and was
                    # already contradicted by this file's own prose at the top of the scene when it
                    # was left behind. See there for what closed the divergence: the generic hull
                    # grew the slot and a wrapped form lifts its row into it, which is why the
                    # submit carries a `form` attribute naming its own form.
                  - component: bb_theme:form
                    props:
                      lead_label: Group
                    slots:
                      lead:
                      - component: bb_theme:property_pill
                        props:
                          prominent: true
                          name: group
                          label: Group
                          icon: project
                          picker_id: create-project-group
                          aria_label: Change group. Currently keytec.
                          value_label: keytec
                          values:
                          - '1'
                          open: false
                          searchable: true
                          search_placeholder: Search groups
                          search_label: Search groups
                          options:
                          - value: '1'
                            label: keytec
                            description: KT-1000
                            selected: true
                      lines:
                      - component: bb_theme:form_input
                        props:
                          type: text
                          name: name
                          id: create-project-name
                          required: true
                          placeholder: What is this project called
                          value: bakers.build Designbook
                      - component: bb_theme:form_textarea
                        props:
                          name: repository
                          id: create-project-repository
                          rows: 2
                          placeholder: The repository this project's tickets branch from
                          value: https://gitlab.example.com/bakers/designbook
                      - component: bb_theme:form_input
                        props:
                          type: text
                          name: default_branch
                          id: create-project-default-branch
                          placeholder: Default branch (falls back to main)
                          value: main
                      pills:
                      - component: bb_theme:property_pill
                        props:
                          name: teams
                          label: Teams
                          icon: team
                          picker_id: create-project-teams
                          aria_label: Change teams. Currently Platform crew is set.
                          value_labels:
                          - Platform crew
                          values:
                          - '1'
                          open: false
                          multiple: true
                          options:
                          - value: '1'
                            label: Platform crew
                            selected: true
                          - value: '3'
                            label: Design crew
                            selected: false
                      - component: bb_theme:property_pill
                        props:
                          name: owner
                          label: Owner
                          icon: project
                          picker_id: create-project-owner
                          aria_label: Change owner. Currently Christian Wiedemann.
                          value_label: Christian Wiedemann
                          values:
                          - '1'
                          open: false
                          searchable: true
                          search_placeholder: Search people
                          search_label: Search people
                          options:
                          - value: '1'
                            label: Christian Wiedemann
                            selected: true
                          - value: '5'
                            label: Lena Fischer
                            selected: false
                actions:
                  - component: bb_theme:button
                    props:
                      variant: ghost
                      label: Cancel
                  - component: bb_theme:button
                    props:
                      variant: primary
                      label: Create project
                      type: submit

