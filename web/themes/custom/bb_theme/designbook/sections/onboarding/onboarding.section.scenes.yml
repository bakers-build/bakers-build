  - name: setup-project
    group: Onboarding
    section: onboarding
    docs: >-
      Step 4 of 4: prepare your first project. Copy the init-project
      prompt and follow Initialize a project. Finish goes to Home; Finish &
      create a new workspace goes to the create form. Set up later also goes to
      Home.
    items:
      - scene: design-system:onboarding
        with:
          title: Prepare your first project
          description: >-
            Open a checkout and let init-project connect it as a bakers.build
            project. This page never runs the skill for you.
          content:
            - component: bb_theme:form
              slots:
                lead: Step 4 of 4
                lines:
                  - component: bb_theme:note
                    props:
                      tone: attention
                    slots:
                      body: >-
                        Open a repository checkout in your agent, then paste the
                        prompt. The skill finds or creates the bakers.build project and
                        writes the checkout configuration. You can finish here
                        and do this later from any checkout.
                  - component: bb_theme:text
                    props:
                      text: 'Paste this into your agent:'
                      size: caption
                      tone: light
                  - component: bb_theme:setup_command
                    props:
                      command: >-
                        Use `bakers:init-project` to connect this checkout as a
                        bakers.build project.
                      label: Copy the init-project prompt
                  - component: bb_theme:link-group
                    props:
                      label: Guides
                      links:
                        - url: >-
