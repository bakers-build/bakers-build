id: onboarding
group: Designbook/Sections/Onboarding
title: Onboarding
description: >-
  The three-step wizard: identity, About you, then documentation links per
  audience. Chrome is `design-system:onboarding`. Finishing lands on the
  workspace overview.
status: planned
order: 15
scenes:
  - name: identity
    group: Onboarding
    section: onboarding
    docs: >-
      Step 1 of 3: full name, nickname and picture, in the order the account
      edit form uses too. Mark, heading and description sit above the form card
      in one centred column. Nickname is required to continue; Skip advances
      without writing. The picture uses the account form's image widget: a round
      placeholder with the user icon and Choose picture when empty; choosing a
      file opens the square crop dialog at once (pan, zoom, Apply), then the
      avatar shows the applied square beside Edit crop and Choose another. The
      file and its crop travel with Next as part of the step's own HTMX POST;
      Remove appears only when the account already has a picture. There is no
      alternative-text field: avatars render decoratively beside the name.
    items:
      - scene: design-system:onboarding
        with:
          title: What should we call you?
          description: >-
            A name and a picture — and bakers.build feels less like software and
            more like your team.
          content:
            - component: bb_theme:form
              slots:
                lead: Step 1 of 3
                lines:
                  - component: bb_theme:form_label
                    props:
                      for: edit-field-full-name
                    slots:
                      title: Full name
                  - component: bb_theme:form_input
                    props:
                      name: field_full_name
                      id: edit-field-full-name
                      value: Ada Lovelace
                  - component: bb_theme:form_label
                    props:
                      for: edit-name
                    slots:
                      title: Nickname (username)
                  - component: bb_theme:form_input
                    props:
                      name: name
                      id: edit-name
                      value: ada
                      required: true
                  - component: bb_theme:form_label
                    props:
                      for: edit-user-picture
                    slots:
                      title: Profile picture
                  - component: bb_theme:image_crop
                    props:
                      label: Profile picture
                      id: edit-user-picture-crop
                      input_id: edit-user-picture
                      hint: PNG, GIF, JPG, JPEG, WEBP
                      src: https://placehold.co/900x300/dc2626/2563eb.png?text=Ada
                      width: 900
                      height: 300
                      crop: '{"x":0,"y":0,"size":300}'
                    slots:
                      upload:
                        - component: bb_theme:form_input
                          props:
                            type: file
                            name: files[user_picture_0]
                            id: edit-user-picture
                actions:
                  - component: bb_theme:button
                    props:
                      variant: ghost
                      label: Skip
                  - component: bb_theme:button
                    props:
                      variant: primary
                      label: Next
  - name: about-you
    group: Onboarding
    section: onboarding
    docs: >-
      Step 2 of 3: position and background, with the AI-use notice. The brand
      sits centred above the form card. Both fields are optional. Back returns
      to identity without writing. Next saves About you and opens setup; it does
      not complete onboarding.
    items:
      - scene: design-system:onboarding
        with:
          title: Tell us about yourself
          description: >-
            So we speak your language — matched to your work and your
            background.
          content:
            - component: bb_theme:form
              slots:
                lead: Step 2 of 3
                lines:
                  - component: bb_theme:note
                    props:
                      tone: attention
                    slots:
                      body: >-
                        bakers.build passes these details as context to the AI
                        assistants it uses, so that explanations and support
                        match your background and your goals. You can change or
                        delete them later.
                  - component: bb_theme:form_label
                    props:
                      for: edit-field-developer-title
                    slots:
                      title: Position
                  - component: bb_theme:form_input
                    props:
                      name: field_developer_title
                      id: edit-field-developer-title
                      placeholder: e.g. Product Lead
                  - component: bb_theme:form_label
                    props:
                      for: edit-field-bakers-background
                    slots:
                      title: What should bakers.build know about your background?
                  - component: bb_theme:form_textarea
                    props:
                      name: field_bb_background
                      id: edit-field-bakers-background
                      rows: 3
                      placeholder: Drupal, Linear, or something else entirely.
                actions:
                  - component: bb_theme:button
                    props:
                      variant: ghost
                      label: Back
                  - component: bb_theme:button
                    props:
                      variant: primary
                      label: Next
  - name: setup-install
    group: Onboarding
    section: onboarding
    docs: >-
      Step 3 of 3, the last step: documentation links only, grouped by
      audience. Ticket only links the connector guide; Developer links the
      machine and project guides. Each link opens in a new tab. Finish goes to
      Home, Finish & create a new workspace to workspace create, and Set up
      later to Home; each completes onboarding.
    items:
      - scene: design-system:onboarding
        with:
          title: Get started with bakers.build
          description: Pick how you will work. Each guide opens in a new tab.
          content:
            - component: bb_theme:form
              slots:
                lead: Step 3 of 3
                lines: &setup_audiences
                  - component: bb_theme:text
                    props:
                      text: Work through chat, without a local machine.
                      size: meta
                      tone: light
                  - component: bb_theme:link-group
                    props:
                      label: Ticket only
                      links:
                        - url: https://bakers.build/docs/get-started/connector
                          title: Set up a connector
                          kind: doc
                  - component: bb_theme:text
                    props:
                      text: Run the agent on your own machine.
                      size: meta
                      tone: light
                  - component: bb_theme:link-group
                    props:
                      label: Developer
                      links:
                        - url: https://bakers.build/docs/get-started/machine
                          title: Set up a machine
                          kind: doc
                        - url: https://bakers.build/docs/get-started/connect-a-project
                          title: Set up a project
                          kind: doc
                actions:
                  - component: bb_theme:button
                    props:
                      variant: ghost
                      label: Back
                  - component: bb_theme:button
                    props:
                      variant: ghost
                      label: Set up later
                  - component: bb_theme:button
                    props:
                      variant: primary
                      label: Finish
                  - component: bb_theme:button
                    props:
                      variant: primary
                      label: Finish & create a new workspace
  - name: setup-install-invited
    group: Onboarding
    section: onboarding
    docs: >-
      Step 3 of 3 for an invited account: the same audiences as setup-install,
      with only Finish (to Home) and Set up later. Finish & create a new
      workspace is absent because a pending invitation offer exists.
    items:
      - scene: design-system:onboarding
        with:
          title: Get started with bakers.build
          description: Pick how you will work. Each guide opens in a new tab.
          content:
            - component: bb_theme:form
              slots:
                lead: Step 3 of 3
                lines: *setup_audiences
                actions:
                  - component: bb_theme:button
                    props:
                      variant: ghost
                      label: Back
                  - component: bb_theme:button
                    props:
                      variant: ghost
                      label: Set up later
                  - component: bb_theme:button
                    props:
                      variant: primary
                      label: Finish
  - name: setup-reopen
    group: Onboarding
    section: onboarding
    docs: >-
      A completed account reopening Setup guide from Home. Progress is Setup.
      There is no Back. Completion stays true. Audiences match setup-install.
    items:
      - scene: design-system:onboarding
        with:
          title: Get started with bakers.build
          description: Pick how you will work. Each guide opens in a new tab.
          content:
            - component: bb_theme:form
              slots:
                lead: Setup
                lines: *setup_audiences
                actions:
                  - component: bb_theme:button
                    props:
                      variant: ghost
                      label: Set up later
                  - component: bb_theme:button
                    props:
                      variant: primary
                      label: Finish
                  - component: bb_theme:button
                    props:
                      variant: primary
                      label: Finish & create a new workspace
