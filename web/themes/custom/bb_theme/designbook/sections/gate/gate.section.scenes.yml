                      label: Join
  - name: check mail
    group: Gate
    section: gate
    docs: >-
      The page the login form sends a visitor to (`/user/check-mail`,
      BbCodeForm). Its heading and its fixed confirmation sentence are
      `bb_theme:text` runs: the heading an h1 at the h3 step, centred, and the
      sentence a light body paragraph. The sentence is identical for every
      address, so the page cannot tell a known address from an unknown one.
      Below it the code field and the Sign in submit. The workspace join page
      uses the same two text runs for its invitation sentence and its Go to home
      link.
    items:
      - scene: design-system:gate
        with:
          aside: ''
          content:
            - component: bb_theme:gate_form
              slots:
                content:
                  - component: bb_theme:text
                    props:
                      text: Check your mail
                      as: h1
                      size: section-title
                      align: center
                  - component: bb_theme:text
                    props:
                      text: >-
                        We sent you a login link. Open it on this device to sign
                        in. The link works only once.
                      tone: light
                  - component: bb_theme:zone
                    props:
                      inset: none
                      gap: none
                    slots:
                      content:
                        - component: bb_theme:form_label
                          props:
                            for: edit-code
                          slots:
                            title: Code from the e-mail
                        - component: bb_theme:form_input
                          props:
                            name: code
                            id: edit-code
                            value: ''
                            required: true
                  - component: bb_theme:button
                    props:
                      variant: primary
                      type: submit
                      label: Sign in
  - name: device sign-in done
    group: Gate
    section: gate
    docs: >-
      The result a signed-in human sees after confirming a terminal sign-in
      (`/oauth/device?done=confirmed`, DeviceVerificationForm). A `zone` with
      `align: center` holds an h2 at the h3 step, a faint sentence and the one
      way on. The prefilled device code on the confirm step is a `text` span at
      the h3 step with `tracking: widest`, because a reader compares it
      character by character with the terminal.


      THE MESSAGE OUTRANKS THE MARK. The title reads at the 24px `display` role
      and the body at the 16px `gate-body` role in the default text colour,
      under the gate's compact brand: the reader came here to learn whether the
      sign-in worked, and the page answers that first.
    items:
      - scene: design-system:gate
        with:
          aside: ''
          content:
            - component: bb_theme:zone
              props:
                inset: none
                gap: sm
                align: center
              slots:
                content:
                  - component: bb_theme:text
                    props:
                      text: Welcome, Ada
                      as: h2
                      size: page-title
                  - component: bb_theme:text
                    props:
                      text: You are signed in. You can return to your terminal.
                      size: prose
                      tone: default
                  - component: bb_theme:button
                    props:
                      label: Go to bakers.build
                      href: /home
  - name: device sign-in denied
    group: Gate
    section: gate
    docs: >-
      The denial result of `DeviceVerificationForm::buildDoneResult()`: the same
      hierarchy as the confirmation, and no action, because there is nowhere
      this reader asked to go.
    items:
      - scene: design-system:gate
        with:
          aside: ''
          content:
            - component: bb_theme:zone
              props:
                inset: none
                gap: sm
                align: center
              slots:
                content:
                  - component: bb_theme:text
                    props:
                      text: Sign-in denied
                      as: h2
                      size: page-title
                  - component: bb_theme:text
                    props:
                      text: You can return to your terminal.
                      size: prose
                      tone: default
  - name: device sign-in done long name
    group: Gate
    section: gate
    docs: >-
      The confirmation with a long display name, one word of which is a single
      unbroken token, previewed so the title is seen wrapping at word boundaries
      and staying inside the card at 360px.
    items:
      - scene: design-system:gate
        with:
          aside: ''
          content:
            - component: bb_theme:zone
              props:
                inset: none
                gap: sm
                align: center
              slots:
                content:
                  - component: bb_theme:text
                    props:
                      text: >-
                        Welcome, Maximiliane Theodora
                        Wolfeschlegelsteinhausenbergerdorff-Ottenheimer
                      as: h2
                      size: page-title
                  - component: bb_theme:text
                    props:
                      text: You are signed in. You can return to your terminal.
                      size: prose
                      tone: default
                  - component: bb_theme:button
                    props:
                      label: Go to bakers.build
                      href: /home
  - name: device code entry
    group: Gate
    section: gate
    docs: >-
      The blank code-entry step of `/oauth/device`: the reader types the code
      the terminal printed, then confirms or denies.
    items:
      - scene: design-system:gate
        with:
          aside: ''
          content:
            - component: bb_theme:gate_form
              slots:
                content:
                  - component: bb_theme:zone
                    props:
                      inset: none
                      gap: none
                    slots:
                      content:
                        - component: bb_theme:form_label
                          props:
                            for: edit-user-code
                          slots:
                            title: Device code
                        - component: bb_theme:form_input
                          props:
                            name: user_code
                            id: edit-user-code
                            value: ''
                            required: true
                        - component: bb_theme:text
                          props:
                            text: Enter the code shown in your terminal.
                            size: meta
                            tone: light
                  - component: bb_theme:zone
                    props:
                      inset: none
                      gap: sm
                      direction: row
                      align: center
                    slots:
                      content:
                        - component: bb_theme:button
                          props:
                            variant: primary
                            type: submit
                            label: Confirm sign-in
                        - component: bb_theme:button
                          props:
                            type: submit
                            label: Deny
              props:
                align: center
  - name: device consent
    group: Gate
    section: gate
    docs: >-
      The prefilled consent step: the code arrives from the terminal's
      verification link and is shown as text rather than an input, with the
      requesting client and the scopes the token will carry.
    items:
      - scene: design-system:gate
        with:
          aside: ''
          content:
            - component: bb_theme:gate_form
              slots:
                content:
                  - component: bb_theme:zone
                    props:
                      inset: none
                      gap: none
                    slots:
                      content:
                        - component: bb_theme:form_label
                          slots:
                            title: Device code
                        - component: bb_theme:text
                          props:
                            text: ABCD-EFGH
                            as: span
                            size: section-title
                            tracking: widest
                  - component: bb_theme:text
                    props:
                      text: bakers.build CLI wants to sign in
                  - component: bb_theme:text
                    props:
                      text: 'Requested access: bb:session'
                      tone: faint
                  - component: bb_theme:zone
                    props:
                      inset: none
                      gap: sm
                      direction: row
                      align: center
                    slots:
                      content:
                        - component: bb_theme:button
                          props:
                            variant: primary
                            type: submit
                            label: Confirm sign-in
                        - component: bb_theme:button
                          props:
                            type: submit
                            label: Deny
              props:
                align: center
  - name: page not found
    group: Gate
    section: gate
    items:
      - scene: design-system:gate
        with:
          aside: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:text
                    props:
                      text: 404 — Page not found
                      as: h1
                      size: page-title
                      align: center
                main:
                  - component: bb_theme:empty-state
                    props:
                      icon: signpost-missing
                      message: >-
                        We couldn't find this page. It may have moved or the
                        address may be incorrect.
                  - component: bb_theme:button
                    props:
                      label: Go to home
                      href: /home
  - name: access denied
    group: Gate
    section: gate
    items:
      - scene: design-system:gate
        with:
