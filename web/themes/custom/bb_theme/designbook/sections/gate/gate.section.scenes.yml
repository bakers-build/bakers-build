  - name: login
    group: Gate
    section: gate
    docs: >-
      `/user/login` in the counter line-up look: the `gate` chrome with its
      `aside` filled by `station-lineup` (the slogan as the page's only h1, a
      dashed crust hairline and three stations, "you" filled lime) beside the
      e-mail login card. Two columns from `lg`, brand column first when stacked.
      The other gate screens leave `aside` empty.
    items:
      - scene: design-system:gate
        with:
          aside:
            - component: bb_theme:station-lineup
              props:
                headline: You're the baker. Agents run the line.
                stations:
                  - role: your client
                    action: approves the plan
                    current: false
                  - role: agents
                    action: write the code
                    current: false
                  - role: you
                    action: decide what ships
                    current: true
          content:
            - component: bb_theme:gate_form
              slots:
                content:
                  - component: bb_theme:zone
                    props:
                      inset: none
                      gap: none
                    slots:
                      content:
                        - component: bb_theme:form_label
                          props:
                            for: edit-mail
                          slots:
                            title: E-mail address
                        - component: bb_theme:form_input
                          props:
                            name: mail
                            id: edit-mail
                            value: ''
                            required: true
                        - component: bb_theme:text
                          props:
