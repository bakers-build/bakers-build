  - name: personal-time-week
    group: User
    section: user
    docs: >-
      THE EDITABLE WEEK (BB-642, decision D3): the employee's own week is the
      timesheet — days as columns, one row per project/ticket, one h:mm input
      per day. A cell with one entry carries a Details link to the shared Record
      time form; a cell with several entries is locked and links to that day
      (D10). An AI proposal shows its cells marked Proposed, its own
      not-yet-recorded line and the proposal bar with Discard; Save week books
      everything all or nothing (D6). Team and project calendars keep the
      read-only grid.
