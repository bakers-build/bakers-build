  - name: api-keys-create
    group: User
    section: user
    docs: >-
      BB-668 design preview, no backend. `/user/{user}/api-keys/add`: Name
      and a required Expiry date. Default +90 days, allowed tomorrow through
      +365 days, UTC end of day. Reuses `form`/`form_input`/`form_label`/`note`
      exactly as `account-edit` does; no new component was needed.
    items:
      - scene: design-system:account-shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: Create API key
                      description: Dates are UTC.
                main:
                  - component: bb_theme:form
                    slots:
                      lines:
                        - component: bb_theme:form_label
                          props:
                            for: edit-api-key-name
                          slots:
                            title: Name
                        - component: bb_theme:form_input
                          props:
                            name: label
                            id: edit-api-key-name
                            placeholder: Pipeline deploy
                            required: true
                        - component: bb_theme:form_label
                          props:
                            for: edit-api-key-expires
                          slots:
                            title: Expiry date
                        - component: bb_theme:form_input
                          props:
                            type: date
                            name: expires
                            id: edit-api-key-expires
                            value: '2027-01-11'
                            required: true
                        - component: bb_theme:note
                          props:
                            tone: neutral
                          slots:
                            body: >-
                              UTC date. Default is 90 days from today; the
                              earliest is tomorrow, the latest is 365 days
                              from today.
                      actions:
                        - component: bb_theme:button
                          props:
                            variant: ghost
                            label: Cancel
                        - component: bb_theme:button
                          props:
                            variant: primary
                            label: Create API key
                            type: submit
  - name: api-keys-created
    group: User
    section: user
    docs: >-
      BB-668 design preview, no backend. The one-time reveal shown
      immediately after a successful create POST, never again after reload
      or on the list. Reuses `setup_command`'s copy-button pattern for the
      Client ID, Secret and the GitLab CI snippet; no new component was
      needed.
    items:
      - scene: design-system:account-shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: API key created
                      description: >-
                        Save the secret now. It is shown once and cannot be
                        shown again; losing it means revoking this key and
                        creating a new one.
                main:
                  - component: bb_theme:note
                    props:
                      lead: Shown once
                      tone: attention
                    slots:
                      body: >-
                        This is the only time the secret is displayed.
                        Reloading or revisiting this page will not show it
                        again.
                  - component: bb_theme:form_label
                    props:
                      for: created-client-id
                    slots:
                      title: Client ID
                  - component: bb_theme:setup_command
                    props:
                      command: bakers-key-7f3a9c2e
                      label: Copy client ID
                  - component: bb_theme:form_label
                    props:
                      for: created-secret
                    slots:
                      title: Secret
                  - component: bb_theme:setup_command
                    props:
                      command: >-
                        3f9a1c7e2b8d4650a9c3e7f1b2d8406c9e1a7f3c5b8d2460
                      label: Copy secret
                  - component: bb_theme:text
                    props:
                      text: >-
                        Store the secret in GitLab's masked CI/CD variable
                        BAKERS_CONSUMER_SECRET, then use the client ID in your
                        pipeline's before_script.
                  - component: bb_theme:form_label
                    props:
                      for: created-snippet
                    slots:
                      title: GitLab CI snippet
                  - component: bb_theme:setup_command
                    props:
                      command: >-
                        before_script: - bakers config init --scope connection
                        --auth-type client_credentials --client-id
                        bakers-key-7f3a9c2e --secret-env BAKERS_CONSUMER_SECRET
                      label: Copy GitLab CI snippet
