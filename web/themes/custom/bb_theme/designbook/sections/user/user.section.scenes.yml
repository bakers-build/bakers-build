  - name: record-time-create
    group: User
    section: user
    docs: >-
      RECORD TIME, CREATE: the one shared form, opened in the dialog over the
      calling calendar (full page without JavaScript). It asks in the reader's
      order: project, ticket, date, duration, description. The calling context
      prefilled date and project; a suggestion the employee may not use is
      dropped with a notice. The ticket pill searches the project's tickets on
      the server. Billing account is asked only when there is more than one; a
      single one is set silently.
    items:
      - scene: design-system:account-shell
        with:
          overlay:
            - component: bb_theme:dialog
              props:
                open: true
                title: Record time
                label: Record time
                dismissible: true
              slots:
                body:
                  - component: bb_theme:message
                    props:
                      status: warning
                    slots:
                      body: The suggested ticket is not available.
                  - component: bb_theme:property_pill
                    props:
                      name: project
                      label: Project
                      icon: project
                      picker_id: edit-project
                      values:
                        - '1'
                      open: false
                      multiple: false
                      searchable: true
                      fallback: true
                      options:
                        - value: '1'
                          label: keytec · Time capture
                          selected: true
                        - value: '2'
                          label: keytec · Website
                          selected: false
                      value_label: keytec · Time capture
                  - component: bb_theme:property_pill
                    props:
                      name: ticket
                      label: Ticket
                      icon: ticket
                      picker_id: edit-ticket
                      values: []
                      open: true
                      multiple: false
                      searchable: true
                      fallback: true
                      options:
                        - value: '12'
                          label: TIME-12 Review the week grid
                          selected: false
                        - value: '13'
                          label: TIME-13 Proposal handoff
                          selected: false
                      search_url: /time/options/ticket?project=1
                      search_placeholder: Search tickets
                      search_label: Search tickets
                      clearable: true
                      clear_label: No ticket
                  - component: bb_theme:form_label
                    props:
                      for: edit-work-date
                    slots:
                      title: Date
                  - component: bb_theme:form_input
                    props:
                      type: date
                      id: edit-work-date
                      name: work_date
                      value: '2026-08-04'
                  - component: bb_theme:form_label
                    props:
                      for: edit-duration
                    slots:
                      title: Duration (hours:minutes)
                  - component: bb_theme:form_input
                    props:
                      type: text
                      id: edit-duration
                      name: duration
                      value: ''
                  - component: bb_theme:text
                    props:
                      text: 'Hours and minutes as H:MM. Examples: 0:30, 1:15.'
