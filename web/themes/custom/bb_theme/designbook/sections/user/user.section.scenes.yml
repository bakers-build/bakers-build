                          icon_only: true
                          label: Record time
                          type: button
                        slots:
                          icon:
                            component: bb_theme:icon
                            props:
                              name: plus
                              size: sm
                main:
                  - component: bb_theme:filters
                    props:
                      label: Time filters
                      layout: bar
                    slots:
                      controls:
                        - component: bb_theme:segmented_control
                          props:
                            label: Period
                            items:
                              - label: Day
                                url: '?mode=day'
                                active: false
                              - label: Week
