id: user
group: Designbook/Sections/User
title: User
description: >
  **Product place: account.** `/user/{user}` is the read route
  (`user.user.full`); `/user/{user}/edit` is the account form
  (`user.user.default`); `/user/{user}/profile` is the Profile form
  (`user.user.profile`). Reached from the shell person mark, which swaps the
  rail to Account, Conductors and Machines. Onboarding uses its own form and
  chrome.
status: in-progress
order: 16
scenes:
  - name: account-overview
    group: User
    section: user
    docs: >-
      The account's read-only identity and View/Edit tabs. The left rail keeps
      Account, Conductors and Machines at the top, with Workspaces (/home)
      directly above Log out at the bottom. No body action duplicates. Drupal
      preserves a validated workspace origin through View/Edit, validation and
      Save.
    items:
      - scene: design-system:account-shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: Christian Wiedemann
                      description: Account
                    slots:
                      tabs:
                        component: bb_theme:tabs
                        props:
                          label: Account
                          items:
                            - label: View
                              url: >-
                                /?path=/story/designbook-sections-user-scenes--account-overview
                              active: true
                            - label: Edit
                              url: >-
                                /?path=/story/designbook-sections-user-scenes--account-edit
                              active: false
                            - label: Profile
                              url: >-
                                /?path=/story/designbook-sections-user-scenes--account-profile
                              active: false
                main:
                  - entity: user.user
                    view_mode: full
                    select: $[id='1']
  - name: account-edit
    group: User
    section: user
    docs: >-
      THE ACCOUNT FORM on `/user/{user}/edit`, inside the app shell, under
      core's View and Edit tasks and the Profile tab (`entity.user.edit_form`,
      form mode `default`), in the display's own order: full name, username
      and email, picture, on one Save. Position and background are on the
      Profile tab. Labels are the ones the live form renders. The picture is
      core's image widget;
      the completion flag is the only hidden field. Language and timezone are on
      the form too and left out of this preview; the social sign-in widget is
      hidden. The shared account rail anchors Workspaces (/home) directly above
      Log out at the bottom.
    items:
      - scene: design-system:account-shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: Christian Wiedemann
                      description: Account
                    slots:
                      tabs:
                        component: bb_theme:tabs
                        props:
                          label: Account
                          items:
                            - label: View
                              url: >-
                                /?path=/story/designbook-sections-user-scenes--account-overview
                              active: false
                            - label: Edit
                              url: >-
                                /?path=/story/designbook-sections-user-scenes--account-edit
                              active: true
                            - label: Profile
                              url: >-
                                /?path=/story/designbook-sections-user-scenes--account-profile
                              active: false
                main:
                  - component: bb_theme:zone
                    slots:
                      content:
                        - component: bb_theme:form
                          slots:
                            lines:
                              - component: bb_theme:form_label
                                props:
                                  for: edit-field-full-name
                                slots:
                                  title: Full name
                              - component: bb_theme:form_input
                                props:
                                  name: field_full_name
                                  id: edit-field-full-name
                                  value: Christian Wiedemann
                              - component: bb_theme:form_label
                                props:
                                  for: edit-name
                                slots:
                                  title: Username
                              - component: bb_theme:form_input
                                props:
                                  name: name
                                  id: edit-name
                                  value: cw
                                  required: true
                              - component: bb_theme:form_label
                                props:
                                  for: edit-mail
                                slots:
                                  title: Email address
                              - component: bb_theme:form_input
                                props:
                                  type: email
                                  name: mail
                                  id: edit-mail
                                  value: christian.wiedemann@keytec.example
                              - component: bb_theme:form_label
                                props:
                                  for: edit-user-picture
                                slots:
                                  title: Profile picture
                              - component: bb_theme:form_input
                                props:
                                  type: file
                                  name: files[user_picture_0]
                                  id: edit-user-picture
                            actions:
                              - component: bb_theme:button
                                props:
                                  variant: primary
                                  type: submit
                                  label: Save
  - name: account-profile
    group: User
    section: user
    docs: >-
      THE PROFILE FORM on `/user/{user}/profile` (`bb_core.user.profile`, form
      mode `profile`), the third tab after View and Edit, in the account area.
      The AI-use notice is the page header's description; the form holds only
      Position and background. A workspace lead reaches the same page for a
      service account from the Service Accounts row menu.
    items:
      - scene: design-system:account-shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: Christian Wiedemann
                      description: >-
                        bakers.build passes these details as context to the AI
                        assistants it uses, so that explanations and support
                        match your background and your goals. You can change or
                        delete them later.
                    slots:
                      tabs:
                        component: bb_theme:tabs
                        props:
                          label: Account
                          items:
                            - label: View
                              url: >-
                                /?path=/story/designbook-sections-user-scenes--account-overview
                              active: false
                            - label: Edit
                              url: >-
                                /?path=/story/designbook-sections-user-scenes--account-edit
                              active: false
                            - label: Profile
                              url: >-
                                /?path=/story/designbook-sections-user-scenes--account-profile
                              active: true
                main:
                  - component: bb_theme:zone
                    slots:
                      content:
                        - component: bb_theme:form
                          slots:
                            lines:
                              - component: bb_theme:form_label
                                props:
                                  for: edit-field-developer-title
                                slots:
                                  title: Position
                              - component: bb_theme:form_input
                                props:
                                  name: field_developer_title
                                  id: edit-field-developer-title
                                  placeholder: e.g. Product Lead
                                  value: Product Lead
                              - component: bb_theme:form_label
                                props:
                                  for: edit-field-bakers-background
                                slots:
                                  title: What should bakers.build know about your background?
                              - component: bb_theme:form_textarea
                                props:
                                  name: field_bb_background
                                  id: edit-field-bakers-background
                                  rows: 3
                                  value: Drupal, Linear, or something else entirely.
                            actions:
                              - component: bb_theme:button
                                props:
                                  variant: primary
                                  type: submit
                                  label: Save
  - name: personal-time
    group: User
    section: user
    docs: >-
      The time calendar (BB-640): a week strip with each day's total and the
      week total, then the day rows (Day) or a read-only week grid (Week).
      Totals come from the authorized dataset, not from one page. ACCOUNT >
      TIME: the owner's hours in every workspace, including an entry whose
      project was deleted (Unresolved project). Owner only.
    items:
      - scene: design-system:account-shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: My time
                      description: Your recorded hours in all workspaces
                    slots:
                      actions:
                        component: bb_theme:button
                        props:
                          variant: primary
                          icon_only: true
                          label: Record time
                          type: button
                        slots:
                          icon:
                            component: bb_theme:icon
                            props:
                              name: plus
                              size: sm
                filters:
                  - component: bb_theme:filters
                    props:
                      title: Filters
                      label: Time filters
                    slots:
                      controls:
                        - component: bb_theme:segmented_control
                          props:
                            label: Period
                            items:
                              - label: Day
                                url: '?mode=day'
                                active: true
                              - label: Week
                                url: '?mode=week'
                                active: false
                        - component: bb_theme:option_picker
                          props:
                            label: Project
