    docs: >-
      BB-668 design preview, no backend. `/user/{user}/api-keys`: the
      owner-only listing of self-service pipeline credentials (Name, Client
      ID, Created, Expires, Status, Revoke). Reuses `list` and `badge`
      exactly as `personal-time` reuses them for the week's entries; no new
      component was needed.
