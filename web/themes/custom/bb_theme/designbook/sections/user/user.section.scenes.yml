  - name: personal-time-week-errors
    group: User
    section: user
    docs: >-
      A REFUSED WEEK SAVE: nothing was written. Every typed value stays in its
      cell, each invalid cell names its own error under the input (tied with
      aria-describedby) and focus moves to the first one; the message bar says
      the week was not saved.
    items:
      - scene: design-system:account-shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: My time
                      description: Your recorded hours in all workspaces
                    slots:
                      actions:
                        component: bb_theme:button
                        props:
                          variant: primary
                          icon_only: true
                          label: Record time
                          type: button
                        slots:
                          icon:
                            component: bb_theme:icon
                            props:
                              name: plus
                              size: sm
                main:
                  - component: bb_theme:filters
                    props:
                      label: Time filters
                      layout: bar
                    slots:
                      controls:
                        - component: bb_theme:segmented_control
                          props:
                            label: Period
