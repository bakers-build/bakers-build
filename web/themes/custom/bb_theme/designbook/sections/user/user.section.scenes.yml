      - scene: design-system:account-shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: API keys
                      description: >-
                        Credentials your own GitLab pipelines use to act as
                        you. Dates are UTC.
                    slots:
                      actions:
                        component: bb_theme:button
