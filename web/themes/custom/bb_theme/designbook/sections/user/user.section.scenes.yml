                              props:
                                label: Active
                                tone: running
                            revoke:
                              kind: link
                              value: Revoke
                              url: >-
                                /?path=/story/designbook-sections-user-scenes--api-keys-list
                        - cells:
                            name:
                              kind: text
                              value: Nightly report
                            client_id:
                              kind: text
                              value: bakers-key-1b8e4f10
                            created:
                              kind: text
