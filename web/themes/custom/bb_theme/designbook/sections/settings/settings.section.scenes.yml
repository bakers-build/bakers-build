  - name: team
    group: Screens
    section: settings
    docs: >-
      ONE TEAM, reached by clicking it in the rail. This is what that row's url
      promises, and it is the other half of BB-341's pending question: there
      is NO teams list here, because the rail is already one. `team-row` was
      therefore never created — without a table it would have no consumer, and a
      component with no consumer is a contract nobody checks.

      > **Scope change 2026-09-13 (BB-454), recorded under
      `@bakers-build/scope-change` > as a refinement of this ticket's own qualification
      handoff, which listed > scene changes as out of scope.** `Load`/`Delivery`
      are retired in favour > of `Overview` (the master-data face, inline-edit
      follow-up) and the > broader `Stats`; `Tickets` joins as its own tab
      (BB-428, never > reflected here before). Tab structure and naming only —
      no new > component, design token or entity mapping.

      THIS IS AN ENTITY PLACE, SO THE SCREEN OWNS THE CHROME (BB-378 D7/D19).
      `page_header` carries the team's name, its sub-line and the five faces IA
      D12.3 decided — Overview · Stats · Tickets · Runs · Members — in its
      `tabs` slot; the tab row is not a component of its own. The header is a
      SCREEN-level `page_header` rather than the `bb_team.bb_team.full` view
      mode, and that is the same rule the ticket detail follows: a view mode
      DISPLAYS an entity, a screen ARRANGES one, and the tabs are a screen-level
      fact — which face of the entity you are looking at — that no single-record
      mapping can know. D5 gives the screen exactly one `<h1>`, so there is
      exactly one `page_header` here and every block below it is a `zone`
      heading.

      AND THE BODY IS NEITHER A VIEW NOR A VIEW MODE (BB-435). It WAS a view:
      `canvas.main` held exactly one node, `view.bb_group_members`, derived
      from og's `og_members_overview` so that an og release could not collide
      with it. That is retired, and the reason is what the members surface has
      to be rather than a preference. Two of the four cells are interactive —
      the role and the remove control — so they have to be form controls, and a
      Views field smuggling a control into a table cell is what forced the one
      global `views-view-table.html.twig` to carry a thirty-line rule about what
      counts as content when a cell holds no text node: a naive `|striptags`
      drew an em-dash OVER the only affordance the row had, and four browser
      scenarios failed on it. The body is now ONE FORM that renders its own
      items, and it needs none of that.

      THE ROSTER IS A PATTERNED ROW (BB-638): `layout: cards` with `spacing:
      comfortable` and the pattern `headline: [person]`, `meta: [joined, team]`,
      `right: [state, role, transfer, remove]` — the person and the joined date
      on the left, the role, transfer and remove right-aligned.

      A view mode is still not the answer either, and for the original reason:
      membership is an `og_membership` entity, so this body is a query over a
      DIFFERENT entity type than the screen addresses.
      `bb_team.bb_team.full` stays the entity's own body and is separate
      work.

      THIS FACE AND THE PROJECT'S MEMBERS FACE ARE ONE SURFACE, which BB-419
      established and this ticket keeps. The view it replaced already took the
      group as (entity_type, entity_id) rather than as a team, and the form does
      the same: the group comes from the host of the face being rendered, so
      nothing in the surface names an entity type. The only differences are the
      ones the visible labels require — the noun in the remove sentence, and
      whether an item carries a role at all.

      What does not change is the other half of the rule: a screen ARRANGES. The
      title and sub-line stay here, because they are the screen's header.

      THE TAB BODIES USED TO BE FOLLOW-UPS' TO FILL; OVERVIEW NO LONGER IS
      (BB-484). Overview is the face the canonical address shows. BB-454
      follows IA D12.3 literally: the five tabs are five Drupal local tasks
      (three controller-backed, two native Views pages), and Overview is the
      DEFAULT task — a default task is not a route of its own, it IS the base
      route, so `/{workspace}/team/{id}` renders Overview.

      That reverses what this scene used to say. Members was named the active
      face here so the surface would show something while Overview's body was
      still undesigned; BB-484 designs that body, in the sibling scene
      `team-detail-overview` below, so the canonical address no longer renders
      an EMPTY body. Overview's body is the `bb_team.bb_team` `full` view
      mode: just the Projects relation now (see that scene's own docs for why
      Members is not repeated there). Stats stays empty for the reason this
      scene used to give Overview — it is a BB-454 follow-up's to fill;
      Tickets and Runs are native Views pages with no Designbook body of their
      own.

      Members is the one face THIS scene shows content for: its zone plus the
      Projects relation, one click away, and the face the live behaviour is
      proved on. This ticket ships the chrome and what already existed as its
      body — it invents no statistics it has no data for.

      THE MEMBER LIST NOW SHOWS A ROLE, THE SAME ARM THE PROJECT TAKES. BB-456
      D9 gives the team its first `role_type: standard` role,
      `og.og_role.bb_team-bb_team-lead`, so a team membership carries
      permissions exactly as a workspace or project one does — it is an OG group
      so that membership has one mechanism system-wide, and it is no longer the
      exception to what the other two levels grant. So the items carry a role
      control, the pick IS the write, exactly as the project's own items do. The
      decision is enforced in the entity mapping, which reads the role
      vocabulary rather than branching on `entity_type`, so a scene cannot put
      the wrong arm back.

      Both the team header and the members block SAY what the team grants. That
      is deliberate redundancy: the presence of a control is not itself a
      statement, and this is the surface where somebody would come looking for
      rights.

      THE RAIL SHOWS THE SHELL'S OWN STATE rather than this team's row in the
      trail — the accepted cost of declaring the shell once (D1). That used to
      be recorded here as a Storybook-only cost, on the grounds that in Drupal
      the trail comes from the route. BB-396 sharpens it: on a DIRECT visit
      the route still supplies the trail, but after a boosted navigation the
      rail is outside the replaced markup and its active entry is stale in
      Drupal too (D3, module fact F6). The cost is real on both surfaces, and
      the alternative is re-rendering the whole menu tree on every click.

      THIS SCREEN IS RENDERED INSIDE THE `island-content` BOUNDARY, and naming
      it is all this scene does about it (BB-396 D15). Everything the scene
      puts in the shell's `content` slot — the `canvas`, its `page_header` with
      the four tabs, and the members `zone` — sits inside `island-content`,
      which by D1 is the page's ONE swap target and is addressed by that DOM id
      rather than by a class or a `closest` selector. The tab row rides along
      with it: `local_tasks_block` is placed inside the same island in the
      shipped page layout, so its current entry is right after a tab click
      without declaring anything of its own (D8). The rail, outside the
      boundary, is the paragraph above.

      STORYBOOK CANNOT RENDER AN ISLAND AND DOES NOT SIMULATE ONE. An island is
      a render array `IslandWrapper` contributes at request time, and this scene
      renders Twig/SDC only, so there is no container, no boost, no fragment
      request and no swap here — the four tabs are plain links to this same
      story and `active` is a prop. Pretending otherwise would make the design
      claim behaviour the design cannot own; the boundary is DOCUMENTED and the
      simulation is FORBIDDEN. The live behaviour is proved on the Members face
      by the BDD suite, not here.

      AND THE BOUNDARY RUNS IN CONFIGURATION MODE — a declared deviation kept on
      purpose, so the scene describes what the surface actually does rather than
      the idealised fragment story. `island-content` declares an EMPTY swap
      target, which is `IslandBoost::to(NULL)`, "the container itself": it is
      already the main fragment and cannot ride along with itself. Because it
      resolves to no island plugin, the server never re-renders it alone — a
      boosted tab click is answered with the ORDINARY WHOLE PAGE and the client
      narrows it to this boundary with `hx-select`. That is enough for a
      container that only RENDERS, which is all four faces of a team do; a
      container that MUTATES would need a plugin instead.

      ALL THREE MEMBERSHIP STATES ARE VISIBLE — active, pending, blocked — which
      is why the sample world gained a blocked membership on this team. Only an
      active membership grants what its roles carry, so the state is the thing a
      reader of this screen can act on.

      THE MEMBERS ARE A LIST, not a table — same organisation rule as project
      members. `ticket-row` and `board-card` are untouched by that change: it is
      scoped to the organisation surfaces, where the values are not compared
      down a column. (`node-row` was named here too, until BB-378 deleted it.)

      THE PROJECTS ARE THE n:m RELATION FROM THE TEAM SIDE, as one inline
      picker. It reads `bb_project.teams`, the same field the `projects`
      section's screen edits from its rows — one field, two ends — which is why
      the assignment can never disagree between the two screens. Team 1 is
      assigned to both projects of this workspace, so the relation is many on
      this side as well.

      Nothing posts. The picker is closed here; the open state is on project
      detail (`project-detail-teams-open` in the projects section).
    items:
      - scene: design-system:shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
