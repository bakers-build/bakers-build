id: settings
group: Designbook/Sections/Settings
title: Settings
description: >
  **Product place: Settings** — rail leaf **Settings**. One settings screen
  administers the

  current workspace entity (name, billing) and the workspace **Labels**
  vocabulary. These are

  two entities on one settings surface, not separate rail destinations and not
  separate product

  sections named “workspace” or “labels”.


  **Rail:** My work · Projects · Teams · Settings.


  **Screens**


  - `settings` — workspace fields + Labels field group (no members: a workspace
  has no members).

  - `team-detail-overview` / `team` — team detail (rail Teams › row): entity
  tabs (IA D12.3,
    BB-454) Overview · Stats · Tickets · Runs · Members. `team-detail-overview` is the
    canonical/default face — Projects relation only (BB-484); `team` is the Members face
    (BB-435), where add member lives. No board, no Settings.

  Sibling sections: `tickets` (My work), `projects`.


  **Workspace and team both grant permissions.** BB-456 D9 gave the team its
  first standard role,

  `lead`, so a team membership now carries permissions exactly as a workspace or
  project one does.

  Membership lives on teams and projects, not on the workspace settings surface.


  **Layout.** Every scene here inherits the one shell (`scene:
  "design-system:shell"`) and fills its

  `content` with exactly one `canvas`; headings, regions and spacing follow

  `designbook/design-system/layout.md`, which is the rule document for the
  layout layer.
status: in-progress
order: 3
user_flows: >
  - Open Settings from the rail: rename workspace, inspect billing, manage
  Labels.

  - Click a team under Teams: team detail (overview, stats, tickets, runs,
  roster).

  - From team, open a Project when work must be distributed on a board.
ui_requirements: >
  **Entities read**


  - `bb_workspace.bb_workspace` — `full` view mode, and it is **empty**.
  `name` is the settings
    screen's heading (edited in place) and `billing_profile` its sub-line, and a `full` view mode
    emits no header (BB-378 — `designbook/design-system/layout.md` §2); `created`, `changed` and
    `owner_user_id` are deliberately not on screen. So the screen authors its own `page_header` and
    places no workspace node. The mapping file says why, so nobody puts the header back.
  - `bb_term.label` — Labels field group on the settings screen. Since
  BAKERS-17 the product has
    three term vocabularies (`type`, `recipe`, `label`) on tabs Types, Recipes and Labels;
    the capability-tags vocabulary is gone. This scene still shows the Labels group only (follow-up).
  - `bb_team.bb_team` — the Overview tab's **body**, `full` view mode: the
  Projects relation
    only (BB-484 dropped the Members zone from this mapping — BB-435 already delivers
    membership as the Members tab's own body, and a second copy here would duplicate that
    delivered face). Its `name`, `workspace_id` and `owner_user_id` are the screen's heading and
    sub-line and are therefore authored in the scene's `page_header`, not emitted here — a `full`
    view mode emits no header (BB-378).
  - `og_membership.default` — team (and project) member items only, `teaser`. A
  **workspace has no
    members** on the settings surface.
  - `user.user` — every person on team/project member rows, `compact`. Reads
  `display_name`,
    `initials`, `mail`, `status`.

  **Filters**: none — each screen scopes to the object it administers, and the
  workspace comes from

  the shell switcher rather than from a control here.


  **Not a filter**: the workspace, for the same reason it is not one anywhere
  else (BB-327).


  **A MEMBER LIST IS A LIST, NOT A TABLE.** The **team** screen and the
  **project** screen both

  render members as items of a `list` — the entry component that used to carry
  that argument is gone,

  and the argument is now the container's own: a listing without columns, which
  is what "not a table"

  means. BB-435 extended the rule to the project rather than letting the
  project contradict it: the

  same object was rendered as a `list` here and as a fully presented
  `bb_theme:table` there, which

  is a stronger disagreement than an unstyled core table would have been,
  because one global

  `views-view-table.html.twig` binds every table view and there was no per-view
  seam to differ at.

  The project's members live on their own **Members** face; the **settings**
  screen still has no

  members block. `board-card` keeps its pattern; the

  tickets, projects, groups and environments listings stay TABLES —
  `view.tickets`, `view.projects`,

  `view.groups` and `view.environments`, each a View that owns its table — where
  values are compared

  down a column. Members are deliberately not in that list and are not the table
  presenter's to

  claim: after BB-435 the member list is not a view at all. (`node-row` was in
  that first list

  until BB-378 deleted it — reachable from no Designbook scene.)


  **The workspace name is edited INLINE.** `name` is reversible, so by

  `designbook/design-system/action-pattern.md` › *Inline edit* the commit IS the
  write: no save

  button, no per-field dirty state, no confirmation. The only dialog in these
  organisation sections

  is `project-create`.


  **Team member remove is single-step and names the effect.**
  `action-pattern.md` confirms an

  action exactly when it **ends or discards the ticket**; removing a team
  membership does neither,

  so there is no confirmation. The control **names the effect** (from the
  membership mapping): since

  BB-456 D9 a team membership carries permissions, so removing one revokes
  their access — the same

  sentence the project already uses. Workspace settings has no members block at
  all.


  **The n:m project assignment lives on `bb_project.teams`** and is edited
  from the team screen

  and the projects section — one field, two ends.


  **Neither object exists in code as this designbook renders it.** Screens
  render from

  `data-model.yml` and `designbook/data/` alone.


  **The Drupal binding for list items is a Views `ui_patterns` row**, not an
  entity view display.

  `teaser` is the designbook-internal name for Storybook. This section generates
  neither view nor

  display — no `sync-to`, no `config/sync` touch.


  **Nothing posts** and nothing opens on click: Storybook never calls
  `Drupal.attachBehaviors`.


  **Sample records are selected by pinned id** (`select: "$[id='1']"`), never by
  tag.
scenes:
  - name: settings
    group: Screens
    section: settings
    docs: >-
      SETTINGS for the current workspace: the workspace entity (name, billing)
      and the Labels vocabulary on one rail destination named Settings. Not a
      “workspace section” and not a separate labels page in the product rail.

      NO MEMBERS HERE. A workspace has no members surface — membership is on
      teams and projects. The former members list on this screen is removed.

      THE NAME IS EDITED IN PLACE. Reversible field: `action-pattern.md` ›
      *Inline edit* — commit IS the write. Heading uses `bb_theme:form_input`
      (BB-420 Task 31 retired `text_line`; every editable field is now a real
      form element). No edit route, no edit dialog. `project-create` remains the
      only dialog in these sections.

      BILLING PROFILE is composed into one line (contract/subscription at tenant
      level). `created`/`changed` are not rendered.

      LABELS are a field group on this same settings screen: a list of pills
      (`badge` label variant) as a WRAPPING ROW rather than a grid column —
      which is what `zone`'s `direction: row` is for, and what `section`'s
      `justify_items: start` was working around before BB-378. Optional “New
      label” affordance is present; term description/weight have no surface yet.
      The capability-tags vocabulary no longer exists; `type` and `recipe` are sibling
      vocabularies (product tabs Types and Recipes, not yet in this scene).

      THE SHELL IS INHERITED, NOT RETYPED (BB-378 D1): this scene starts with
      `scene: "design-system:shell"` and fills its `content` with exactly one
      `canvas` (D2). The SCREEN owns the chrome: a `page_header` in
      `canvas.header` carries the single `<h1>` — which here is the workspace's
      name as an inline-editable `bb_theme:form_input` — and the composed
      billing line beneath it. The `bb_workspace` `full` view mode emits
      neither, because a view mode emits no layout (layout.md §2); with name and
      billing accounted for as heading and sub-line, and
      `created`/`changed`/`owner_user_id` deliberately off screen, that view
      mode has no body left and no workspace node is placed. Labels is a `zone`
      heading, one level below the `<h1>`, and its sub-line is `zone`'s
      `description` prop.

      THE RAIL SHOWS THE SHELL'S OWN STATE, not this screen's active trail. That
      is the price of declaring the shell once (D1) and it is paid deliberately:
      an inherited shell renders one rail state for every screen, and buying a
      per-screen trail back would mean passing the whole navigation tree through
      `with:` on all twenty scenes — which is the four-copy duplication D1
      exists to remove. In Drupal the trail comes from the route, so the loss is
      a Storybook-only cosmetic. Workspace switches only in the shell chrome.
      Workspace overview links to /home from this settings screen; it is not a
      rail menu item.
