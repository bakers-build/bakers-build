  - name: team-detail-overview
    group: Screens
    section: settings
    docs: >-
      ONE TEAM's OVERVIEW, the canonical/default face of the team screen
      (BB-484). Reached by clicking the team in the rail —
      `/{workspace}/team/{id}` is Overview because a default local task IS the
      base route, not a route of its own (IA D12.3, BB-454).

      THIS IS AN ENTITY PLACE, SO THE SCREEN OWNS THE CHROME (BB-378 D7/D19),
      exactly as the sibling `team` (Members) scene does. `page_header` carries
      the team's name, its sub-line and the same five tabs — Overview · Stats ·
      Tickets · Runs · Members — in its `tabs` slot, with `Overview` `active:
      true` here. The header is a SCREEN-level `page_header` rather than the
      `bb_team.bb_team.full` view mode: a view mode DISPLAYS an entity, a
      screen ARRANGES one, and the tabs are a screen-level fact no single-record
      mapping can know.

      AND THE BODY IS THE ENTITY'S OWN VIEW MODE, unlike the Members face.
      Overview addresses the SAME entity type the screen is about —
      `bb_team.bb_team` — so, unlike Members' `og_membership` query, a view
      mode is exactly the right shape here: `canvas.main` places one
      `bb_team.bb_team` `full` entity node, selected on this team's id.

      OVERVIEW IS NOW FILLED, NOT EMPTY. The `team` scene's docs used to say the
      canonical address rendered an empty body because Overview's body had not
      been designed; BB-484 designs it, in this scene. The body renders the
      team's Projects relation — the n:m assignment from the team side, reading
      `bb_project.teams` — as one coherent zone inside the D12.3 tab set. That
      is the entire body this round: no roster here. BB-435 already delivers
      membership as the Members tab's own body (a form over a different entity
      type, `og_membership`), and a second copy on Overview would duplicate that
      delivered face the moment one of the two disagreed — so the entity mapping
      carries no Members zone any more, and this scene places no membership
      content either. No inline rename this round either: `name` stays a plain
      heading here, the reversible edit affordance is out of this pass's scope.

      THE RAIL SHOWS THE SHELL'S OWN STATE, and THIS SCREEN RENDERS INSIDE THE
      `island-content` BOUNDARY, and STORYBOOK CANNOT RENDER AN ISLAND — all for
      the same reasons the `team` scene's docs give in full; this scene does not
      repeat that argument, only its conclusion: the four tabs are plain links
      to their own stories and `active` is a prop, nothing here simulates a
      boosted swap.
    items:
      - scene: design-system:shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: Platform crew
                      description: >-
                        keytec · owned by Christian Wiedemann · lead role grants
                        access
                    slots:
                      tabs:
                        component: bb_theme:tabs
                        props:
                          label: Team sections
                          items:
                            - label: Overview
                              url: >-
                                /?path=/story/designbook-sections-settings-scenes--team-detail-overview
                              active: true
                            - label: Stats
                              url: >-
                                /?path=/story/designbook-sections-settings-scenes--team
                              active: false
                            - label: Tickets
                              url: >-
                                /?path=/story/designbook-sections-tickets-scenes--ticket-list
                              active: false
                            - label: Runs
                              url: >-
                                /?path=/story/designbook-sections-tickets-scenes--run-detail
                              active: false
                            - label: Members
                              url: >-
                                /?path=/story/designbook-sections-settings-scenes--team
                              active: false
                main:
                  - entity: bb_team.bb_team
                    view_mode: full
                    select: $[id='1']
