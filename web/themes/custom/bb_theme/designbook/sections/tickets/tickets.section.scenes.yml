  - name: ticket-inline-edit
    group: Action
    section: tickets
    docs: >-
      HOW A TICKET IS EDITED, and since the third review gate this is the only
      answer: there is no edit dialog. The human removed it, and what replaces
      it is not new — it is `action-pattern.md`'s own rule for a reversible
      field. The displayed VALUE is the trigger, there is no separate edit
      control. A pick does NOT persist anything: the pickers commit together
      through one explicit primary Save, right-aligned in a separated action row
      below the properties — the same action row the Settings forms use
      (BB-638). A completed Save shows the status message "bakers.build ticket <label>
      saved." as the bottom-right `toast`, which hides itself after five
      seconds, and the operator stays on the surface; warnings and errors stay
      inline message bars. There is no autosave and no "Saving…" state. This
      scene renders that toast. This is the dialog's pill grammar one size
      smaller: the same option_picker component, the same self-naming
      aria-label, the same panel.

      The five fields this covers are the five the inspector puts first —
      assignee, reviewers, conductor, priority and labels — and they are inline
      pickers in the rail of every detail scene here. This scene is the
      reference render for one of them OPEN, because Storybook never calls
      Drupal.attachBehaviors: no pill opens on click on the review surface, so a
      panel that had to be clicked would demonstrate nothing. The open state is
      rendered from a prop instead, which is what BB-332 D8 exists for.

      The open panel shows a checkmark on the current value and offers the clear
      row as its FIRST row, so clearing is a value the operator picks from the
      list rather than an absence they have to produce or a button bolted above
      it.

      STATE IS DELIBERATELY ABSENT from this set. By action-pattern.md a
      transition is confirmed, and a property form with one Save cannot carry a
      confirmation — and with the transition surface removed at the second gate
      there is nowhere for one to live at all. CONDUCTOR is the one field here
      with a server-side effect, so the effect is NAMED at the field: the same
      sentence the create dialog carries beneath its pill row. The other three
      are reversible and name nothing.
