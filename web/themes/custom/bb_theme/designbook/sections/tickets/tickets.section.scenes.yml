      the scene owns the canvas, the page_header (breadcrumb, title, Overview
      tab) and the inspector. `bb_run.bb_run` `full` emits only the
      left-column body — latest ticket summary, then one newest run activity.

      Breadcrumb is Workspace → Ticket → current Run, inside the shared header,
      not a Drupal breadcrumb region. Linked parents, unlinked current crumb.
      Overlay is empty. Logs are download links only; the error log and
      log-viewer stay on the overlay scene.

