      action-pattern.md confirms, because it ends the ticket; the confirmation
      is the `dialog` with prose in its body and two actions, never a
      confirm_dialog. The prose names the consequence — the ticket becomes
      cancelled and cannot be reopened, and the running run stops — rather than
      asking whether the operator is sure. Keep ticket comes first and is the
      safe default; Cancel ticket carries the danger outline. The page
      underneath is the ticket before any hold, so its footer offers Freeze
      ticket (bordered) before Cancel ticket.
