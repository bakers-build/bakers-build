  - name: ticket-detail (intervention layout)
    group: Screens
    section: tickets
    docs: >-
      Variant B of the ticket detail, in Operate mode: the agents drive the
      workflow and the human watches, configures and intervenes. It is
      `ticket-detail` with the transition surface left out entirely — no
      transition buttons and no tab row — and the INTERVENTIONS put where they
      act. The page header carries no buttons at all. Freeze ticket (bordered)
      and Cancel ticket sit in the inspector's intervention footer, below a
      divider, as GitHub's issue sidebar ends, and the running run in Run
      history carries its own Cancel run.


      This scene shows the ticket frozen. The operator's hold stops it from
      being claimed but leaves the running run running, and while it holds, the
      footer's Freeze ticket becomes Unfreeze ticket. The summary band's flow
      leads with a `frozen` badge (wait tone, with a dot) whose suffix says when
      the hold started ("2 minutes ago"), the page header's subline ends with
      the same words, and Properties opens with a Stall row carrying that badge.
      A ticket standing still for another reason (blocked, no conductor,
      failing) shows the same badge without a suffix; a moving or closed ticket
      shows none.


      The main region is composed here rather than taken from the `full` view
      mode, because the running run's row needs a trailing action and the
      `bb_run.teaser` row is a one-item `list` of cells with no slot for one.
      So Run history is one composed `list` whose five items carry exactly the
      cells the teaser emits, the running one ending in an `action` cell, and
      the handoffs are the two `event` nodes the comment mapping emits. Entity
      references side by side in a scene slot are what contract B5 forbids — a
      listing is a View or is rendered by its parent entity — so moving the
      action into a mapping, which restores the `bb_ticket` route-bearer here,
      is the follow-up.


      The inspector is one lifted panel (`surface`) of four blocks separated by
      one quiet divider each, with the intervention footer as the last block:
      Properties — the four editable properties as inline pickers that read as
      editable at rest, and Created by, read-only beside the people it belongs
      with; then Effort, open, and Code and Relations, collapsed, each a
      collapsible whose small faint label carries a short summary ("Code ·
      develop", "Relations · 5"). Rows inside a block carry no line of their own
      and their values start on one edge. Empty rows are simply left out.
      Related tickets are linked chips side by side, each going to that ticket.
      More settings, in the footer under Unfreeze (or Freeze) ticket and Cancel
      ticket, is the exception path: normally the AI configures the ticket.


      The About description is clamped to five lines with a Show more / Show
      less toggle once JavaScript runs; a short description shows no toggle and
      without JavaScript the full text renders. The main region spaces its
      stacked zones itself (canvas main gap).
