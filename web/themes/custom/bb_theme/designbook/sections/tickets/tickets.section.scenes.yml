id: tickets
group: Designbook/Sections/My work
title: My work
description: >
  **Product place: My work** (nav home — IA D1/D5/D9). Open tickets assigned to
  the current user,

  plus ticket detail and ticket actions. The designbook section id stays
  `tickets` (scene paths and

  sample tags); the product name is **My work**.


  Global Dashboard, Board, Runs and Conductors are **not** sections here. Board
  lives on **project

  detail** (`projects`). Team stats live on **team** (`settings`, BB-454).
  Runs appear on ticket

  detail and on project/team lead zones — not as rail destinations.


  BB-335 built the ticket list/detail/action surfaces; they render in
  Storybook on Designbook

  sample data and are not wired into Drupal yet. Action scenes live here (not in
  the design system).


  **Screens**


  - `ticket-list` — **My work home (v0)** when scoped to assignee = me and
  non-terminal states; also
    the full find-a-ticket listing with a `filters`, `active-filters`, and one list row per ticket:
    headline identifier, title, state, priority; meta project, conductor, updated; assignee on the
    right. Sorting is a "Sort by" dropdown in the exposed form, not a column header. The identifier
    is a plain route link.
  - `project-runs-list` — the project Runs tab listing: `view.runs` as one list
  row per run
    (headline ticket identifier, state, from; meta conductor, agent, started; duration on the right).
  - `ticket-list (add action)` — the same screen stripped to its content header,
  as the positive side
    of the conditional that says the add affordance is owned by the screen which can receive it. Read
    it against `Shell`, which is the negative side.
  - `my-time` — **My work > My time** (BB-613). The page header is **My
  time**,
    the sub-line names recorded hours in the workspace, **Record time** is the
    plus, and the My work tabs sit in the header with My time current.
  - `ticket-detail` — **three regions of one `canvas`**, not two columns.
  BB-331 fixed a
    chronological two-column order and BB-335 superseded it at the design gate, because the
    developer who opens this screen reads it for four questions — what is this about · what was done ·
    what was tested · how can I test it — and not for the order the AI wrote things in. BB-378 then
    moved the arrangement itself from the view mode to the SCREEN: the scene owns the `canvas`, and
    `bb_ticket.bb_ticket.full` emits only the body (see `designbook/design-system/layout.md` § 2).
    1. `canvas.header` — `page_header` with the identifier and title, and no add action because a
       detail screen cannot add; then `ticket_status_band` at full width above the columns: the state
       flow, then the latest `summary` comment, and **below the summary** the links. They sat beside
       it in the first iteration and the human read that as two things competing for one glance.
    2. `canvas.main` — the body from the `full` view mode: About, Run history, and the handoff stream
       LAST, collapsed.
    3. `canvas.inspector` — the sticky trailing column of properties, four inline-editable fields
       first. There is no tab row; tabs hide exactly what an operator scans for.
  - `ticket-create` — ONE surface in **four states**, not four sibling scenes:
  `ticket-create` is the
    filled one that opens from the list, and `(empty)`, `(rejected)` and `(unresolved context)` are
    its other three. They are state variants of the same dialog, and the contract check asserts that
    the rejected body is byte-equal to the filled one and the unresolved body to the empty one — so
    "a rejected write costs the operator nothing" is a property of the file rather than of how
    carefully somebody re-typed each pill.
  - `ticket-inline-edit` — how a ticket is edited, with one picker panel open.

  - `ticket-cancel` — the one confirmed action left.


  **Layout.** Every scene here inherits the one shell (`scene:
  "design-system:shell"`) and fills its

  `content` with exactly one `canvas`; headings, regions and spacing follow

  `designbook/design-system/layout.md`, which is the rule document for the
  layout layer.


  **There is no edit dialog.** Everything is edited inline, in the inspector,
  where the pick IS the

  write. That is not a gap this section is waiting to fill: it is
  `action-pattern.md`'s own rule for

  a reversible field, and a dialog that asked for assignee, conductor, estimate,
  spent, priority and

  labels together was a save-button form wearing the pill grammar. The rail's
  four inline pickers are

  the mechanism and `ticket-inline-edit` is the reference render for them.
  **This contradicts this

  ticket's own description**, which names that edit dialog field by field; the
  human instructed it at

  the third review gate and it is recorded here as a deviation rather than
  reconciled.


  **There is no transition surface** either, and its absence is likewise a
  decision rather than an

  omission. The band carried a `Move to review` button opening a confirmation
  that named the agent run

  it dispatched, and the human removed both at the second review gate — twice
  stated, against this

  ticket's own description and its qualification handoff. So these screens
  **read** a ticket's state

  and never write it: the band still shows where the ticket stands, `state` is
  still not

  inline-editable, and whoever gives the web UI a transition again owns the
  confirmation rules in

  `action-pattern.md` along with it. BB-332's transition-confirmation scene
  was dropped rather than

  moved here, for the same reason: moving it would have reintroduced the
  surface. What it proved

  about the pattern — a confirmation is the `dialog` with prose in its body and
  two actions, never a

  `confirm_dialog` — is proved by `ticket-cancel`, which is the rule's other
  confirmed case.
status: in-progress
order: 1
user_flows: >
  - Land on My work (home): see open tickets assigned to me; open one into
  ticket-detail.

  - Choose facets in the sidebar (full list), read what is chosen in the summary
  above the rows,
    collapse the panel once the filters are set, open a ticket, read the band first, and edit from
    the inspector.
  - Create a ticket from the list's primary action: the create dialog opens
  carrying the list's own
    project as its context, and saving returns to the list with the new ticket in it. Where nothing
    resolves that project the dialog asks for it instead of refusing.
  - Edit from the detail screen without leaving it: pick a value in the
  inspector and the pick is the
    write. Cancel from there too, and that one is confirmed, because it discards the ticket.
  - Leave My work for Projects or a Team when the question is unit load, not my
  plate.
ui_requirements: >
  **Entities read**


  - `bb_ticket.bb_ticket` — full view mode for the detail; the LIST is
  `view.tickets`, a View that
    owns its table, and no view mode of the ticket at all — a listing row was never a view mode.
    The detail needs a place for every meta field: `state_flow`, `assignee_user_id`, `reviewers`, `conductor_id`,
    `priority`, `ticket_type`, `recipe`, `labels`, `time_estimate`, `time_spent`, `branch_name`, `base_branch`,
    `environments`, `env_vars`, `parent_id`, `sub_tickets`, `blocked_by`, `referenced_tickets`,
    `links`.
  - `bb_comment.bb_comment` — the latest `summary` in the band and the
  handoff stream at the
    bottom of the main region. Reads `body`, `bb_comment_type`, `author_name`, `created`.
  - `bb_comment.review` — private reviews in draft, submitted, accepted and
    rejected states. The current assignee's submitted queue is `pending_reviews`
    on the ticket, kept off the ordinary handoff stream.
  - `bb_run.bb_run` — the run history in the main region. Reads `state`,
  `started_at`,
    `duration`, `agent`.
  - `bb_term.type`, `bb_term.recipe`, `bb_term.label` — the Type, Recipe
  and Labels rows in the inspector (Type and Recipe right before Labels), the
  label facet, and the matching pickers on
    the create dialog.
  - `user.user` — the assignee column, the assignee facet, and the assignee
  picker in the rail.

  - `bb_conductor.bb_conductor` — the conductor column and the conductor
  control.

  - `bb_environment.bb_environment` — the environments row in the inspector.

  - `bb_project.bb_project` — the project column and filter.

  - `bb_group.bb_group` — the group filter, through `bb_project.group_id`.

  - `bb_team.bb_team` — the team column and filter, through
  `bb_project.teams`.


  **Filters**: `group`, `project`, `team`, `state`, `workflow`, `assignee`,
  `priority`, `label`


  **Not a filter**: the workspace — it switches globally in the shell
  (BB-327).


  **The eight facets are chosen in a collapsible sidebar, and what is chosen is
  stated above the

  rows.** The first iteration put them in one row of `filter-bar` pills, and the
  human asked for the

  reference's model instead: `filters` holds the eight controls down the leading
  edge — sticky,

  and deliberately not a scroll container, so a facet opened low in the list is
  not clipped — and

  `active-filters` states the result, one chip per chosen facet reading field,
  operator and values.

  That summary **sits directly above the rows**, in the results column,
  left-aligned with the table's

  first column: it describes the results, so it belongs above them rather than
  among the controls that

  produced it. It spent the third iteration at the top of the aside and moved
  back out at the fourth

  gate. It renders in exactly ONE place — a second copy in the aside would state
  the same thing twice,

  and the two would eventually disagree. The operator adapts to how many values
  there are: one reads

  `is`, several read `is either of`, and a field whose own vocabulary differs
  overrides it (`includes

  any of` for labels). The list scene no longer composes `filter-bar` at all;
  the position indicator

  sits in the summary's `meta` slot, beneath the chips. **Nothing is wired**: no
  query, no URL writing,

  and no saved views — a filter set kept as a favouritable custom view is how
  the reference persists

  one, and that is the wiring ticket's work.


  **The filter panel collapses**, so the eight controls can be put away once
  they have been set and

  the table can have the width back. The `Filters` heading is the control that
  does it: the panel

  composes `collapsible`, so the heading is a real `<summary>` and the controls
  are the content of a

  native `<details>`. That is the same mechanism the handoff stream uses and for
  the same measured

  reason — Storybook never calls `Drupal.attachBehaviors`, so a scripted
  collapse would be a dead

  control on the surface these screens are reviewed on, and a click that answers
  with nothing is

  worse than no affordance at all. The panel's resting state is expanded;
  `filters`'s

  `collapsed` prop names the deviation, and the `Collapsed` story is the render
  of it.


  **The three regions of the detail screen.** Two of the sixteen meta fields do
  not live in the meta

  column: `state_flow` and `links` are in the band, which is where they answer
  the questions they

  are read for. Written down here rather than left to look like an omission.


  **The links are grouped by the question each kind answers**, not by kind: Code
  (`mr`, `branch`),

  Test results (`ci`, `report`), Try it yourself (`ddev`, `design`), More
  (`doc`) — in that order,

  and a group renders only when it has rows. The grouping is read straight off
  the `LinkKind` enum,

  so it needs no new field and no agent convention. A `report` link renders
  richly — its pass/fail

  counts and duration — through the link group's own `kind` dispatch rather than
  through a row

  component of its own (D7), and it shows only the counts its props carry and
  fetches nothing. The groups sit

  **below the summary** in the band and lay out as one wrapping row across its
  full width.


  **The handoff comments go last**, after the run history, collapsed into a
  native `<details>` whose

  label names what is inside. Once the band carries the latest `summary`, the
  rest of what an agent

  wrote is archive. The disclosure is native rather than scripted because
  Storybook never calls

  `Drupal.attachBehaviors`, so a scripted accordion would be a dead control on
  the review surface —

  and it keeps working with JavaScript disabled entirely.


  **UI patterns**: no tabs on the detail screen. A long handoff comment must not
  push the inspector

  out of view, which is why that rail is `position: sticky` and deliberately not
  a scroll container:

  a scroll container would clip every inline picker opened low in it. Both
  remaining action surfaces —

  create and cancel — follow the action pattern written in

  `designbook/design-system/action-pattern.md`, without variation. The inline
  edits in the inspector

  commit on an explicit Save beneath them (BB-638), and `state` is
  deliberately not among them — a property form cannot

  carry a confirmation, and with no transition surface there is nowhere for one
  to live at all. Where

  a single-step choice has a server-side effect it is **named** at the field,
  and named quietly: the

  create dialog and the rail's conductor picker carry that sentence in a
  `consequence_note` rather

  than in a `message`, because `message` offers only status|warning|error and
  `status` reads as a

  success for something that has not happened yet.


  **A picker states its field, its count and its whole value.** `option_picker`
  shows the field name

  beside the value rather than swapping one for the other, so a pill reading
  `backend` cannot be

  mistaken for a field called that; several values render as the first plus
  `+N`; and an over-long

  value is bounded and truncated with its full text still reachable in the
  `title` attribute and the

  accessible name. It is the one pre-existing component this ticket modified, by
  explicit human

  exception.


  **Open for BB-335**: the sample data is tagged with an entity-type name
  where a section id

  belongs, so no record is tagged for this section; the scenes below pin the
  record ids they select.
