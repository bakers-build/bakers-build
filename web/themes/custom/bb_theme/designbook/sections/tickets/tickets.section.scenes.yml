  - name: ticket-cancel
    group: Action
    section: tickets
    docs: >-
      A confirmed action, and one of exactly two kinds the rule allows: this one
      DISCARDS the ticket. It is the same dialog component with prose in its
      body slot and two actions — there is no confirm_dialog anywhere in this
      theme, because a confirmation differs from a create dialog in its content
      and not in its structure, and a separate component would drift from the
      hull it was copied from.

      The prose names the concrete effect — which ticket, what happens to its
      run, and what survives — and never asks "are you sure?", which would tell
      the operator only that something will happen.

      The escape hatch is labelled "Keep ticket" rather than "Cancel". On a
      surface whose primary action is itself called Cancel, a ghost button
      labelled Cancel would ask the operator which cancel is meant. One submit
      plus one ghost is the invariant; the ghost's wording is pinned only where
      it can be.
