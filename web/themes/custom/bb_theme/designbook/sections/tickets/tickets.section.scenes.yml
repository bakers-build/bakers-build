  - name: stats
    group: Screens
    section: tickets
    docs: >-
      MY WORK > STATS (BB-481). The web mirror of the figures the `bakers ui`
      dashboard opens on: the signed-in user's own numbers, read server-side and
      rendered as markup.

      Every figure keeps the shape its `display` kind declares, and each kind is
      one component — `stat-windows` for three trailing totals, `stat-series`
      for the daily strip, `stat-ratio` for a derived quotient, `stat-breakdown`
      for a per-axis split. Four strict schemas rather than one lax one, because
      an invalid SDC prop is dropped silently and a figure that arrives without
      its data must fail visibly instead of rendering an empty box.

      The ratio's values are NOT computed here. The server divides and formats
      them, em-dash included, so the terminal and the browser cannot drift; this
      scene only shows what it was handed — which is why the 24-hour quotient
      reads as a dash while its two factors are plainly visible.

      The figures render in configured weight order, and nothing on this screen
      needs JavaScript: the series uses proportional SVG bars built in the
      template, the breakdown composes the table component, and a reader with no
      scripts sees every number.
    items:
      - scene: design-system:shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: My work
                      description: Your own figures, as the terminal dashboard shows them
                    slots:
                      tabs:
                        component: bb_theme:tabs
                        props:
                          label: My work sections
                          items:
                            - label: Tickets
                              url: >-
