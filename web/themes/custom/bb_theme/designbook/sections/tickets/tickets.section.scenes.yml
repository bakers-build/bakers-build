  - name: ticket-detail (long handoff)
    group: Screens
    section: tickets
    docs: >-
      The evidence for C6, and the reason the inspector is sticky rather than a
      scroll container. This is the same detail screen pointed at the pinned
      sample record NWS-80, whose summary body is oversized on purpose: its main
      region runs well past the viewport. Scroll to the bottom of the handoff
      collapsible and the inspector is STILL in frame, because sticky
      positioning pins it to the top of its own column while the page scrolls as
      one.

      Two alternatives were rejected for this. Giving the meta column its own
      overflow-y would satisfy the criterion in the first frame and then clip
      every inline picker opened low in the rail, because an absolutely
      positioned panel cannot escape a scrolling ancestor. Bounding each comment
      behind a "show more" control would hide the cause and hang readability on
      a handler that does not run in Storybook at all.

      The handoff collapsible here is closed on load, like every other one, and
      it is the ONE control on this review surface that genuinely works when
      clicked — because it is a native element and not a scripted accordion.
    items:
      - scene: design-system:shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: NWS-80 · Checkout address step rewrite
                      description: Northwind Shop · bb_work · claimed by mvd-thinkpad
                  - component: bb_theme:summary-band
