  - name: ticket-detail
    group: Screens
    section: tickets
    docs: >-
      The ticket detail in its THREE regions (C2), rendered from the full view
      mode of the pinned sample record BB-142. The content header names the
      ticket and owns no add action, because a detail screen cannot add. Beneath
      it the status band runs the full width and answers three of the four
      questions a developer opens this screen with: where the ticket stands (the
      state flow), what was done (the latest summary comment), and what was
      tested plus how to try it (the links, grouped by the question each kind
      answers rather than by kind).

      The links sit BELOW the summary and lay out as one wrapping row across the
      band's full width. In the first iteration they sat beside it in a 280px
      column, and the human read that as two things competing for the one glance
      the band exists to serve — with the narrow column wrapping every group
      label into two lines as well.

      The band offers no transition control. It carried one, opening a
      confirmation that named the agent run it dispatched, and the human removed
      the whole surface at the second review gate. So this screen reads the
      ticket's state and never writes it, and state is still not an inline
      picker in the rail.

      Only then come the two columns. The main region carries the description,
      the run history, and the handoff stream LAST — collapsed, recessive, and
      labelled with what it holds. The inspector on the right is sticky rather
      than a scroll container, and its five reversible fields come first as
      inline pickers that commit through the Save button below them.

      There is no tab row anywhere on this screen.

      IN DRUPAL THIS SCREEN RENDERS INSIDE THE SHELL'S CONTENT ISLAND,
      island-content (BB-414). That boundary is declared by the shipped page
      layout and not by anything here: the layout wraps its `content` slot in an
      island whose `swap_target` is empty, meaning the container itself, and the
      route's body is what lands in it. The screen adds no island of its own — a
      nested one would have to boost to NULL anyway, because `hx-select-oob` is
      closest-wins and a second boundary inside the first would silently stop
      the ancestor from updating.

      Storybook renders no island behaviour and cannot: it never calls
      Drupal.attachBehaviors. What you see below is the composition, never the
      swap. Whether a click keeps the document is observable only in a browser
      against Drupal, which is why the island half of this screen is held by the
      Playwright feature, and why every control on this scene is inert.
    items:
      - scene: design-system:shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: >-
                        BB-142 · Add designbook entity view-mode for
                        bb_ticket
                      description: bakers.build Platform · bb_work · claimed by cw-framework
                  - component: bb_theme:summary-band
                    slots:
                      flow:
                        component: bb_theme:state-flow
                        props:
                          states:
                            - backlog
                            - qualification
                            - plan
                            - working
                            - review
                            - done
                          current: working
                          label: Workflow state flow
                      summary:
                        entity: bb_comment.bb_comment
                        view_mode: teaser
                        select: $[ticket_id='1' and type = 'summary'][-1]
                      links:
                        - component: bb_theme:link-group
                          props:
                            label: Code
                            links:
                              - url: >-
                                  https://gitlab.example.com/bakers/bakers/-/merge_requests/88
                                title: MR !88 — designbook entity view-mode
                                kind: mr
                              - url: >-
                                  https://gitlab.example.com/bakers/bakers/-/tree/bakers/bb-142-designbook-entity-view-mode
                                title: bakers/bb-142-designbook-entity-view-mode
                                kind: branch
                        - component: bb_theme:link-group
                          props:
                            label: Test results
                            links:
                              - url: >-
                                  https://gitlab.example.com/bakers/bakers/-/pipelines/48213
                                title: 'Pipeline #48213 (passed)'
                                kind: ci
                              - url: >-
                                  https://gitlab.example.com/bakers/bakers/-/jobs/48213/artifacts/file/playwright-report/index.html
                                title: Playwright BDD report — 48 scenarios
                                kind: report
                                passed: 46
                                failed: 2
                                duration: 3m 41s
                        - component: bb_theme:link-group
                          props:
                            label: Try it yourself
                            links:
                              - url: https://bb-142.ddev.site/admin/bakers/ticket
                                title: Tickets screen on the bb-142 worktree
                                kind: ddev
                        - component: bb_theme:link-group
                          props:
                            label: More
                            links:
                              - url: https://bakers.example.com/docs/designbook
                                title: Designbook docs
                                kind: doc
                main:
                  - entity: bb_ticket.bb_ticket
                    view_mode: full
                    select: $[id='1']
                inspector:
                  - component: bb_theme:inspector
                    slots:
                      rows:
                        - component: bb_theme:form
                          slots:
                            lines:
                              - component: bb_theme:list
