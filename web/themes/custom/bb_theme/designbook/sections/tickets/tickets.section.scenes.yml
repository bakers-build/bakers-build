  - name: ticket-create (empty)
    group: Action
    section: tickets
    docs: >-
      The create dialog as it opens, centered in the shell's overlay slot (C1),
      on Linear's widget grammar (BB-332 D14 — the human rejected that
      ticket's first iteration labelled form at its own approval gate). Two
      borderless text lines carry the title and the description in their
      placeholders, and the three remaining properties sit beneath them as one
      wrapping row of pills: parent, conductor, labels. There are NO visible
      labels anywhere — each pill shows the field name, and the value beside it
      once one is set — so every control names itself for assistive technology
      through an aria-label instead.

      WORKFLOW IS NOT IN THE PILL ROW AT ALL. It sits on its own separated row
      directly beneath the head, above the title line, because it is not a peer
      of the other properties: the workflow decides the ticket's whole state
      flow, and it is the choice that cannot be changed cheaply once work has
      started. Making it merely the leading pill was tried and was not enough —
      first in a row still reads as "the first of these", and it is not one of
      these (BB-332 D16).

      It is deliberately NOT in the head breadcrumb either. bakers.build > Feature > New
      ticket was considered and rejected: the head already carries the context
      picker, and two pickers in one breadcrumb read as a single compound
      control rather than as two independent choices. The head says WHERE this
      acts; the workflow row says WHAT KIND of thing it is.

      There is NO assignee pill. An assignee follows from the conductor, so a
      second control for it would be a redundant decision at exactly the moment
      the operator has the least information. The project is likewise not a body
      field — but it is not static text either: it is the CONTEXT PICKER in the
      dialog head, pre-filled from where the operator came from and changeable
      there (BB-332 D15).

      Exactly one submit action plus cancel; the TUI's second submit row has no
      web equivalent, because it launches a local process a browser does not
      have, so the agent affordance is the conductor pill instead. The conductor
      is cleared here, which means the ticket waits for a human — and that is
      why this scene carries no consequence note: there is no consequence to
      name until a conductor is set. Three pills fit in one row, so there is
      deliberately no overflow control; the rule for when one appears is written
      in designbook/design-system/action-pattern.md, along with the rest of this
      grammar.
