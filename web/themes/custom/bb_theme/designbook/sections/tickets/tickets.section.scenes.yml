    docs: >-
      The tickets list inside the BB-330 shell (C1, C22). The content header
      owns the icon-only primary add action — the POSITIVE side of BB-332's
      conditional, because this screen can receive an addition and the shell
      chrome deliberately carries none.

      Beneath it the filters aside holds the eight facets of the section
      contract down the leading edge, and its panel COLLAPSES: the Filters
      heading is a real <summary> over a native <details>, so the controls can
      be put away once they are set and the list takes the width back. It is the
      one control on this screen that actually works when clicked, for the same
      reason the handoff collapsible is — see the note at the bottom of this
      docs block.

      The selected-facet summary sits directly ABOVE THE ROWS, left-aligned with
      the rows' leading edge, stating what the facets narrowed the list to:
      Project is bakers.build Platform, State is either of working and review. Its meta
      slot carries the BB-312 position indicator, which until this ticket
      existed only in the TUI as countLabel(). The list below it is
      `view.tickets`: the eight rows come from one view mapping as
      `bb_theme:list` rows sharing the listing `pattern` — headline
      identifier, title, state and priority; meta project, conductor and
      updated; the assignee in the right-hand column. There is no column header:
      ordering is the exposed "Sort by" dropdown (Updated, newest first by
      default), depicted in the search toolbar directly above the results —
      `filters` with `layout: bar`, a Title search beside a `form_label` "Sort
      by" and its native `form_select` (BEF combines field and direction into
      one `sort_bef_combine` select). The facets stay in the aside.

      That summary spent the third iteration at the top of the aside and the
      human moved it back out here at the fourth gate: it describes the results,
      so it belongs above them rather than among the controls that produced it.
      It renders in one place only — the same statement made twice in two
      layouts is two things to keep in agreement.

      This replaced a row of filter-bar pills. Choosing and summarising are two
      jobs, and one pill row did both: with eight pills the row said what was
      available and left the operator to read the current selection off the
      pills themselves. The sidebar chooses and the summary states, each where
      it belongs: the controls beside the list they narrow, the statement above
      the rows it describes. The state facet shows the +N rendering that
      multi-select gained in the same pass.

      There is no workspace facet: the workspace switches globally in the shell,
      so filtering by it would offer to narrow the thing that already scopes the
      whole screen. And nothing here is wired — no query runs, no URL is
      written, and no filter set is saved.

      Note for whoever reviews this in Storybook: no pill opens on click.
      Storybook never calls Drupal.attachBehaviors, so none of this theme's
      behaviour runs on the review surface — every rule here is a property of
      the markup, which is why the open states in these scenes are rendered from
      props. The Filters heading is the exception and the reason it is one: it
      collapses a native <details>, which needs no behaviour at all, so it is
      the single control on this screen that a reviewer can genuinely operate.
