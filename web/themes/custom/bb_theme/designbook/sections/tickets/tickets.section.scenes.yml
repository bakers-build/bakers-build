  - name: ticket-list (add action)
    group: Screens
    section: tickets
    docs: >-
      The POSITIVE side of BB-332's D16 conditional, isolated: a screen that
      CAN add, and therefore owns the add action itself. The `+` is icon-only,
      primary and right-aligned in the content header, and it opens the create
      dialog of the four scenes below.

      It is a BUTTON, deliberately — not a link to an add route. A create
      surface is a dialog in the shell's overlay slot precisely because a
      standalone route loses the list context (action-pattern.md, "Create and
      edit surfaces"), so a `+` pointing at /admin/bakers/ticket/add would
      contradict the pattern it is supposed to demonstrate. Like the dialog's
      own close control it carries no handler here: opening the dialog is
      runtime work and sits on the same side of the boundary as modality and
      focus trapping.

      Read this beside the Shell scene in design-system.scenes.yml, which is the
      negative side — a screen with no add action, and a shell whose chrome
      carries none either. A conditional shown only in its true state is not
      shown at all, which is why this costs a scene rather than a sentence. The
      negative side stayed in the design system on purpose: a shell that carries
      no entity-add action is a fact about the CHROME, not about tickets.

      The rule: the add affordance is owned by the screen that can receive the
      addition. A global add button in the chrome is Drupal's route-derived add
      logic wearing a toolbar — the chrome cannot know what the screen under it
      accepts, so it either shows an action that sometimes lies or hides one
      that sometimes puzzles. On a screen that cannot add, the affordance is
      ABSENT, not disabled and not hidden.

      Do not confuse that with the unresolved-context state below, which behaves
      differently: absent means this screen cannot add at all; present with
      unresolved context means it can add and is missing a required value the
      operator can supply inside the dialog.

      It carries no filters aside, which is what keeps it distinct from
      `ticket-list`: this scene is about the header's action and nothing else,
      and the rows are there so it is a list rather than a bare header. The rows
      are `view.tickets` — the same View the `ticket-list` screen shows, and
      there is no second row set to keep in step with it. The scene moved here
      from the design system, where it composed the Gin-era `ticket-row`; it now
      demonstrates no row component at all, because there is no such thing.
    items:
      - scene: design-system:shell
        with:
          overlay: ''
          content:
            - component: bb_theme:canvas
              slots:
                header:
                  - component: bb_theme:page_header
                    props:
                      title: Tickets
                      description: 24 open, 3 waiting on input
                    slots:
                      actions:
