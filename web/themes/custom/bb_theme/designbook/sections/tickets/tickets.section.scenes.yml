  - name: run-detail
    group: Action
    section: tickets
    docs: >-
      The run detail overlay, opened from the Run history zone that already sits
      in the ticket detail's body. It is not a route and not a screen of its own
      section: BB-336's gate abolished the Runs surface, and this is the one
      thing that survived it — what lets a failed or expired run be investigated
      WITHOUT OPENING A TERMINAL. That is why the error log is the centre of it,
      and why a run is reached from its ticket rather than from a list of all
      runs. A run is only ever part of a ticket here.

      READ-ONLY, and structurally so. It uses the same dialog hull as the
      create, inline-edit and cancel surfaces beside it, but it deliberately
      does NOT follow their widget grammar: no property pills, no borderless
      text lines, no submit — and NO actions slot at all, so the hull renders no
      action row. designbook/design-system/action-pattern.md binds that grammar
      to ADD, EDIT and ORGANISATION surfaces, and a read-only overlay is none of
      those (C5). The head's context segment is the ticket identifier as PLAIN
      TEXT for the same reason: a picker there would be a control on a surface
      that controls nothing.

      Underneath it is the real ticket detail, and its Run history now shows all
      FIVE run states. That is not incidental. The five have to be tellable
      apart WITHOUT COLOUR (C2), and the same frame is where the view-mode split
      is checked (C4) — the row moved to `teaser` so `full` could become this
      overlay, and a wrong view mode renders an EMPTY component instead of
      raising, so only looking at it settles the question.

      The shell is REFERENCED rather than inlined, and the band and inspector
      are aliased rather than retyped, exactly as `ticket-cancel` beside it
      does. BB-336's D1 originally copied the chrome because a referenced
      scene could not take an overlay without printing a literal placeholder;
      BB-378 removed that constraint along with `page`, so the workaround goes
      with it.

      Nothing opens or closes this. `open: true` is a prop; modality, the focus
      trap and Escape belong to the ticket that makes these dialogs interactive.
