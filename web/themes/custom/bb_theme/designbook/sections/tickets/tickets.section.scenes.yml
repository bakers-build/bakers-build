      The FILLED state of the create surface, and the head of its four: the
      other three are (empty), (rejected) and (unresolved context) below. They
      are one surface in four states rather than four sibling scenes — the
      dialog is the same dialog, and what differs is what has been typed into it
      and what the server said back. BB-332 demonstrated the grammar on these
      same four states in the design system; they moved here at the third review
      gate, because a scene of a ticket screen belongs to the tickets section
      while the written rule stays in the design system.

      This one is opened FROM THIS LIST, and that is what it adds to the
      grammar. Everything else is the agreed one without variation — two
      borderless text lines, the workflow on its own separated row above them
      because it decides the whole state flow, the remaining properties as one
      wrapping row of pills, no visible label anywhere, exactly one submit plus
      cancel — and what this scene adds is rule 8 doing its actual job: the
      context picker in the dialog head is pre-filled with bakers.build Platform,
      because that is the project the list behind the dialog is scoped to.
      Context is resolved, not routed.

      There is no assignee pill: an assignee follows from the conductor, so
      asking for it separately would be a redundant decision taken at the moment
      the operator knows least. The conductor is set here, and setting it is the
      web UI's agent affordance — so the side effect is NAMED beneath the pill
      row rather than confirmed, because the operator already chose it at the
      field.
