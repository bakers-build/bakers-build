  - name: ticket-create (rejected)
    group: Action
    section: tickets
    docs: >-
      The refusal state. The form is the FILLED form, byte for byte: this
      scene's body is emitted from the same source string as ticket-create's, so
      every typed value is provably still present — the title, the description
      and every pill value — and the contract check asserts the two bodies are
      identical rather than trusting the transcription. The server's refusal is
      rendered as a message with status error in the dialog's message slot,
      ABOVE the body, where the writer is looking. The dialog stays open. A
      rejected write must never cost the operator their typing, and any field
      change retires the message so a refusal never describes a form that no
      longer exists (action-pattern.md, level 1).

      Note which of the two notes is which. The error in the message slot is a
      REFUSAL — the write did not happen. The quiet consequence note beneath the
      pill row is a CONSEQUENCE — what will happen if the write succeeds. They
      are deliberately unlike each other in treatment, because reading one as
      the other is the mistake that made the consequence a teal status message
      in the previous iteration.

      The refusal shown is one this exact form can actually provoke — the chosen
      parent refusing a new child — and that is a requirement, not set dressing.
      Because the body is byte-equal to the filled one, an error like "title
      must not be empty" would describe a form that renders a title, i.e. an
      impossible state, and a story that shows an impossible refusal teaches the
      operator to distrust the real ones.
