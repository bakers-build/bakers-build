  - name: ticket-create (unresolved context)
    group: Action
    section: tickets
    docs: >-
      The UNRESOLVED-CONTEXT state — and note what it is not. Until BB-332 D15
      this scene was a refusal: the create action pressed with no project in
      scope opened a dialog that said "open a project to create a ticket" and
      could do nothing else, because D3 held the project as immovable context
      the way Drupal derives what can be added from the route.

      D15 dropped that. The reference contradicts it — Linear's own create
      dialog carries a Set team button AND a Change project combobox, both
      pre-filled from wherever you came from and both changeable on the spot —
      so the project is a CONTROL in the dialog, not immovable context, and this
      scene is the state where nothing filled it. The pill shows its own field
      name, Project, and asks; the message names the missing value and points at
      the control rather than telling the operator to navigate away.

      BB-420 TASK 34 MOVED THE CONTROL AGAIN, out of the dialog's head and
      into the peer pill row beside a new `team` field — "sowohl team als auch
      projekt soll eine pille sein" was the operator's own instruction. The
      state this scene depicts did not go with it: a required value can still be
      missing, the operator can still resolve it without leaving the dialog, and
      the message still names the control and points at it — only WHERE it
      points changed, from "the title above" to "below", because there is no
      longer a title holding a picker. `team` is left unset here too: it derives
      from the resolved project (see ticket-create's own docs), and an
      unresolved project resolves nothing for it either.

      The submit is disabled for a reason worth distinguishing: a REQUIRED VALUE
      IS MISSING, not "this action is unavailable here". The operator can
      resolve the first inside this dialog; the second they could only resolve
      by leaving it. Without a project a ticket would draw no bakers.build-nnn
      identifier, because allocateNumber() returns early without a project_id —
      which is why the value is required rather than merely nice. `team` is ALSO
      required, but carries no equivalent disabled-submit gate — nothing about a
      missing team stops a ticket from drawing its identifier, so an empty team
      is refused the ordinary required-field way, at submit, the same way an
      empty title already is.

      Read it against ticket-list (add action), which is the OTHER kind of
      absence: there the affordance is gone entirely, because that screen could
      not add at all. Here it is present and asking.

      Its body is emitted from the same source string as the empty scene's, so
      the two are identical but for the unresolved project pill, the team pill
      (also unset here, since it has nothing to derive from), the message and
      the disabled submit.
