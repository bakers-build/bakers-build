      state. Not a screen and not the shell: the page itself is rendered by
      BbStatsController::insights() from these components. Reference: Figma
      84:13, 95:2782, 90:1066 (designbook reference
      3a2b0e29e246a9d7/66d6d40dd8d4913e).
