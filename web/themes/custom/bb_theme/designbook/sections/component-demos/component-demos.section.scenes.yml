  - name: "markdown textarea"
    group: "Form"
    docs: >-
      A standalone demonstration of bb_theme:form_rich_text, the Markdown
      authoring control: a formatting toolbar over a plain textarea. Every
      bb_rich body field renders through it, through the bb_markdown form
      element or the bb_markdown text editor; the stored value stays the
      Markdown source the textarea holds. form_textarea stays the plain box.
    items:
      - component: "bb_theme:zone"
        props:
          inset: "none"
          direction: "fill"
          description: "The authoring control every bb_rich body field renders through: toolbar over a plain textarea; the value stays Markdown source."
        slots:
          heading: "Markdown textarea"
          content:
            - component: "bb_theme:form_label"
              props:
                for: "edit-body-value"
              slots:
                title: "Body"
            - component: "bb_theme:form_rich_text"
              props:
                id: "edit-body-value"
                name: "body[0][value]"
                rows: 6
                value: "## Steps to reproduce\n\n- Create a ticket without an assignee\n- Open `bakers ui` and export\n\nThe export **stops** at the first such ticket."
