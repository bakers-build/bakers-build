id: component-demos
title: Component Demos
description: >-
  Standalone demonstrations of generic components that are not full screens and
  not chrome — a component is delivered only if a Designbook scene reaches it
  (WORKFLOW.md), and a story alone is not a scene. This file is deliberately
  outside design-system.scenes.yml (every scene of which fills content with the
  $content placeholder, `layout-components.sh` check A4) and outside the four
  section files (every scene of which opens with its section's chrome scene,
  check A3). A component demonstrated here carries neither constraint: it is
  rendered directly, with no chrome and no canvas, because it is neither a
  screen nor part of the shell.
status: planned
group: Designbook/Sections/Component Demos
scenes:
  - name: segmented control
    group: Action
    docs: >-
      A standalone demonstration of bb_theme:segmented_control (BB-490), not a
      screen and not the shell — this scene exists only to reach the component
      itself. It renders the component in isolation with three positions and the
      middle one active, in the same order and with the same URL tokens
      BbClosedRows::buildExposedForm() renders onto the six operator listings'
      closed-rows filter (open → only → all).


      Generic by construction. The component knows label and items — nothing
      about tickets, runs, conductors or the word "closed" — so this scene's
      sample labels (Open / Closed / All) are one caller's choice of words, not
      a fact the component encodes.


      Not a reuse of tabs. tabs is bound to page_header's tabs slot and switches
      the subject of an entity page; this component filters the list it sits
      beside and is never placed in that slot. Two components, two meanings, one
      aria-current contract each.
    items:
      - component: bb_theme:segmented_control
        props:
          label: Closed rows
          items:
            - label: Open
              url: '?closed=open'
              active: false
            - label: Closed
              url: '?closed=only'
              active: true
            - label: All
              url: '?closed=all'
              active: false
