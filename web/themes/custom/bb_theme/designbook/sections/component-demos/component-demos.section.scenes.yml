  - name: autosave toast
    group: Data Display
    docs: >-
      A standalone demonstration of bb_theme:toast, the fixed bottom-right
      confirmation for a short status such as `Saved`. It is one element with no
      children, so a script can rewrite its text, role and hidden attribute in
      place. No product screen renders it today: the Settings forms save on an
      explicit Save and confirm with Drupal's status message. With an empty
      message it renders hidden.
    items:
      - component: bb_theme:toast
        props:
          message: Saved
  - name: copied overlay
    group: Data Display
    docs: >-
      A standalone demonstration of bb_theme:copied, the absolutely positioned
      copy confirmation rendered as an opaque button, just below the Copy
      control. The parent supplies `relative`; this scene names the overlay
      itself so a story of setup_command is not the only reach. Empty message
      renders hidden. Distinguishes from toast, which is viewport-fixed.
    items:
      - component: bb_theme:copied
        props:
          message: Copied
  - name: setup paths
    group: Action
    docs: >-
      A standalone demonstration of bb_theme:setup_paths, the generic
      two-position panel switcher. The wrapper owns Alpine `selected` state and
      the Agent segmented filter; the two panels switch in place by position. A
      story of setup_command or segmented_control is not this composition.
    items:
      - component: bb_theme:setup_paths
        props:
          selected: claude
          filter_label: Agent
          items:
            - label: Claude Code
              value: claude
            - label: Codex
              value: codex
        slots:
          intro:
            - component: bb_theme:text
              props:
                text: 'Install the bakers.build plugin first:'
                size: caption
                tone: light
          panel_a:
            - component: bb_theme:setup_command
              props:
                command: /plugin install bakers@bakers
                label: Copy the plugin install command
          panel_b:
            - component: bb_theme:setup_command
              props:
                command: codex plugin add bakers@bakers
                label: Copy the Codex plugin install command
          after:
            - component: bb_theme:setup_command
              props:
                command: >-
                  Use `bakers:bb-init` to guide me through installing and setting
                  up bakers.build.
                label: Copy the skill wizard prompt
  - name: inline add row
    group: Layout
    docs: >-
      A standalone demonstration of bb_theme:zone with `direction: fill`: the
      member add/invite control of the workspace and team Members tabs
      (GroupMembersForm). The field takes the remaining width and the submit
      keeps its own width on one line, aligned to the bottom edge so it lines up
      with the input rather than with the label.
    items:
      - component: bb_theme:zone
        props:
          inset: none
          direction: fill
          description: Only people who already belong to this workspace can join the team.
        slots:
          heading: Add a member
          content:
            - component: bb_theme:zone
              props:
                inset: none
                gap: none
              slots:
                content:
                  - component: bb_theme:form_label
                    props:
                      for: edit-account
                    slots:
                      title: Member
                  - component: bb_theme:form_input
                    props:
                      name: account
                      id: edit-account
                      value: ''
                      placeholder: Search by name
            - component: bb_theme:button
              props:
                variant: primary
                type: submit
                label: Add member
  - name: ticket-inspector (billing)
    group: Data Display
    docs: >-
      THE BILLING ROWS OF THE TICKET INSPECTOR (BB-666), in four states, as a
      demonstration: the rows live in the inspector of the ticket screen,
      rendered by the `bb_track_ticket_billing` source. Billing names the
      account recorded time on this ticket is booked to; Source says where it
      comes from: `linked` (this ticket links it), `from <identifier>` (the
      nearest ancestor that links one) or `project default`. Source is its own
      row because beside the picker the narrow rail would wrap it.


      AN EDITOR PICKS, A VIEWER READS. A project editor gets a picker of the
      project's linkable accounts — active and not the default — plus Inherit,
      which removes only this ticket's link, and saves with Save billing
      account. Everyone else who can view the ticket reads the same rows as
      text. The default is never offered: it is what Inherit falls back to.
    items:
      - component: bb_theme:zone
        props:
          gap: lg
          columns: 2
          description: >-
            Editors pick an account or Inherit; viewers read the same rows
            without a picker
        slots:
          heading: Billing rows of the ticket inspector
          content:
            - component: bb_theme:inspector
              slots:
                rows:
                  - component: bb_theme:list
                    props:
                      layout: plain
                      items:
                        - cells:
                            label:
                              kind: text
                              value: Labels
                              emphasis: faint
                            value:
                              kind: text
                              value: backend, ui
                        - cells:
                            label:
                              kind: text
                              value: Billing
                              emphasis: faint
                            value:
                              kind: picker
                              label: Billing account
