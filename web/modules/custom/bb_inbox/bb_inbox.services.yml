parameters:
  # How long bakers_inbox_send waits for the conductor's answer.
  bb_inbox.send_wait_seconds: 30
services:
  bb_inbox.sender:
    class: Drupal\bb_inbox\InboxSender
    arguments: ['@entity_type.manager', '@event_dispatcher', '@bb_core.conductor_registrar']
  Drupal\bb_inbox\InboxSender: '@bb_inbox.sender'
  bb_inbox.message_contract_validator:
    class: Drupal\bb_inbox\MessageContractValidator
  Drupal\bb_inbox\MessageContractValidator: '@bb_inbox.message_contract_validator'
