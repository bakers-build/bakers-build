# Create dialogs. The `dialog` key makes bb_create_action render an action as
# the shell page header's round plus (core's local actions block is not
# placed on these screens). `dialog` options: `query` (screen keys forwarded,
# `*` for all), `route_query` (dialog key => screen route parameter, sent as
# its id), `trigger_id` (element id for focus return).
bb_core.create.ticket:
  route_name: entity.bb_ticket.create_form
  title: 'New ticket'
  appears_on:
    - view.tickets.my_work
    - view.tickets.page_1
    - view.tickets.project_tickets
    - view.tickets.team_tickets
  dialog:
    query: ['*']
    route_query:
      project: bb_project

bb_core.create.project:
  route_name: entity.bb_project.create_form
  title: 'New project'
  appears_on: [view.projects.workspace_list]
  dialog: {}

bb_core.create.ticket_template_project:
