  route_name: view.runs.project_runs
  base_route: entity.bb_project.canonical
  weight: 4

view.conductors.project_list:
  title: 'Conductors'
  route_name: view.conductors.project_list
  base_route: entity.bb_project.canonical
  weight: 5

view.bb_ticket_templates.project_list:
  title: 'Templates'
  route_name: view.bb_ticket_templates.project_list
  base_route: entity.bb_project.canonical
  weight: 5.5

bb_core.bb_project.settings:
  title: 'Settings'
  route_name: bb_core.bb_project.settings
  base_route: entity.bb_project.canonical
  weight: 6

