entity.bb_machine.canonical:
  title: 'View'
  route_name: entity.bb_machine.canonical
  base_route: entity.bb_machine.canonical
  weight: 0

bb_core.bb_machine.settings:
  title: 'Settings'
  route_name: bb_core.bb_machine.settings
  base_route: entity.bb_machine.canonical
  weight: 6

# --- Conductor: Overview, Settings ---
