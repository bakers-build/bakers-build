# Static tab rows for My work, project, team and workspace settings; project
# and team need bundle-free rows with no view/edit pair.
#
# The default tab of each row (Overview) is not a route of its own: it names
# the entity's own canonical route as both `route_name` and `base_route`,
# which is what makes it render on `/{ws}/project/{id}` itself rather than a
# `/overview` suffix.

# --- My work: Tickets, My time, Stats ---
# Tickets is NOT declared here: the `my_work` Views page display owns it as its
# own `default tab`, which is what puts the tab row on `/{ws}/tickets` without
# moving the page My work opens on. My time (weight 1, bb_track) sits between
# that default tab (weight 0) and Stats. Stats must weigh more than My time or
# the two share a weight and discovery order puts Stats first.

bb_core.my_work.stats:
  title: 'Stats'
  route_name: bb_core.my_work.stats
  base_route: view.tickets.my_work
  weight: 2

# --- Workspace Insights: Overview; Billing report (weight 1) is bb_track's ---

bb_core.workspace.insights:
  title: 'Overview'
  route_name: bb_core.workspace.insights
  base_route: bb_core.workspace.insights
  weight: 0

# --- Project: Overview, Board, Stats, Tickets, Runs, Conductors, Settings ---
# No Members tab: a project carries no membership of its own.

entity.bb_project.canonical:
