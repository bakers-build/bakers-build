# Static tab rows for My work, project, team and workspace settings; project
# and team need bundle-free rows with no view/edit pair.
#
# The default tab of each row (Overview) is not a route of its own: it names
# the entity's own canonical route as both `route_name` and `base_route`,
# which is what makes it render on `/{ws}/project/{id}` itself rather than a
# `/overview` suffix.

# --- My work: Tickets, My time, Stats ---
# Tickets is NOT declared here: the `my_work` Views page display owns it as its
# own `default tab`, which is what puts the tab row on `/{ws}/tickets` without
# moving the page My work opens on. My time (weight 1, bb_track) sits between
# that default tab (weight 0) and Stats. Stats must weigh more than My time or
# the two share a weight and discovery order puts Stats first.

bb_core.my_work.stats:
  title: 'Stats'
  route_name: bb_core.my_work.stats
  base_route: view.tickets.my_work
  weight: 2

# --- Workspace Insights: Overview; Billing report (weight 1) is bb_track's ---

bb_core.workspace.insights:
  title: 'Overview'
  route_name: bb_core.workspace.insights
  base_route: bb_core.workspace.insights
  weight: 0

# --- Project: Overview, Board, Stats, Tickets, Runs, Conductors, Settings ---
# No Members tab: a project carries no membership of its own.

entity.bb_project.canonical:
  title: 'Overview'
  route_name: entity.bb_project.canonical
  base_route: entity.bb_project.canonical
  weight: 0

bb_core.bb_project.stats:
  title: 'Stats'
  route_name: bb_core.bb_project.stats
  base_route: entity.bb_project.canonical
  weight: 2

view.tickets.project_tickets:
  title: 'Tickets'
  route_name: view.tickets.project_tickets
  base_route: entity.bb_project.canonical
  weight: 3

view.runs.project_runs:
  title: 'Runs'
  route_name: view.runs.project_runs
  base_route: entity.bb_project.canonical
  weight: 4

view.conductors.project_list:
  title: 'Conductors'
  route_name: view.conductors.project_list
  base_route: entity.bb_project.canonical
  weight: 5

view.bb_ticket_templates.project_list:
  title: 'Templates'
  route_name: view.bb_ticket_templates.project_list
  base_route: entity.bb_project.canonical
  weight: 5.5

# A project's environments, edited in the dialog from their row.
view.bb_environments.project_list:
  title: 'Environments'
  route_name: view.bb_environments.project_list
  base_route: entity.bb_project.canonical
  weight: 5.7

bb_core.bb_project.settings:
  title: 'Settings'
  route_name: bb_core.bb_project.settings
  base_route: entity.bb_project.canonical
  weight: 6

# --- Ticket template: Overview, Settings ---
# Settings is the edit form as a page; nothing edits a template in a dialog.

entity.bb_ticket_template.canonical:
  title: 'Overview'
  route_name: entity.bb_ticket_template.canonical
  base_route: entity.bb_ticket_template.canonical
  weight: 0

entity.bb_ticket_template.edit_form:
  title: 'Settings'
  route_name: entity.bb_ticket_template.edit_form
  base_route: entity.bb_ticket_template.canonical
  weight: 1

# --- Machine: View, Settings ---
# Product tabs in the user area. View's cards only show the machine; Settings
