# bakers.build's admin-backend menu links (`/admin/bakers/*`), and (below) the
# `bakers-rail`/`bakers-account` navigation menus. Each rail/account entry is
# declared by the module owning its route or supplying its View. Links to
# Drupal core routes (Account, Log out) are declared here as the exception.
bb_core.admin:
  title: 'bakers.build'
  description: 'Manage bakers.build control-plane entities.'
  parent: system.admin
  route_name: bb_core.admin
  weight: 0

entity.bb_workspace.collection:
  title: 'Workspaces'
  description: 'Workspace roots for multi-workspace tenancy.'
  parent: bb_core.admin
  route_name: entity.bb_workspace.collection
  weight: -2

entity.bb_team.collection:
  title: 'Teams'
  description: 'Crews that cut across customer projects.'
  parent: bb_core.admin
  route_name: entity.bb_team.collection
  weight: -1

entity.bb_machine.collection:
  title: 'Machines'
  description: 'Host capacity for concurrent conductor runs.'
  parent: bb_core.admin
  route_name: entity.bb_machine.collection
  weight: -0.5

entity.bb_group.collection:
  title: 'Groups'
  parent: bb_core.admin
  route_name: entity.bb_group.collection
  weight: 0

entity.bb_project.collection:
  title: 'Projects'
  parent: bb_core.admin
  route_name: entity.bb_project.collection
  weight: 1

entity.bb_ticket.collection:
  title: 'Tickets'
  parent: bb_core.admin
  route_name: entity.bb_ticket.collection
  weight: 2

entity.bb_conductor.collection:
  title: 'Conductors'
  parent: bb_core.admin
  route_name: entity.bb_conductor.collection
  weight: 3

entity.bb_run.collection:
  title: 'Runs'
  parent: bb_core.admin
  route_name: entity.bb_run.collection
  weight: 4

bb_core.settings:
  title: 'Settings'
  description: 'Claim lease bounds and failed-run retry policy.'
  parent: bb_core.admin
  route_name: bb_core.settings
  weight: 5

# Composite statistics configuration.
entity.bb_figure.collection:
  title: 'Statistics'
  description: 'Atomic statistics figures composed from reusable measurements.'
  parent: bb_connector.config
  route_name: entity.bb_figure.collection
  weight: 1

entity.bb_measurement.collection:
  title: 'Measurements'
  description: 'Reusable statistics calculations.'
  parent: entity.bb_figure.collection
  route_name: entity.bb_measurement.collection
  weight: 0

entity.bb_figure_group.collection:
  title: 'Figure groups'
  description: 'Titled and ordered statistics sections.'
  parent: entity.bb_figure.collection
  route_name: entity.bb_figure_group.collection
  weight: 2

# --- bakers-rail ---------------------------------------------------------------
# Rendered by `BbMenuSource`. `WorkspaceMenuLink` supplies `bb_workspace`
# from the ambient workspace; without one the link is hidden.
bb_core.rail.my_work:
  title: 'My work'
  route_name: view.tickets.my_work
  menu_name: bakers-rail
  class: '\Drupal\bb_core\Plugin\Menu\WorkspaceMenuLink'
  weight: 0
  options:
    icon: ticket

bb_core.rail.groups:
  title: 'Groups'
  route_name: view.groups.workspace_list
  menu_name: bakers-rail
  class: '\Drupal\bb_core\Plugin\Menu\WorkspaceMenuLink'
  weight: 1
  options:
    icon: dashboard

bb_core.rail.projects:
  title: 'Projects'
  route_name: view.projects.workspace_list
  menu_name: bakers-rail
  class: '\Drupal\bb_core\Plugin\Menu\WorkspaceMenuLink'
  weight: 2
  options:
    icon: project

# Shown only on a route that carries a project.
bb_core.rail.project_tickets:
  title: 'Tickets'
  route_name: view.tickets.project_tickets
  parent: bb_core.rail.projects
  menu_name: bakers-rail
  class: '\Drupal\bb_core\Plugin\Menu\WorkspaceMenuLink'
  weight: 0
  metadata:
    route_parameters_from_route: [bb_project]
  options:
    icon: ticket

# Shown only to whom the route admits: the workspace's leads.
bb_core.rail.insights:
  title: 'Insights'
  route_name: bb_core.workspace.insights
  menu_name: bakers-rail
  class: '\Drupal\bb_core\Plugin\Menu\WorkspaceMenuLink'
  weight: 3
  options:
    icon: report
    # The Billing report tab (bb_track) is a page of Insights too.
    active_routes: [bb_track.workspace.insights_billing]

bb_core.rail.settings:
  title: 'Settings'
  route_name: bb_core.bb_workspace.settings
  menu_name: bakers-rail
  class: '\Drupal\bb_core\Plugin\Menu\WorkspaceMenuLink'
  weight: 4
  options:
    icon: settings

# A heading without a destination. `bb_children: teams` makes
# `BbMenuSource` fill it with the ambient workspace's teams and the team
# create action at render time.
bb_core.rail.teams_heading:
  title: 'Teams'
  route_name: '<nolink>'
  menu_name: bakers-rail
  class: '\Drupal\bb_core\Plugin\Menu\WorkspaceMenuLink'
  weight: 5
  options:
    icon: team
    heading: true
    open: true
    bb_children: teams

# --- bakers-account ------------------------------------------------------------
# Placed instead of bakers-rail on account-area routes (`bb_user_area_route`).
bb_core.account.back_to_workspace:
  title: 'Back to workspace'
  route_name: view.tickets.my_work
  menu_name: bakers-account
  class: '\Drupal\bb_core\Plugin\Menu\WorkspaceMenuLink'
  weight: -10
  options:
    icon: arrow-left
    full_page: true

bb_core.account.profile:
  title: 'Account'
  route_name: entity.user.canonical
  menu_name: bakers-account
  class: '\Drupal\bb_core\Plugin\Menu\AccountMenuLink'
  weight: 0
  options:
    icon: settings
    active_routes: [entity.user.edit_form, bb_core.user.profile]

bb_core.account.conductors:
  title: 'Conductors'
  route_name: view.conductors.user_list
  menu_name: bakers-account
  class: '\Drupal\bb_core\Plugin\Menu\AccountMenuLink'
  weight: 4
  options:
    icon: conductor

bb_core.account.machines:
  title: 'Machines'
  route_name: view.machines.user_list
  menu_name: bakers-account
  class: '\Drupal\bb_core\Plugin\Menu\AccountMenuLink'
  weight: 5
  options:
    icon: machine
    active_routes: [entity.bb_machine.canonical]

bb_core.account.workspaces:
  title: 'Workspaces'
  route_name: bb_core.home
  menu_name: bakers-account
  class: '\Drupal\bb_core\Plugin\Menu\AccountMenuLink'
  weight: 10
  metadata:
    owner_only: true
  options:
    icon: dashboard
    full_page: true
    at_end: true

bb_core.account.logout:
  title: 'Log out'
  route_name: user.logout.confirm
  menu_name: bakers-account
  class: '\Drupal\bb_core\Plugin\Menu\AccountMenuLink'
  weight: 20
  metadata:
    owner_only: true
  options:
    icon: log-out
    full_page: true
