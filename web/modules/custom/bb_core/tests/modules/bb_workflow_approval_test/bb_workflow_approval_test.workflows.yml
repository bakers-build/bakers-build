# A state whose `approval` is outside the vocabulary, so TypeWorkflows can be
# shown to reject it. Its own group keeps it out of every ticket listing.
bb_approval_test:
  id: bb_approval_test
  group: bb_approval_test
  label: 'Approval test'
  states:
    open: { label: Open, phase: prepare, approval: sometimes }
    closed: { label: Closed, phase: done }
  transitions:
    close: { label: Close, from: [open], to: closed }
