# The picker widget. This settings mapping is what makes a form display, rather than a form
# class, decide how one field of a `bb_theme:form` surface presents itself:
# which region it renders in, what the pill is called, which query parameter
# it opens on, and — for a field whose value has a server-authored side
# effect — the sentence that names that effect at the control
# (`action-pattern.md` rule 9). A second create surface is a second form
# display configuring this same plugin.
field.widget.settings.bb_picker:
  type: mapping
  label: 'bakers.build picker settings'
  mapping:
    picker_region:
      type: string
      label: 'Picker region: context, lead or pills'
    label:
      type: label
      label: 'Field name shown on the pill'
    icon:
      type: string
      label: 'Leading sprite symbol'
    searchable:
      type: boolean
      label: 'Render the panel search box'
    selected_chips:
      type: boolean
      label: 'Render each selected value as a removable chip'
    fallback:
      type: boolean
      label: 'Render a no-JavaScript fallback on full pages'
    clear_label:
      type: label
      label: 'Clear row label, or empty for no clear row'
    create_label:
      type: label
      label: 'Create row noun, or empty for no create row'
    context_parameter:
      type: string
      label: 'Query parameter this field opens on'
    default_value:
      type: string
      label: 'Value this field opens on, absent any other'
    note_lead:
      type: label
      label: 'Note lead word, or empty for no note'
    note_prefix:
      type: label
      label: 'Note text before the value'
    note_suffix:
      type: label
      label: 'Note text after the value'
    selection_handler:
      type: string
      label: "Selection handler replacing the field's own, or empty"

# The bb_markdown text editor has no settings; editor.editor.* is
# FullyValidatable, so its settings need a schema even when empty.
editor.settings.bb_markdown:
  type: mapping
  label: 'bakers.build Markdown toolbar settings'
  mapping: {  }
