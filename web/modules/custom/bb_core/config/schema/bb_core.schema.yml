      type: string
      label: 'Machine name'
    label:
      type: label
      label: 'Label'

bb_core.bb_measurement.*:
  type: config_entity
  label: 'bakers.build measurement'
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Label'
    value_type:
      type: string
      label: 'Value type'
      constraints:
        Choice:
          choices: [integer, decimal]
    unit:
      type: string
      label: 'Unit'
    source:
      type: mapping
      label: 'Source query'
      mapping:
        entity_type:
          type: string
          label: 'Source entity type'
          requiredKey: false
        time_field:
          type: string
          label: 'Time field'
          requiredKey: false
    operation:
      type: mapping
      label: 'Aggregate or derived operation'
      mapping:
        type:
          type: string
          label: 'Operation type'
          constraints:
            Choice:
              choices: [count, sum, avg, count_over, divide, open]
        field:
          type: string
          label: 'Summed or averaged source field'
          requiredKey: false
        end_field:
          type: string
          label: 'Source field that ends an open span'
          requiredKey: false
        related:
          type: mapping
          label: 'Related entities counted per source entity'
          requiredKey: false
          mapping:
            entity_type:
              type: string
              label: 'Related entity type'
            field:
              type: string
              label: 'Reference field on the related entity'
        threshold:
          type: integer
          label: 'Related count that must be exceeded'
          requiredKey: false
        numerator:
          type: string
          label: 'Numerator measurement'
          requiredKey: false
        denominator:
          type: string
          label: 'Denominator measurement'
          requiredKey: false
    predicates:
      type: sequence
      label: 'Fixed predicates'
      sequence:
        type: mapping
        mapping:
          field:
            type: string
            label: 'Field'
          operator:
            type: string
            label: 'Operator'
          value:
            # `ignore` rather than `boolean`: a predicate value is field-typed
            # — `closed = true` is a boolean, `state = done` is a string — and
            # the query hands it straight to condition() either way.
            type: ignore
            label: 'Predicate value'
    bindings:
      type: sequence
      label: 'Context query bindings'
      sequence:
        type: mapping
        mapping:
          field:
            type: string
            label: 'Query field'
          resolver:
            type: string
            label: 'Binding resolver'
            constraints:
              Choice:
                choices: [entity_id, epic_subtree, team_projects, workspace_projects]
    dimensions:
      type: sequence
      label: 'Breakdown dimensions by category key'
      sequence:
        type: mapping
        mapping:
          field:
            type: string
            label: 'Dimension field'
          entity_type:
            type: string
            label: 'Label entity type'
            # Omitted for a SCALAR dimension (a run's model or state), whose
            # grouped value is its own key and label with no entity to load.
            requiredKey: false

bb_core.bb_figure.*:
  type: config_entity
  label: 'bakers.build figure'
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Label'
    description:
      type: text
      label: 'Description'
    weight:
      type: integer
      label: 'Weight'
    widget:
      type: string
      label: 'Widget'
      constraints:
        Choice:
          choices: [matrix, line, grouped_horizontal_bars, flow, tiles, table, bars]
    measurements:
      type: sequence
      label: 'Ordered measurement IDs'
      sequence:
        type: string
    categories:
      type: mapping
      label: 'Category definition'
      mapping:
        type:
          type: string
          label: 'Category type'
          constraints:
            Choice:
              choices: [windows, days, months, dimension, total]
        values:
          type: sequence
          label: 'Fixed category values'
          requiredKey: false
          sequence:
            type: string
        dimension:
          type: string
          label: 'Dimension key'
          requiredKey: false
        fill:
          type: boolean
          label: 'List every project in scope, also without values'
          requiredKey: false
    series:
      type: mapping
      label: 'Series source'
      requiredKey: false
      mapping:
        dimension:
          type: string
          label: 'Dimension key'
          requiredKey: false
        limit:
          type: integer
          label: 'Individually shown series'
          requiredKey: false
    ratio:
      type: mapping
      label: 'Ratio of two measurement totals over complete categories'
      requiredKey: false
      mapping:
        numerator:
          type: string
          label: 'Numerator measurement'
        denominator:
          type: string
          label: 'Denominator measurement'
    filters:
      type: sequence
      label: 'Exposed filters'
      sequence:
        type: mapping
        mapping:
          label:
            type: label
            label: 'Filter label'
          type:
            type: string
            label: 'Filter type; entities selects epic, project, team or user entities'
            requiredKey: false
            constraints:
              Choice:
                choices: [entities]
          binding:
            type: string
            label: 'Measurement binding an entity filter restricts'
            requiredKey: false
            constraints:
              Choice:
                choices: [epic, project, team, user]
          default:
            type: string
            label: 'Default value'
            requiredKey: false
            constraints:
              Choice:
                choices: [week, month, quarter, year, all, custom]
          options:
            type: sequence
            label: 'Allowed values'
            requiredKey: false
            sequence:
              type: mapping
              mapping:
                value:
                  type: string
                  label: 'Value'
                  constraints:
                    Choice:
                      choices: [week, month, quarter, year, all, custom]
                label:
                  type: label
                  label: 'Label'
    context_shape:
      type: sequence
      label: 'Exact route context keys'
      sequence:
        type: string
    conditions:
      type: sequence
      label: 'Applicability conditions'
      sequence:
        type: condition.plugin.[id]

bb_core.bb_figure_group.*:
  type: config_entity
  label: 'bakers.build figure group'
  mapping:
