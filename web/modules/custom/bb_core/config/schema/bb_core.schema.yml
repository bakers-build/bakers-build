      label: Icon
    tone:
      type: string
      label: Tone
    singular:
      type: label
      label: Singular tooltip
    plural:
      type: label
      label: Plural tooltip

bb_core.settings:
  type: config_object
  label: 'bakers.build core settings'
  mapping:
    plugin_source_base:
      type: string
      label: 'Plugin source base URL (git group prefix)'
    min_client_version:
      type: string
      label: 'Minimum bakers CLI version (semver) allowed to claim work'

bb_core.bb_vocabulary.*:
  type: config_entity
  label: 'bakers.build vocabulary'
  mapping:
    id:
      type: string
      label: 'Machine name'
