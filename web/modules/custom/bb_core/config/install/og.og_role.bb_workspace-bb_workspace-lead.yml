# bakers.build workspace OG role: lead, labelled "Admin" (the id is kept to avoid a
# strict-list rename).
#
# Administers one workspace: members, projects, groups, teams, environments,
# the deletes, and OG's `update group` / `manage members`. The workspace owner
# needs no rank: `group_manager_full_access` already grants owner_user_id
# every permission. `create`/`delete any bb_workspace` stay off every rank;
# a tenancy is an instance act (`administer bakers`).
#
# `register bakers conductor` is needed because every conductor re-registers
# (an upsert), and the update path is fenced by rank. Per-user (`by_user`)
# figures stay team-lead only.
#
# Shipped in its saved form, key for key.
langcode: en
status: true
dependencies:
  module:
    - bb_core
id: bb_workspace-bb_workspace-lead
label: 'Admin'
weight: 2
group_id: null
group_type: bb_workspace
group_bundle: bb_workspace
is_admin: false
permissions:
  - 'access bakers dashboard'
  - 'claim bakers tickets'
  - 'create bb_comment'
  - 'create bb_environment'
