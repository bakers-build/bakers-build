# BB-658 Task 3 — loopback proxy in front of the dropsh MCP process.
#
# The MCP plugin (verified source, plugins/mcp/src/transports.ts at the pinned
# commit) hardcodes its listener to 127.0.0.1 and requires the inbound Host
# header to equal "127.0.0.1:8787" exactly. This nginx runs in the SAME
# container (same network namespace) so it can reach that loopback address,
# and it rewrites Host to the literal the plugin demands — the public Host
# (bakers-develop.dev2.keytec.de, app.bakers.build, …) is never forwarded as-is.
#
# Streamable HTTP: no buffering, no chunked transformation, Authorization
# passed through verbatim (never touched, never substituted).
server {
    listen 8080;
    server_name _;

    location /mcp {
        # BB-658 review F5: MCP auth is the authorizing user's bearer,
        # forwarded verbatim below — but a missing bearer previously still
        # reached dropsh as an anonymous request instead of failing the HTTP
        # entry point. Reject it here with the RFC 9728 challenge pointing at
        # this host's protected-resource metadata; $host is the client's
        # original inbound Host (the public domain), read before the
        # Host-rewrite below.
        if ($http_authorization = "") {
            add_header WWW-Authenticate 'Bearer resource_metadata="https://$host/.well-known/oauth-protected-resource"' always;
            return 401;
        }

        proxy_pass http://127.0.0.1:8787/mcp;
        proxy_http_version 1.1;

        proxy_set_header Host "127.0.0.1:8787";
        proxy_set_header Origin "";
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;
    }

    location / {
        return 404;
    }
}
