# Apply after docker-compose.yml and docker-compose.traefik.yml.
# Existing Komodo stacks do not load this overlay.
x-runtime: &runtime
  BB_SELF_HOSTED: "1"
  DOMAIN: ${DOMAIN:?Set DOMAIN to the public DNS hostname}
  DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:?Set a private random DRUPAL_HASH_SALT}
  DRUPAL_TRUSTED_PROXY_SUBNET: ${TRAEFIK_SUBNET:?Set an unused private IPv4 subnet for ingress}
  DB_NAME: ${DB_NAME:?Set DB_NAME}
  DB_USER: ${DB_USER:?Set DB_USER}
  DB_PASSWORD: ${DB_PASSWORD:?Set a private DB_PASSWORD}
  MAIL_SMTP_DSN: ${MAIL_SMTP_DSN:?Set the SMTP DSN for passwordless sign-in}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set MAIL_FROM_ADDRESS}

services:
  init-perms:
    image: alpine:3.22.2
    volumes:
      - acme:/acme
  db:
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set a private DB_ROOT_PASSWORD}
  install:
    image: ${REGISTRY_IMAGE_PHP:?Set the published PHP release image}
    environment: *runtime
  deploy:
    image: ${REGISTRY_IMAGE_PHP:?Set the published PHP release image}
    environment: *runtime
  php:
    image: ${REGISTRY_IMAGE_PHP:?Set the published PHP release image}
    environment: *runtime
  cron:
    image: ${REGISTRY_IMAGE_PHP:?Set the published PHP release image}
    environment: *runtime
    volumes:
      - oauth_keys:/var/www/oauth-keys
  nginx:
    image: ${REGISTRY_IMAGE_NGINX:?Set the matching published Nginx release image}
    labels:
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_ingress"
      - "traefik.http.routers.${STACK_NAME:?Set a unique STACK_NAME}.rule=Host(`${DOMAIN}`)"
    environment:
      NGINX_ERROR_LOG_LEVEL: warn
  traefik:
    image: ${TRAEFIK_IMAGE:?Set a versioned Traefik image}
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME}`)
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set the ACME contact email}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --api.dashboard=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme
    networks:
      - traefik_proxy

volumes:
  acme:

networks:
  traefik_proxy:
    external: false
    name: ${COMPOSE_PROJECT_NAME}_ingress
    ipam:
      config:
        - subnet: ${TRAEFIK_SUBNET}
