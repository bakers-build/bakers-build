# Exact `=` beats the `^~ /.well-known/` prefix in defaults.conf, so these two
# discovery documents reach Drupal; everything else under /.well-known/ is
# still served statically.
location = /.well-known/oauth-authorization-server {
    try_files $uri @drupal;
}

location = /.well-known/oauth-protected-resource {
    try_files $uri @drupal;
}

# Open dynamic client registration (RFC 7591) on a public host: rate-limited so it
# cannot be flooded. The zone is defined in oauth-register-zone.conf.
location = /oauth/register {
    limit_req zone=oauth_register burst=5 nodelay;
    limit_req_status 429;
    try_files $uri @drupal;
}
