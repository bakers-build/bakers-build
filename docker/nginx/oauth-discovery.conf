# Exact `=` beats the `^~ /.well-known/` prefix in defaults.conf, so these two
# discovery documents reach Drupal; everything else under /.well-known/ is
# still served statically.
location = /.well-known/oauth-authorization-server {
    try_files $uri @drupal;
}

location = /.well-known/oauth-protected-resource {
    try_files $uri @drupal;
}
