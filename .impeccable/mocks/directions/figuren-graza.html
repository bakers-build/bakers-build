<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Figuren · Graza-Stil</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Spline+Sans+Mono:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F5EBDA;color:#2B2116;font:500 14px "Spline Sans Mono",monospace;padding:30px 48px}
.row{display:flex;align-items:flex-end;gap:44px;padding:28px 0 34px;border-bottom:1.5px dashed rgba(43,33,22,.35)}
h2{font:400 36px "Instrument Serif",serif;width:250px;align-self:center}h2 small{display:block;font:500 13px "Spline Sans Mono";margin-top:6px;line-height:1.5}
.f{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.f em{font-style:normal;position:absolute;font-size:12px;transform:rotate(-8deg)}
.band{background:#BFE07A;display:flex;gap:28px;padding:22px 48px;margin:0 -48px;align-items:flex-end}</style></head><body>
<script src="bakers-graza.js"></script>
<div class="row"><h2>Backwaren<small>Laib, Croissant, Brötchen.<br>Augen schauen zur Arbeit,<br>kein Mund.</small></h2>
<div class="f"><svg width="190" height="190" style="--bake:#D7A04E"><use href="#gb-spec"/></svg>Spec<em style="right:-16px;top:40px">*notes*</em></div>
<div class="f"><svg width="190" height="190" style="--bake:#C9843F"><use href="#gb-coding"/></svg>Coding<em style="right:0;top:20px">*tap tap*</em></div>
<div class="f"><svg width="190" height="190" style="--bake:#B8692E"><use href="#gb-review"/></svg>Review<em style="left:-10px;top:30px">*hmm*</em></div></div>
<div class="row"><h2>Bäcker, neu<small>kleinere Haube, dunkler Kittel,<br>gleiche Augen, kein Mund.</small></h2>
<div class="f"><svg width="150" height="189"><use href="#gp-spec"/></svg>Spec</div>
<div class="f"><svg width="150" height="189"><use href="#gp-coding"/></svg>Coding</div>
<div class="f"><svg width="150" height="189"><use href="#gp-review"/></svg>Review</div></div>
<div class="band"><svg width="44" height="44" style="--bake:#D7A04E"><use href="#gb-spec"/></svg><svg width="44" height="44" style="--bake:#C9843F"><use href="#gb-coding"/></svg><svg width="44" height="44" style="--bake:#B8692E"><use href="#gb-review"/></svg>
<span style="align-self:center">so klein als Avatar in App und Board</span></div>
</body></html>
