<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:#fff;color:#111827;font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 64px}.brand{font-weight:700;font-size:26px}

.shot{margin:40px auto 0;width:1100px;height:420px;border-radius:16px;background:linear-gradient(135deg,#eef2ff,#e0e7ff);box-shadow:0 30px 80px rgba(37,99,235,.18)}

<div class="top"><div class="brand">bakers build</div><div class="demo">Demo buchen</div></div>
