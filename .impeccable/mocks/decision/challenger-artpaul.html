<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;background:#fff;color:#111;font-family:Georgia,serif;overflow:hidden}
.mast{display:flex;justify-content:space-between;align-items:flex-end;padding:30px 60px 18px;border-bottom:6px solid #111}
.mast h2{font-size:64px;font-weight:700;letter-spacing:-.01em}.demo{font-family:"Helvetica Neue",Arial;background:#E8452C;color:#fff;font-weight:700;font-size:22px;padding:14px 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:40px 60px}
.drop{font-size:220px;line-height:.8;float:left;margin-right:16px;color:#E8452C}
.col h1{font-size:64px;line-height:1.02}.col p{font-size:24px;line-height:1.4;margin-top:20px}
.art{height:620px;background:#E8452C;position:relative}
.mark{position:absolute;right:70px;bottom:90px;width:46px;height:46px;border-radius:50%;background:#111}
.art .shape{position:absolute;left:80px;top:90px;width:340px;height:340px;border-radius:50%;background:#fff}
</style></head><body>
<div class="mast"><h2>bakers build</h2><span class="demo">Demo vereinbaren →</span></div>
<div class="grid"><div class="col"><span class="drop">K</span><h1>KI, die liefert, was bestellt wurde.</h1><p>Agenten arbeiten Tickets ab, Menschen nehmen sie ab. Ein Werkzeug für Teams, die Kontrolle behalten wollen.</p></div><div class="art"><div class="shape"></div><div class="mark"></div></div></div>
</body></html>
