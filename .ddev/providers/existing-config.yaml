# Project-owned default: install committed config/sync without recipes or content seeds.
db_import_command:
  command: |
    set -u
    LOG=/var/www/html/.ddev/.bakers-test/init-existing-config.log
    mkdir -p /var/www/html/.ddev/.bakers-test
    (
      set -ex
      drush site:install --existing-config -y
    ) >"${LOG}" 2>&1
    rc=$?
    cat "${LOG}" || true
    exit "${rc}"
