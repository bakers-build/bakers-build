#ddev-generated
# Anonymized DB round-trip through the GitLab generic Package Registry (keytec).
# Coordinates come from PROVIDERS_REGISTRY_* (fed by `keytec-ai config to-env` at start; legacy
# REGISTRY_* is honored as a fallback). The effective package name = package_name + suffix, where
# suffix = package_suffix if set, else -<site> for a named site (KEYTEC_AI_SITE != default).
# Tokens (set once globally via `ddev config global --web-environment-add`):
#   KEYTEC_REGISTRY_TOKEN       — read  (read_package_registry) — used by `db_pull_command`.
#   KEYTEC_REGISTRY_WRITE_TOKEN — write (api / write_registry)  — used by `db_push_command`
#                                 (or CI_JOB_TOKEN in GitLab CI).
# NOTE: do NOT declare tokens under environment_variables — that sources from the host env
# (default "") and would shadow the container web_environment value. The commands read them
# from the container env directly. Optional version pin: KEYTEC_DB_VERSION (web_environment).
#
# PULL (fetch-only): downloads the dump to DDEV's standard location
# `${DDEV_APPROOT}/.ddev/.downloads/db.sql.gz` and runs NO drush import — DDEV imports it via the
# provider's own `db_import_command` (below). So `ddev pull` is called WITHOUT `--skip-import`.
# IMPORT (db_import_command): imports the fetched dump per-site via `drush --uri=<site> sql:cli`.
# SELF-EXPORT (push): dumps the local DB via `drush sql:dump` and uploads the versioned artifact
# `<pkg>-<version>.sql.gz` + prunes old versions (retention).
# Per-site targeting comes from KEYTEC_AI_SITE (--environment): a named site re-resolves per-site
# coordinates and uses `drush --uri=<site>`; the default site uses no --uri.
db_pull_command:
  command: |
    set -eu -o pipefail
    if [ -n "${KEYTEC_AI_SITE:-}" ] && [ "${KEYTEC_AI_SITE}" != "default" ]; then
      eval "$(npx -y keytec-ai-cli config to-env --site "${KEYTEC_AI_SITE}" 2>/dev/null)" || true
    fi
    BASE="${PROVIDERS_REGISTRY_BASE_URL:-${REGISTRY_BASE_URL:-}}"
    PROJ="${PROVIDERS_REGISTRY_PROJECT_PATH:-${REGISTRY_PROJECT_PATH:-}}"
    PKG_BASE="${PROVIDERS_REGISTRY_PACKAGE_NAME:-${REGISTRY_PACKAGE_NAME:-}}"
    SUFFIX="${PROVIDERS_REGISTRY_PACKAGE_SUFFIX:-${REGISTRY_PACKAGE_SUFFIX:-}}"
    if [ -n "${SUFFIX}" ]; then PKG="${PKG_BASE}${SUFFIX}"
    elif [ -n "${KEYTEC_AI_SITE:-}" ] && [ "${KEYTEC_AI_SITE}" != "default" ]; then PKG="${PKG_BASE}-${KEYTEC_AI_SITE}"
    else PKG="${PKG_BASE}"; fi
    if [ -z "${KEYTEC_REGISTRY_TOKEN:-}" ]; then
      echo "ERROR: KEYTEC_REGISTRY_TOKEN not set (read_package_registry)." >&2
      echo "Set once: ddev config global --web-environment-add=\"KEYTEC_REGISTRY_TOKEN=...\"" >&2
      exit 1
    fi
    [ -n "${BASE}" ] && [ -n "${PROJ}" ] && [ -n "${PKG}" ] \
      || { echo "ERROR: REGISTRY_* missing — run the start feed (keytec-ai config to-env)" >&2; exit 1; }
    PROJ_ENC="$(printf '%s' "${PROJ}" | sed 's:/:%2F:g')"
    API="${BASE}/api/v4/projects/${PROJ_ENC}"
    if [ -n "${KEYTEC_DB_VERSION:-}" ]; then VER="${KEYTEC_DB_VERSION}"; else
      VER="$(curl -fsSL --header "PRIVATE-TOKEN: ${KEYTEC_REGISTRY_TOKEN}" \
        "${API}/packages?package_type=generic&package_name=${PKG}&order_by=created_at&sort=desc&per_page=1" \
        | jq -r '.[0].version // empty')"; fi
    [ -n "${VER}" ] || { echo "ERROR: no published version for ${PKG} — run 'ddev sync-sanitize' first" >&2; exit 4; }
    # fetch ONLY — write to DDEV's standard download location; DDEV (db_import_command) imports.
    DL="${DDEV_APPROOT:-/var/www/html}/.ddev/.downloads"; mkdir -p "${DL}"
    # artifact name contract (must match sync-sanitize): <pkg>-<version>.sql.gz
    FILE="${PKG}-${VER}.sql.gz"
    curl -fsSL --header "PRIVATE-TOKEN: ${KEYTEC_REGISTRY_TOKEN}" \
      "${API}/packages/generic/${PKG}/${VER}/${FILE}" -o "${DL}/db.sql.gz.part" \
      || curl -fsSL --header "PRIVATE-TOKEN: ${KEYTEC_REGISTRY_TOKEN}" \
        "${API}/packages/generic/${PKG}/${VER}/db.sql.gz" -o "${DL}/db.sql.gz.part"   # pre-v0.4 artifacts
    gzip -t "${DL}/db.sql.gz.part" || { echo "ERROR: downloaded dump is corrupt" >&2; rm -f "${DL}/db.sql.gz.part"; exit 1; }
    mv -f "${DL}/db.sql.gz.part" "${DL}/db.sql.gz"
    echo "fetched ${PKG} ${VER} -> .ddev/.downloads/db.sql.gz"

db_import_command:
  command: |
    set -eu -o pipefail
    URI_ARG=""
    if [ -n "${KEYTEC_AI_SITE:-}" ] && [ "${KEYTEC_AI_SITE}" != "default" ]; then
      URI_ARG="--uri=${KEYTEC_AI_SITE}"
    fi
    DL="${DDEV_APPROOT:-/var/www/html}/.ddev/.downloads"
    gunzip -c "${DL}/db.sql.gz" | drush ${URI_ARG} sql:cli
    echo "imported .ddev/.downloads/db.sql.gz${URI_ARG:+ (${URI_ARG})}"

db_push_command:
  command: |
    set -eu -o pipefail
    URI_ARG=""
    if [ -n "${KEYTEC_AI_SITE:-}" ] && [ "${KEYTEC_AI_SITE}" != "default" ]; then
      URI_ARG="--uri=${KEYTEC_AI_SITE}"
      eval "$(npx -y keytec-ai-cli config to-env --site "${KEYTEC_AI_SITE}" 2>/dev/null)" || true
    fi
    BASE="${PROVIDERS_REGISTRY_BASE_URL:-${REGISTRY_BASE_URL:-}}"
    PROJ="${PROVIDERS_REGISTRY_PROJECT_PATH:-${REGISTRY_PROJECT_PATH:-}}"
    PKG_BASE="${PROVIDERS_REGISTRY_PACKAGE_NAME:-${REGISTRY_PACKAGE_NAME:-}}"
    SUFFIX="${PROVIDERS_REGISTRY_PACKAGE_SUFFIX:-${REGISTRY_PACKAGE_SUFFIX:-}}"
    RET="${PROVIDERS_REGISTRY_RETENTION:-${REGISTRY_RETENTION:-5}}"
    if [ -n "${SUFFIX}" ]; then PKG="${PKG_BASE}${SUFFIX}"
    elif [ -n "${KEYTEC_AI_SITE:-}" ] && [ "${KEYTEC_AI_SITE}" != "default" ]; then PKG="${PKG_BASE}-${KEYTEC_AI_SITE}"
    else PKG="${PKG_BASE}"; fi
    TOKEN="${CI_JOB_TOKEN:-${KEYTEC_REGISTRY_WRITE_TOKEN:-}}"
    [ -n "${TOKEN}" ] || { echo "ERROR: no write token (set CI_JOB_TOKEN or KEYTEC_REGISTRY_WRITE_TOKEN)" >&2; exit 1; }
    if [ -n "${CI_JOB_TOKEN:-}" ]; then HDR="JOB-TOKEN: ${CI_JOB_TOKEN}"; else HDR="PRIVATE-TOKEN: ${KEYTEC_REGISTRY_WRITE_TOKEN}"; fi
    [ -n "${BASE}" ] && [ -n "${PROJ}" ] && [ -n "${PKG}" ] \
      || { echo "ERROR: REGISTRY_* missing — run the start feed (keytec-ai config to-env)" >&2; exit 1; }
    case "${PROJ}${PKG}" in *CHANGEME*)
      echo "ERROR: .keytec-ai.yml still contains a CHANGEME placeholder — set real project_path / package_name" >&2; exit 1 ;;
    esac
    # Self-export the (already-sanitized) local DB; per-site via --uri. Artifact name contract
    # (must match db_pull_command): <pkg>-<version>.sql.gz, version = date-sha.
    VER="$(date +%Y%m%d-%H%M%S)-$(git -C /var/www/html rev-parse --short HEAD 2>/dev/null || echo nogit)"
    FILE="${PKG}-${VER}.sql.gz"   # artifact name contract; local dump is a throwaway temp file
    TMP="$(mktemp)"
    drush ${URI_ARG} sql:dump 2>/dev/null | gzip > "${TMP}"
    gzip -t "${TMP}" || { echo "ERROR: exported dump is corrupt" >&2; rm -f "${TMP}"; exit 1; }
    PROJ_ENC="$(printf '%s' "${PROJ}" | sed 's:/:%2F:g')"
    API="${BASE}/api/v4/projects/${PROJ_ENC}"
    curl -fsSL --header "${HDR}" --upload-file "${TMP}" "${API}/packages/generic/${PKG}/${VER}/${FILE}" >/dev/null
    rm -f "${TMP}"
    echo "published ${FILE}${URI_ARG:+ (${URI_ARG})}"
    echo "  ${BASE}/${PROJ}/-/packages"
    # keep the newest RET versions of THIS package (first page = newest 100 — plenty)
    IDS="$(curl -fsSL --header "${HDR}" \
      "${API}/packages?package_type=generic&package_name=${PKG}&order_by=created_at&sort=desc&per_page=100" \
      | jq -r ".[${RET}:][].id" 2>/dev/null || true)"
    for id in ${IDS}; do curl -fsS --header "${HDR}" --request DELETE "${API}/packages/${id}" >/dev/null || true; done
