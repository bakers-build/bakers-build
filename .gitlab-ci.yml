stages:
  - lint
  - test
  - e2e
  - build
  - deploy
  - publish

# Superseded develop pipelines cancel their still-pending interruptible jobs, so a
# rapid burst of merges does not race the moving `:develop` image tag.
workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  hooks:
    # A killed prior job can leave a git *.lock in the runner's cached .git, so the
    # next job cannot lock a ref ("cannot lock ref 'refs/remotes/origin/develop':
    # ... develop.lock: File exists"). Clear stale locks before get_sources fetches.
    # Runs before every job's checkout (GitLab default hook, >= 15.10).
    pre_get_sources_script:
      - find "$CI_PROJECT_DIR/.git" -name '*.lock' -delete 2>/dev/null || true

image: php:8.4

variables:
  # Runner 8 keeps /builds in per-slot Docker volumes that every job reuses; a job
  # running as another uid leaves the checkout "dubiously owned", and git then
  # refuses every later root job. Trust the checkout, via env so it applies to
  # jobs with their own before_script too.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  MYSQL_DATABASE: db
  MYSQL_USER: db
  MYSQL_PASSWORD: db
  MYSQL_ROOT_PASSWORD: root
  SIMPLETEST_BASE_URL: http://127.0.0.1:8888
  SIMPLETEST_DB: mysql://db:db@db:3306/db

before_script:
  - apt-get update && apt-get install -y git unzip libpng-dev default-mysql-client
  - docker-php-ext-install gd pdo_mysql
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  # codeload.github.com intermittently returns HTTP 400 on dist downloads;
  # retry a few times, then fall back to --prefer-source (git, different host).
  - |
    set -e
    for attempt in 1 2 3 4 5; do
      echo "composer install attempt $attempt/5"
      if composer install --no-interaction --no-progress --prefer-dist; then
        break
      fi
      if [ "$attempt" = 5 ]; then
        echo "dist downloads kept failing; falling back to --prefer-source"
        composer install --no-interaction --no-progress --prefer-source
        break
      fi
      sleep 10
    done

# Path filters for the merge-request jobs: each job runs only when files in its
# own area changed. The lists are hidden keys (leading dot → GitLab treats them
# as non-jobs) referenced by YAML alias. Every list ends with the SHARED SAFETY
# NET (.gitlab-ci.yml, composer.json/lock, .ddev, patches) inlined, so a
# dependency, CI-config or DDEV change re-triggers the whole relevant suite
# rather than silently skipping it — YAML cannot concatenate lists, so the net
# is repeated per group on purpose. config_sync is deliberately NOT filtered
# (BB-407: it must stay an every-push gate); build/deploy/pages/publish run on
# branch/tag and are never filtered.
.changes_php: &changes_php
  - web/modules/custom/**/*
  - web/themes/custom/**/*
  - phpcs.xml.dist
  - phpmd.xml.dist
  - phpstan.neon.dist
  - phpunit.xml
  - composer.json
  - composer.lock
  - patches/**/*
  - .ddev/**/*
  - .gitlab-ci.yml
.changes_cli: &changes_cli
  - bakers-cli/**/*
  # The conductor job tests the code of this guide.
  - docs/addons/build/actions.md
  # The repository contracts the conductor job runs through vitest read these.
  - tests/contract/**/*
  - tests/skill-eval/**/*
  - .claude/**/*
  - .claude-plugin/**/*
  - scripts/**/*
  - WORKFLOW.md
  - .gitlab-ci.yml
.changes_theme: &changes_theme
  - web/themes/custom/**/*
  - tests/contract/**/*
  - tests/playwright/**/*
  - .gitlab-ci.yml
.changes_e2e_api: &changes_e2e_api
  - web/modules/**/*
  - web/themes/**/*
  - config/sync/**/*
  - recipes/**/*
  - tests/**/*
  - composer.json
  - composer.lock
  - patches/**/*
  - .ddev/**/*
  - .gitlab-ci.yml
.changes_config_install: &changes_config_install
  - config/sync/**/*
  - recipes/**/*
  - web/modules/**/*
  - composer.json
  - composer.lock
  - patches/**/*
  - .ddev/**/*
  - .gitlab-ci.yml
.changes_bb_skills: &changes_bb_skills
  - .claude/skills/bakers-build/skills/**/*
  - .gitlab-ci.yml
.changes_docs: &changes_docs
  - docs/**/*
  - website/**/*
  - .gitlab-ci.yml

# Linters run only in merge request pipelines, not on branch pushes (e.g.
# develop). Keeps develop pushes fast (build + deploy only).
phpcs:
  stage: lint
  tags:
    - parallel
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_php
  script:
    # The runner's PHP defaults to memory_limit=128M, which phpcs exhausts while
    # writing its result cache once the scanned tree is large enough — the failure
    # is `Util/Cache.php`, not a sniff. It does not reproduce in DDEV, whose PHP
    # sets a higher limit, so the gate can only be red here. `phpstan` below
    # already raises its own limit for the same reason.
    - ./vendor/bin/phpcs -d memory_limit=512M --standard=phpcs.xml.dist

phpmd:
  stage: lint
  tags:
    - parallel
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_php
  script:
    - php -d error_reporting='E_ALL & ~E_DEPRECATED' ./vendor/bin/phpmd web/modules/custom,web/themes/custom text phpmd.xml.dist --exclude 'tests/*,**/tests/*,**/node_modules/*'

phpstan:
  stage: lint
  tags:
    - parallel
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_php
  script:
    - ./vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit 512M

# BB-469 D5: a skill-text change with no plugin.json bump never reaches a
# consumer project's cached bundle (BB-469's own root cause D5/candidate 3).
bb_skill_version_gate:
  stage: lint
  image: php:8.4
  variables:
    # The gate uses a three-dot diff and therefore needs the merge base even
    # when develop has moved far beyond the last production release.
    GIT_DEPTH: "0"
  tags:
    - parallel
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_bb_skills
  before_script:
    - apt-get update && apt-get install -y git
  script:
    # Fetch into a job-private ref, never the shared `origin/<branch>`
    # tracking ref: this runner's jobs share a working copy, and two jobs
    # updating the same tracking ref concurrently races on the ref's
    # `.lock` file. A retry loop also absorbs that race when it does happen.
    - |
      for attempt in 1 2 3; do
        if git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME":"refs/bb-469-gate/target" --depth=200 --force; then
          break
        fi
        [ "$attempt" = 3 ] && exit 1
        sleep 5
      done
    - BASE_REF="refs/bb-469-gate/target" HEAD_REF="$CI_COMMIT_SHA" bash tests/contract/skill-version-gate.sh

# The docs prose gate `pages` runs, but only after merge on develop; this runs it before merge.
docs_pages:
  stage: lint
  image: node:22
  tags:
    - parallel
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_docs
  before_script: []
  script:
    - node website/scripts/check-pages.mjs

# BB-407: source config is a semantic subset of the CIM export. This is its
# own every-push gate; the contract scripts belong to web_ui and conductor and are deliberately
# not used here.
config_sync:
  stage: test
  tags:
    - parallel
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - bash tests/config-sync/check-config-sync.sh
    - bash tests/config-sync/check-ci-wiring.sh

# BB-658 Task 3: docker-compose.yml + each ingress overlay must render with
# dummy env values without leaking a secret, exposing a bypass host port, or
# accidentally activating the DB-dropping `install` profile.
compose_render:
  stage: test
  image: docker:26
  tags:
    - deploy
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash git
  script:
    - bash tests/contract/mcp-compose.sh

phpunit:
  stage: test
  timeout: 2h
  tags:
    - parallel
  # Icon API discovers symbols from the built sprite, including in kernel tests.
  needs:
    - job: web_ui
      artifacts: true
  # Manual, run once before the merge (WORKFLOW.md › Before merge). `allow_failure: false`
  # on a manual job leaves the pipeline *blocked* rather than passed until someone starts
  # it, so the merge still waits for a green run instead of skipping the suite.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_php
      when: manual
      allow_failure: false
  # No `services:` and no MariaDB wait. The suite runs on sqlite `:memory:`,
  # which is what lets it parallelise: every paratest worker opens a private
  # in-memory database, so there is no table-prefix collision and no shared
  # server to contend for. This overrides the pipeline-level SIMPLETEST_DB —
  # phpunit.xml's <env> does not force, so an exported value wins, and the
  # global one at the top of this file is the MariaDB URL.
  variables:
    SIMPLETEST_DB: "sqlite://localhost/:memory:"
  script:
    # `--testsuite unit-kernel` instead of seven hand-listed directories. That
    # list was the BB-396 hazard in the open: `island` had sat in NO job at
    # all — 98 Unit + Kernel tests ungated while the module carried the whole
    # boost mechanism — because adding a module meant remembering to add a
    # directory here. The suite is a glob over `*/tests/src/{Unit,Kernel}`
    # (phpunit.xml), so a new module is gated by existing, not by memory. It
    # resolved to the same 221 classes the seven directories did.
    - ./vendor/bin/paratest --configuration=phpunit.xml --testsuite unit-kernel --processes 8 --log-junit junit-phpunit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit-phpunit.xml

conductor:
  stage: test
  tags:
    - parallel
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_cli
  image: node:22
  variables:
    PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
    PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
  before_script: []
  script:
    - apt-get update && apt-get install -y --no-install-recommends jq python3
    - npm ci --prefix tests/skill-eval --no-audit --no-fund
    - corepack enable pnpm
    - cd bakers-cli
    - pnpm install --frozen-lockfile
    - pnpm run build:all
    - pnpm run typecheck
    - pnpm run lint
    # `test:vitest`, NOT `test`. `pnpm test` runs BOTH suites, because a local
    # test run that silently skips the renderer suite is how a merge shipped a
    # red `tui` job with a green local run. CI keeps them in two jobs, so each
    # names the suite it owns and writes its own junit file — see the `tui` job
    # below for why a shared report is not an option.
    - pnpm run test:vitest
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: bakers-cli/junit-vitest.xml

# BB-326: the renderer-coupled suite runs under Bun, because @opentui/core reaches its
# native core through FFI that Node does not expose. It is its OWN job with its OWN junit
# file: junit-vitest.xml has already been overwritten by a second suite in this repository
# once, and a shared report is how a suite's evidence disappears without anything going red.
# `bun` is a dependency of @bakers-build/addon-bakers-ui, NOT of the workspace root, so its binary
# is at addons/bakers-ui/node_modules/.bin/bun — there is no ./node_modules/.bin/bun.
tui:
  stage: test
  tags:
    - parallel
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_cli
  image: node:22
  variables:
    PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
    PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
  before_script: []
  script:
    - corepack enable pnpm
    - cd bakers-cli
    - pnpm install --frozen-lockfile
    - pnpm run build:all
    - ./addons/bakers-ui/node_modules/.bin/bun --version
    - pnpm run test:tui
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: bakers-cli/junit-tui.xml

# BB-326 (A1): the same renderer, the other libc. Bun-via-npm was chosen over a
# system Bun precisely because `bun` and `@opentui/core` both publish musl prebuilts;
# this job is what turns that from a claim into a checked fact, and a missing prebuilt
# fails LOUDLY here — it is a load-time error, not a silent degradation.
#
# It runs the whole renderer-coupled suite rather than `bun --version` + `--print-config`.
# Neither of those opens `libopentui.so`: `--print-config` deliberately stays on Node and
# never reaches the renderer, and a version print loads nothing. Measured on node:22-alpine,
# a job built out of those two commands passes while `bakers ui` cannot paint a single frame.
#
# `@opentui/core@0.5.1` picks its platform package from `process.env.OPENTUI_LIBC` and
# DEFAULTS TO GLIBC — it does not detect musl. Both prebuilts are materialised on either
# host (npm and pnpm filter optional deps by os/cpu, never by libc), so the wrong one is
# always present and always looks installable; the failure is a load-time
#   Error loading shared library ld-linux-x86-64.so.2 (needed by libopentui.so)
#
# THE JOB SETS NO JOB-WIDE OPENTUI_LIBC, and that omission is the point. A1 says `bakers ui`
# must render on musl "with no manual step", so a job that exports the variable for every
# command tests the WORKAROUND, not the fix. The two legs below need different things, and
# conflating them is what hid the gap:
#
#   PRODUCT leg — `bakers ui` enters through `cmdUi`, which calls `applyOpentuiLibc()`
#   (bakers-cli/ui/src/bun-runtime.ts) before anything else and sets OPENTUI_LIBC=musl
#   itself. It must therefore pass with the variable ABSENT, and the assertion below runs
#   in exactly that environment. It creates a real renderer, because that is the only step
#   that opens libopentui.so: `bun --version` loads nothing and `bakers ui --print-config`
#   deliberately stays on Node and never reaches the renderer, so a job built out of those
#   two passes while the cockpit cannot paint a single frame.
#
#   TEST leg — `pnpm run test:tui` is `bun test tests-bun`. `bun test` loads the renderer
#   DIRECTLY; it never goes through `cmdUi`, so nothing in our code runs to set the
#   variable and it genuinely still has to be exported. That is a property of the test
#   harness, not an unfixed product defect, so it is scoped to that one command rather
#   than to the job. Without it this suite fails 275 of 297 tests; with it, 297/297.
#
# `libstdc++` already ships in node:22-alpine, so the apk line is a no-op today. It is kept
# so the job does not silently depend on a base-image detail that upstream may drop.
tui_musl:
  stage: test
  tags:
    - parallel
  needs: [tui]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_cli
  image: node:22-alpine
  variables:
    PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
    PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
  before_script: []
  script:
    - apk add --no-cache libstdc++
    # `corepack enable pnpm` resolves the CURRENT pnpm major, and nothing in
    # `bakers-cli/` pins `packageManager`, so the version this job runs drifts on its
    # own. It drifted from 11.25.0 to 12.3.4 between 2026-09-04 and 2026-09-05, and
    # THAT is what turned this job red — the same commit was green the day before.
    # pnpm 12 stops installing the `libc: musl` optional dependency
    # (`@oven/bun-linux-x64-musl`) on Alpine, so bun's `postinstall` has no binary to
    # copy over its placeholder and the next line dies with `bun.exe: not found`.
    # The glibc twin `tui` passes the identical step under pnpm 12, which is what
    # isolates this to (pnpm major x musl) rather than to the build script.
    # Pinned to the last version measured green here; unpin when pnpm's musl
    # optional-dependency selection is fixed, or when `packageManager` is pinned
    # repo-wide (which is the better fix and its own change).
    - corepack enable pnpm
    - corepack prepare pnpm@11.25.0 --activate
    - cd bakers-cli
    - pnpm install --frozen-lockfile
    # bun's own npm-postinstall (node_modules/.pnpm/bun@*/node_modules/bun/install.js,
    # bundled from oven-sh/bun's packages/bun-release/scripts/npm-postinstall.ts) picks
    # its platform package with `platform.os === os2 && platform.arch === arch &&
    # (!platform.avx2 || avx2) && (!platform.abi || abi === platform.abi)`. The glibc
    # entries (bun-linux-x64, bun-linux-x64-baseline) carry NO `abi` property at all, so
    # `!platform.abi` is unconditionally true for them regardless of the detected libc —
    # the filter can only ever ADMIT a glibc entry, it can never exclude one because the
    # host is musl. Combined with array order and a stable avx2-sort, the glibc build is
    # tried FIRST even on this Alpine/musl image. Confirmed live (DEBUG tracing added to
    # a scratch copy of install.js): on a fresh install, `supportedPlatforms` really does
    # list `bun-linux-x64` (glibc) before `bun-linux-x64-musl`, the glibc candidate is
    # downloaded and self-tested first, and its self-test genuinely fails on musl (no
    # /lib64/ld-linux-x86-64.so.2) — after which the loop is only saved by falling
    # through to a live `npm install`/registry-fetch fallback inside the postinstall
    # script, itself independently observed to fail via ENOENT/EXDEV rename bugs in the
    # same install.js. Rather than depend on that fragile recovery path, install the
    # correct musl build directly and deterministically here.
    - |
      set -e
      BUN_VERSION=$(node -e "console.log(require('./addons/bakers-ui/package.json').dependencies.bun)")
      # The `parallel` tag covers both amd64 (runner1, gitlab) and arm64 (runner2) hosts.
      # An x64 ELF on arm64 is ENOEXEC, which busybox-ash then parses as a shell script
      # ("bun.exe: line 3: syntax error") — pick the package by the real machine arch.
      # arm64 has no -baseline variant; avx2 only exists on x86.
      case "$(uname -m)" in
        aarch64) BUN_MUSL_PKG=bun-linux-aarch64-musl ;;
        *) if grep -q avx2 /proc/cpuinfo 2>/dev/null; then
             BUN_MUSL_PKG=bun-linux-x64-musl
           else
             BUN_MUSL_PKG=bun-linux-x64-musl-baseline
           fi ;;
      esac
      echo "tui_musl: forcing @oven/${BUN_MUSL_PKG}@${BUN_VERSION} into place (bun's own installer can pick the glibc build first even on musl)"
      rm -rf /tmp/bun-musl-extract /tmp/bun-musl.tgz
      mkdir -p /tmp/bun-musl-extract
      wget -q -O /tmp/bun-musl.tgz "https://registry.npmjs.org/@oven/${BUN_MUSL_PKG}/-/${BUN_MUSL_PKG}-${BUN_VERSION}.tgz"
      tar xzf /tmp/bun-musl.tgz -C /tmp/bun-musl-extract
      test -x /tmp/bun-musl-extract/package/bin/bun
      install -m 0755 /tmp/bun-musl-extract/package/bin/bun addons/bakers-ui/node_modules/bun/bin/bun.exe
      install -m 0755 /tmp/bun-musl-extract/package/bin/bun addons/bakers-ui/node_modules/bun/bin/bunx.exe
      rm -rf /tmp/bun-musl-extract /tmp/bun-musl.tgz
    - pnpm run build:all
    - ./addons/bakers-ui/node_modules/.bin/bun --version
    # The repo no longer commits a connection config (each developer's
    # ~/.bakers/bakers.config.js points at prod), so a runner has none and the
    # `--print-config` check below would exit 1 — seed a home connection. The
    # url and uuid are placeholders on purpose: this check prints the resolution
    # and boots nothing, so it reaches no control plane and needs no real workspace.
    # Single-quoted as one YAML scalar: the `: ` inside the echo is a mapping
    # indicator in a plain scalar, and an unquoted line here took the whole
    # pipeline to `failed` with zero jobs.
    - 'mkdir -p ~/.bakers'
    - 'echo "export default { schema_version: 4, site: { base_url: ''https://ci.invalid'' }, workspace_id: ''00000000-0000-4000-8000-000000000000'' };" > ~/.bakers/bakers.config.js'
    - node bin/bakers ui --print-config
    # PRODUCT leg (A1) — no OPENTUI_LIBC in this environment. Asserts our own detection
    # says musl, that it sets the variable, and that libopentui.so then really opens.
    - >
      ./addons/bakers-ui/node_modules/.bin/bun -e '
      const { applyOpentuiLibc, nodeLibcFamily } = await import(`${process.cwd()}/ui/dist/src/bun-runtime.js`);
      if (nodeLibcFamily() !== "musl") throw new Error(`libc detection said ${nodeLibcFamily()}, expected musl`);
      applyOpentuiLibc(process.env);
      if (process.env.OPENTUI_LIBC !== "musl") throw new Error("applyOpentuiLibc did not set OPENTUI_LIBC");
      const { createTestRenderer } = await import("@opentui/core/testing");
      await createTestRenderer({ width: 20, height: 5 });
      console.log("A1: musl auto-detected, libopentui.so loaded, no manual step");
      '
    # TEST leg — `bun test` bypasses `cmdUi`, so the variable is still required HERE only.
    - OPENTUI_LIBC=musl pnpm run test:tui

# The web UI's host-side gates (BB-378, amended by BB-396): the Storybook build and every theme
# contract under tests/contract/. The Playwright-BDD suite is the third gate and runs in e2e_api,
# which has the Drupal site it needs. This job stays host-side and fast: the Storybook build needs
# no Drupal, no database and no DDEV, and the contracts read repository content and the built theme.
#
# The build is a real gate, not a smoke test: an unresolvable component reference fails it, which is
# what makes deleting a component safe to review. `--frozen-lockfile` so a drifting lockfile fails
# here rather than resolving to something the developer never ran.
web_ui:
  stage: test
  tags:
    - parallel
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_theme
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_php
  image: node:22
  # BB-389's suite reads YAML structure (which slot a scene node sits in, a row's cell
  # map keys) that grep cannot answer, so it shells out to `python3 -c 'import yaml'`.
  # BB-378's suite has zero python3 invocations, which is why this job never needed an
  # interpreter dependency before. The distro package needs no pip and no
  # --break-system-packages.
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends python3-yaml
  script:
    - corepack enable
    - cd web/themes/custom/bb_theme
    - pnpm install --frozen-lockfile
    # The Vite build first: .storybook/main.js declares `dist` as a staticDir,
    # so `storybook build` aborts with "no such directory" without it. A local
    # run hides this — dist/ is already there from an earlier build.
    - pnpm run build
    - pnpm exec storybook build
    - cd "$CI_PROJECT_DIR"
    - bash tests/contract/layout-components.sh
    - bash tests/contract/data-display-components.sh
    - bash tests/contract/token-discipline.sh
    - bash tests/contract/run-detail-overlay.sh
    - bash tests/contract/island-links.sh
    - node tests/contract/appearance.mjs
    - node tests/contract/icon-storybook.mjs
  artifacts:
    when: always
    expire_in: 1 week
    expose_as: 'Storybook'
    paths:
      - web/themes/custom/bb_theme/storybook-static/
      - web/themes/custom/bb_theme/dist/

e2e_api:
  stage: e2e
  # DAG: start the (slow) DDEV boot at pipeline begin, in parallel with lint +
  # phpunit + conductor, instead of waiting for the whole test stage to finish.
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_e2e_api
  tags:
    - runner1-dind
  image: ghcr.io/ddev/ddev-gitlab-ci:stable
  services:
    # Pin to docker 26 (runc 1.1.x): newer dind ships runc 1.2.x whose tmpfs
    # /proc masking fails on the runner's EOL kernel 5.4 ("can't mask dir
    # /proc/acpi ... invalid argument"). Drop the pin after a host HWE-kernel
    # upgrade (>= 5.15).
    - name: docker:26-dind
  variables:
    FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: 1
    FF_NETWORK_PER_BUILD: 0
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DDEV_NONINTERACTIVE: "true"
  before_script: []
  script:
    - ddev --version
    - docker version
    - ddev start
    # codeload.github.com intermittently 400s on dist downloads; retry then
    # fall back to --prefer-source (git host).
    - |
      set -e
      for attempt in 1 2 3 4 5; do
        echo "ddev composer install attempt $attempt/5"
        if ddev composer install --no-interaction --no-progress --prefer-dist; then
          break
        fi
        if [ "$attempt" = 5 ]; then
          echo "dist downloads kept failing; falling back to --prefer-source"
          ddev composer install --no-interaction --no-progress --prefer-source
          break
        fi
        sleep 10
      done
    # Build the theme frontend (vite dist/ is gitignored). The addon `ddev init`
    # build phase would do this from .keytec-ai.yml init.build, but that value is
    # surfaced by `keytec-ai config to-env`, which needs `npx` on the HOST — the
    # ddev-gitlab-ci runner image has none, so INIT_BUILD arrives empty and the
    # theme goes unbuilt, and an unstyled site is not what the functional and
    # integration suites are meant to exercise.
    # Build it explicitly here, just as composer install above is run manually.
    - ddev exec 'cd web/themes/custom/bb_theme && pnpm install --frozen-lockfile && pnpm build'
    - ddev init --provider recipe-test
    # BB-496: the RFC 8628 device flow's guards (a decided code cannot be
    # re-decided, flood control, per-caller scope validation) were originally
    # exercised here by a PHPUnit Functional test — BB-550's comment, since
    # removed, explained why that needed a file-backed sqlite DSN. The
    # Functional class was converted to Kernel
    # (`web/modules/custom/bb_oauth_device/tests/src/Kernel/DeviceAuthorizationFlowTest.php`)
    # because a Functional test serves HTTP from a second process that cannot
    # see this repository's `:memory:` test database at all — see
    # `phpunit.xml`'s own `unit-kernel` testsuite comment. The Kernel class
    # needs no bespoke invocation: it runs with everything else the `phpunit`
    # job's `unit-kernel` testsuite already collects.
    # BB-396: the browser suite is back, and with it the ordering constraint
    # BB-378 retired. It reads the PRISTINE bb_e2e seed — the team "Platform
    # Crew" and its three seeded members — and `ddev bakers-test-integration`
    # mutates that seed so the conductor can claim a ticket. So this runs AFTER
    # `ddev init` (which creates the world) and BEFORE integration (which
    # changes it). API contracts and browser contracts now share this BDD run.
    #
    # IT RUNS INSIDE THE WEB CONTAINER, and that is forced rather than chosen.
    # The job image `ghcr.io/ddev/ddev-gitlab-ci:stable` is Alpine with no node,
    # npm or npx (measured 2026-09-01), and Playwright publishes no browser
    # build for musl — `npx playwright install` cannot succeed on that host at
    # all. The DDEV web container is Debian 13 and ships node 24, so the suite
    # runs there and reaches the site through $DDEV_PRIMARY_URL.
    #
    # Install and run are ONE `ddev exec`, deliberately: `playwright install`
    # writes the browser into $HOME/.cache/ms-playwright, so a run under a
    # different user finds nothing. System deps need root (`sudo`, present in
    # the web container); the browser itself must NOT be fetched as root, or it
    # lands in /root/.cache and the test user cannot see it.
    # `test:unit` is the baseURL resolver's own vitest test — pure, no browser,
    # and it covers the one piece of logic that decides WHICH site the suite
    # talks to. It runs first so a resolver regression is named as one instead
    # of surfacing as every scenario failing to connect.
    # NO baseURL IS PASSED HERE, deliberately. `resolve-base-url.ts` resolves it:
    # from the worktree's `.env.ddev` when the addon's `init-worktree` wrote one,
    # and otherwise from `DDEV_PRIMARY_URL`, which DDEV exports inside this
    # container. Passing `PLAYWRIGHT_BASE_URL` here would take precedence over
    # the worktree's own statement and leave the resolver's worktree path
    # untested in the one place it runs most.
    # `typecheck` runs before the browser is even fetched. Playwright transpiles
    # the steps with esbuild, which strips types without checking them, so an
    # import of a helper that no longer exists survives the build and surfaces
    # 13 minutes later as `TypeError: … is not a function` inside a scenario.
    # That is exactly how BB-552's `clearMailbox` → `clearMailboxFor` rename
    # reached develop with two callers unconverted. `tsc --noEmit` names it in
    # seconds, at the import.
    # The CLI-refresh scenario forks bakers-cli's shared-session worker, which
    # imports the BUILT bakers-cli core, so the workspace is built here with the
    # same commands `ddev bakers-test-integration` uses — that later build comes
    # too late for the BDD run.
    - ddev exec 'cd bakers-cli && export CI=true PNPM_CONFIG_MINIMUM_RELEASE_AGE=0 PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS=true && npx --yes pnpm install --frozen-lockfile --store-dir /var/www/html/bakers-cli/.pnpm-store && npx --yes pnpm run build:all'
    - ddev exec 'cd tests/playwright && npm ci --no-audit --no-fund && npm run typecheck && npm run test:unit && sudo npx playwright install-deps chromium && npx playwright install chromium && npm test -- --retries=1'
    - ddev bakers-test-integration
  after_script:
    - ddev status || true
    - ddev logs -s web > ddev-web.log 2>&1 || true
    - ddev logs -s db > ddev-db.log 2>&1 || true
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - .ddev/.bakers-test/junit-integration.xml
        # BB-396: its own file. junit-vitest.xml has already been overwritten
        # by a second suite in this repository once, which is how a suite's
        # evidence disappears with nothing going red.
        - tests/playwright/junit-playwright.xml
        # BB-550: the device-flow Functional suite, the one PHPUnit class
        # that needs a file-backed sqlite DSN shared with the web container
        # instead of paratest's sqlite `:memory:` default.
        - junit-phpunit-functional.xml
    expose_as: 'DDEV test reports'
    paths:
      - .ddev/.bakers-test/
      - ddev-web.log
      - ddev-db.log
      # Keep reports and failed-attempt traces even when the CI retry passes.
      - tests/playwright/playwright-report/
      - tests/playwright/test-results/


# --- The final Drupal check: the config/sync install path ---
# WORKFLOW.md > Setup > Drupal checks ("recipe first, config/sync last")
# makes this a SECOND install path rather than a variation of
# the first, and it has to be its own job for this reason: the
# recipe world must not have config/sync imported into it, because that would
# hide missing recipe configuration. So `e2e_api` owns `recipe-test` and this
# job owns `existing-config`, on the same commit, which is what the note means
# by "the final Drupal check must pass at the same revision".
#
# WHAT ONLY THIS PATH CAN CATCH. A recipe installs a module but takes only its
# own simple config, while CIM DELETES anything missing from `config/sync`. A
# config entity therefore needs both homes, and a world built from the recipe
# cannot tell you whether the sync copy is present, current, or importable.
# This job installs from `config/sync` alone and then re-imports, so a missing
# or drifted entry is a red job instead of a surprise on a server.
#
# NO THEME BUILD AND NO BROWSER SUITE, deliberately. `e2e_api` documents why
# the theme has to be built by hand on this runner image; an unstyled site
# still answers the question this job asks, which is whether the configuration
# installs and re-imports. Browser behaviour is `e2e_api`'s, on the seeded
# recipe world — this provider seeds no accounts or content at all.
config_install:
  stage: e2e
  # DAG, exactly as e2e_api: the DDEV boot is the slow part and has no reason
  # to wait for lint or phpunit.
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *changes_config_install
  tags:
    - runner1-dind
  image: ghcr.io/ddev/ddev-gitlab-ci:stable
  services:
    # The docker 26 pin is e2e_api's, for the same runner kernel reason.
    - name: docker:26-dind
  variables:
    FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: 1
    FF_NETWORK_PER_BUILD: 0
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DDEV_NONINTERACTIVE: "true"
  before_script: []
  script:
    - ddev --version
    - ddev start
    # codeload.github.com intermittently 400s on dist downloads; retry then
    # fall back to --prefer-source, exactly as e2e_api does.
    - |
      set -e
      for attempt in 1 2 3 4 5; do
        echo "ddev composer install attempt $attempt/5"
        if ddev composer install --no-interaction --no-progress --prefer-dist; then
          break
        fi
        if [ "$attempt" = 5 ]; then
          echo "dist downloads kept failing; falling back to --prefer-source"
          ddev composer install --no-interaction --no-progress --prefer-source
          break
        fi
        sleep 10
      done
    # ALWAYS NAME THE PROVIDER: a plain `ddev init` defaults to
    # `existing-config`, so an unnamed provider would make the two install-path
    # jobs indistinguishable. `--fresh` because a change to installation config
    # is exactly what this job exists to catch.
    - ddev init --provider existing-config --fresh
    # The re-import is the second half of the check. An entry that installed but
    # does not round-trip — a hand-authored file differing from the saved form —
    # shows up here and nowhere else.
    - ddev drush cim -y
    - ddev drush cr
    - ddev drush status
  after_script:
    - ddev status || true
    - ddev logs -s web > ddev-web-config-install.log 2>&1 || true
    - ddev logs -s db > ddev-db-config-install.log 2>&1 || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ddev-web-config-install.log
      - ddev-db-config-install.log

# --- Deploy (recipe: komodo, Resource-Sync model) ---
# build:  docker build php+nginx+mcp -> push GitLab registry as :<branch> (what the stacks
#         pull) and :<commit-sha> (rollback: point the stack's REGISTRY_IMAGE_* at it).
# deploy: keytec-ai deployer deploy -> DeployStack + poll (fixed branches only), then
#         scripts/deploy/deploy-report.mjs prints the server's `deploy` service log and
#         exit state and smoke-checks the host.
# Stacks are declared in git (komodo/*.toml) and created by a Komodo Resource Sync.
# Required CI/CD variables (project, masked): KOMODO_URL, KOMODO_API_KEY,
#   KOMODO_API_SECRET; NPM_TOKEN for the publish jobs.
build:
  stage: build
  # runner1 mounts the host Docker socket centrally for its jobs.
  image: docker:26
  tags:
    - deploy
  # Decoupled from lint/test/e2e: the deploy build is independent of the ddev-based
  # functional suite, so it runs as soon as the commit lands rather than waiting on
  # (or being blocked by) the e2e stage.
  needs: []
  # Serialize build+deploy per branch: the stacks pull the moving `:<branch>` tag,
  # so parallel pushes would clobber it out of order and parallel
  # deploys would interleave image↔DB state. Per-branch group (develop_deploy /
  # main_deploy) so develop and prod never block each other. One at a time, in order.
  resource_group: ${CI_COMMIT_REF_SLUG}_deploy
  # A newer commit on the same branch cancels this build if it has not finished yet.
  interruptible: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --target php   -t "$CI_REGISTRY_IMAGE/php:$CI_COMMIT_REF_SLUG"   .
    - docker build --target nginx -t "$CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_REF_SLUG" .
    # MCP connector (BB-658 Task 3) — own Dockerfile, own image, same :<branch> tag.
    - docker build -f docker/mcp/Dockerfile -t "$CI_REGISTRY_IMAGE/mcp:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE/php:$CI_COMMIT_REF_SLUG"
    - docker push "$CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_REF_SLUG"
    - docker push "$CI_REGISTRY_IMAGE/mcp:$CI_COMMIT_REF_SLUG"
    # Per-commit tags for rollback; the job log names the deployed SHA.
    - |
      for image in php nginx mcp; do
        docker tag "$CI_REGISTRY_IMAGE/$image:$CI_COMMIT_REF_SLUG" "$CI_REGISTRY_IMAGE/$image:$CI_COMMIT_SHA"
        docker push "$CI_REGISTRY_IMAGE/$image:$CI_COMMIT_SHA"
      done
  # develop -> dev2 (bakers-develop), main -> prod (bakers-prod). Both build + deploy.
  # $CI_PIPELINE_SOURCE != "schedule" excludes a schedule pointed at develop/main
  # (e.g. andock:cleanup's schedule briefly was, mid-review): GitLab sets
  # $CI_COMMIT_BRANCH for a scheduled pipeline against a branch ref just like a
  # push, so without this a misdirected schedule would trigger a real deploy.
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'

# Publish the conductor CLI to public npm as @bakers-build/bakers. Triggered ONLY by a
# semver git tag (v*.*.*). The published version is the tag. Requires a masked
# NPM_TOKEN CI/CD variable with publish rights to the npm org bakers-build.
publish:npm:
  stage: publish
  image: node:22
  tags:
    - parallel
  needs: []
  # Not interruptible: a publish in flight must finish (a half-published version
  # cannot be re-published to the same version number).
  interruptible: false
  variables:
    PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
    PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
  before_script:
    # `pnpm run test` runs conductor/tests/cli/teardown-test-project.test.ts, which shells out to
    # `jq`; the node:22 image ships none (the conductor test job installs it for the same reason).
    - apt-get update && apt-get install -y --no-install-recommends jq
    - corepack enable pnpm
  script:
    - cd bakers-cli
    - pnpm install --frozen-lockfile
    # Build + full test gate before shipping.
    - pnpm run build:all
    - pnpm run typecheck
    - pnpm run test
    # Prove the whole 17-package SET (@bakers-build/core, @bakers-build/conductor, the 13
    # @bakers-build/addon-* mountables, @bakers-build/ui, @bakers-build/bakers) installs + resolves
    # as real, non-bundled deps from clean tarballs (verify:package stages at the
    # dev version internally; the release step below re-stages at the tag version,
    # so order is fine either way).
    - pnpm run verify:package
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    # Stage the whole set (17 packages) at the tag version, then publish in
    # dependency direction — BB-224 layered order:
    #   core → {conductor, addon-dropsh} → impl/command addons → addon-herdr →
    #   ui → bakers
    # so every dependency reaches the registry before the package that references
    # its exact version. `release:semver` refuses to fall back to the dev version,
    # so a tag release can never accidentally ship 0.0.1. Order + membership come
    # from the single TARGETS list in prepare-publish.mjs — adding a package there
    # wires it into staging AND publishing, no per-package line to forget here.
    - pnpm run release:semver "$CI_COMMIT_TAG"
  # $CI_PIPELINE_SOURCE != "schedule" excludes a schedule pointed at a tag ref,
  # same reasoning as build/deploy/pages above: GitLab sets $CI_COMMIT_TAG for a
  # scheduled pipeline against a tag just like it sets $CI_COMMIT_BRANCH for one
  # against a branch, so without this a misdirected schedule would trigger a
  # real publish to public npm.
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([-+].+)?$/ && $CI_PIPELINE_SOURCE != "schedule"'

deploy:
  stage: deploy
  # keytec-ai-cli ships on npm; run it via npx (no private deployer image to pull).
  image: node:22
  tags:
    - deploy
  needs:
    - build
  # Same per-branch group as build → deploys never interleave within a branch. NOT
  # interruptible: a deploy in flight must finish (killing it mid-DeployStack leaves a
  # half-applied stack). keytec-ai deployer resolves the stack from the current branch
  # (develop -> bakers-develop, main -> bakers-prod) via komodo/bakers.toml.
  # KOMODO_URL is a project CI/CD variable.
  resource_group: ${CI_COMMIT_REF_SLUG}_deploy
  interruptible: false
  before_script: []
  # The report runs even when the deploy call failed, so the job log always carries the
  # server's own `deploy` output; either failure fails the job.
  script:
    - |
      status=0
      npx -y -p keytec-ai-cli@0.4.0 keytec-ai deployer deploy || status=$?
      node scripts/deploy/deploy-report.mjs "$DEPLOY_STACK" "$DEPLOY_URL" || status=1
      exit $status
  # See the same guard on the build job above: excludes a schedule misdirected
  # at develop/main from triggering a real Komodo deploy.
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE != "schedule"'
      variables:
        DEPLOY_STACK: bakers-develop
        DEPLOY_URL: https://develop.dev.bakers.build
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'
      variables:
        DEPLOY_STACK: bakers-prod
        DEPLOY_URL: https://app.bakers.build

# Test build of the CLI for every develop deploy: the whole set under dist-tag `next`, at
# <next patch after the latest v-tag>-next.<pipeline iid> (0.1.0-next.<iid> before the
# first release), so `npm i -g @bakers-build/bakers@next` matches the commit on dev.
# `latest` moves only through publish:npm on a version tag.
publish:npm:next:
  extends: publish:npm
  needs:
    - deploy
  variables:
    # The version derives from the release tags, which a shallow clone may miss.
    GIT_DEPTH: "0"
  # npm points `latest` at a package's very first publish whatever the dist-tag; before
  # v0.1.0 nobody installs `latest`, and the first release moves it to 0.1.0.
  script:
    - cd bakers-cli
    - pnpm install --frozen-lockfile
    - pnpm run build:all
    - pnpm run verify:package
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - |
      last=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
      base=$( [ -n "$last" ] && echo "${last#v}" | awk -F. '{print $1"."$2"."$3+1}' || echo 0.1.0 )
      pnpm run release:semver "${base}-next.${CI_PIPELINE_IID}" --tag next
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE != "schedule"'

# Release on a main push after prod deployed: the top `## <version>` of CHANGELOG.md
# (merged into develop beforehand as a normal MR) becomes tag v<version> and a GitLab
# release carrying that entry; the tag pipeline then runs publish:npm (`latest`). A main
# push whose CHANGELOG version is already tagged releases nothing. glab is the tool behind
# GitLab's `release:` keyword, called directly because the keyword cannot be skipped.
release:
  stage: publish
  image:
    name: registry.gitlab.com/gitlab-org/cli:v1.123.0
    entrypoint: [""]
  tags:
    - parallel
  needs:
    - deploy
  interruptible: false
  variables:
    GIT_DEPTH: "0"
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  before_script: []
  script:
    - |
      version=$(sed -n 's/^## \([0-9][0-9.]*\) .*/\1/p' CHANGELOG.md | head -1)
      [ -n "$version" ] || { echo "CHANGELOG.md names no version"; exit 1; }
      if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
        echo "v$version is already released; nothing to do."
        exit 0
      fi
      awk -v v="$version" '/^## /{if(f)exit; if(index($0,"## " v " ")==1)f=1; next} f' CHANGELOG.md > release-notes.md
      cat release-notes.md
      glab release create "v$version" --ref "$CI_COMMIT_SHA" --name "v$version" --notes-file release-notes.md
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'

# GitLab Pages: publish the VitePress docs site in /website.
# No custom domain and therefore NO DNS record - the instance's
# *.gitlab-pages.keytec.de wildcard already resolves, which is how keytec/ai-adopt
# (id 249) has published since June. Pages serves whatever `public/` contains, so the
# built site is moved there rather than copied.
# Every develop push that deploys dev2 also publishes the site ROOT (BB-579), so merged
# documentation is public without a CLI release; the sidebar version row names the commit.
# A release tag no longer publishes: this instance has no license for parallel deployments
# (GitLab rejects `pages.path_prefix` without one), so the project has exactly one Pages
# deployment and develop owns it. `needs: []` keeps the docs off the Drupal build path - a
# failing docs build neither waits for nor blocks build/deploy - and the job deliberately
# carries NO resource_group so publishing the docs never queues behind the stack deploy.
pages:
  stage: publish
  image: node:22
  tags:
    - parallel
  needs: []
  # A newer develop commit supersedes this build (workflow: auto_cancel above).
  interruptible: true
  # Same two pnpm settings the other Node jobs (conductor, publish:npm) carry, and for
  # the same reason. `website/package.json` pins no `packageManager`, so `corepack
  # enable pnpm` resolves the CURRENT pnpm major — 11 at time of writing — and pnpm 11
  # turns an ignored build script into a HARD failure:
  #   [ERR_PNPM_IGNORED_BUILDS] Ignored build scripts: esbuild@0.21.5  -> exit 1
  # It aborts in `pnpm install`, before `pnpm build` ever runs. Local installs on pnpm
  # 10 only WARN about the same thing, so a green local build proves nothing here.
  # Setting these in package.json's `pnpm` field does not work: pnpm 11 reads them from
  # pnpm-workspace.yaml, not package.json.
  variables:
    PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
    PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
  before_script:
    - corepack enable pnpm
  script:
    - cd website
    - pnpm install --frozen-lockfile
    - pnpm build
    - cd ..
    - mv website/.vitepress/dist public
  artifacts:
    paths:
      - public
  # Same guard as build/deploy: a develop push publishes; a schedule misdirected at
  # develop does not (GitLab sets $CI_COMMIT_BRANCH for a scheduled pipeline too).
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE != "schedule"'
