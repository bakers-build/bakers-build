# Komodo Resource Sync — one Stack per fixed branch for bakers.
# Komodo scans this file (Resource Sync) and creates/updates the stacks by diff.
# Compose comes from this repo at each stack's branch; images are pulled per branch
# (:<branch>); secrets are Komodo Variables referenced as [[NAME]].
#
# Environment: develop -> dev2, prod -> bakers-prod (162.55.171.54). Both hosts run the
# same Traefik ingress (TLS-ALPN challenge, network traefik_proxy), layered on the shared
# ingress-agnostic docker-compose.yml via file_paths.

[[stack]]
name = "bakers-develop"
[stack.config]
server           = "dev2"
git_provider     = "github.com"
git_account      = ""
repo             = "bakers-build/bakers-build"
branch           = "next"
run_directory    = "."
file_paths       = ["docker-compose.yml", "docker-compose.traefik.yml"]
auto_pull        = true
registry_provider = "ghcr.io"
registry_account = ""
webhook_enabled  = false
poll_for_updates = false
extra_args       = ["--wait"]
ignore_services  = ["init-perms", "deploy"]
environment = """
DOMAIN=develop.dev.bakers.build
STACK_NAME=bakers-develop
DB_NAME=bakers
DB_USER=bakers
DB_PASSWORD=[[BB_DEVELOP_DB_PASSWORD]]
DB_ROOT_PASSWORD=[[BB_DEVELOP_DB_ROOT_PW]]
DRUPAL_HASH_SALT=[[BB_DEVELOP_HASH_SALT]]
REGISTRY_IMAGE_PHP=ghcr.io/bakers-build/bakers-build/php:next
REGISTRY_IMAGE_NGINX=ghcr.io/bakers-build/bakers-build/nginx:next
# The public docs and plugin marketplace (docs service, profile docs), content from develop.
COMPOSE_PROFILES=docs
DOCS_DOMAIN=docs-develop.dev.bakers.build
DOCS_ALIAS_DOMAIN=docs-develop.dev.bakers.build
REGISTRY_IMAGE_DOCS=ghcr.io/bakers-build/bakers-build/docs:next
# Auto-deploy runs scripts/deploy/site-deploy.sh: on an installed site drush deploy (the
# runner dumps beforehand); it installs only a reachable database without any table. The explicit
# first install stays available on the host:
#   docker compose --profile install run --rm install
# OAuth / social sign-in (BB-476): Google client credentials. Empty in
# config/sync — this is the only place they reach the site. Empty at launch.
BB_OAUTH_GOOGLE_CLIENT_ID=[[BB_DEVELOP_OAUTH_GOOGLE_CLIENT_ID]]
BB_OAUTH_GOOGLE_CLIENT_SECRET=[[BB_DEVELOP_OAUTH_GOOGLE_CLIENT_SECRET]]
# BB_DEVELOP_MAIL_SMTP_DSN and BB_DEVELOP_MAIL_FROM_ADDRESS must hold the REAL SMTP
# values in Komodo (copied from the previous instance's mail variables); provision-secrets
# would fill hex-random and break passwordless sign-in. BB_DEVELOP_MAIL_FROM_NAME is
# "bakers.build".
MAIL_SMTP_DSN=[[BB_DEVELOP_MAIL_SMTP_DSN]]
MAIL_FROM_ADDRESS=[[BB_DEVELOP_MAIL_FROM_ADDRESS]]
MAIL_FROM_NAME=[[BB_DEVELOP_MAIL_FROM_NAME]]
"""

# Test environment for the customer project-manager bot: branch
# feat/bl-1-customer-project-man -> stack bakers-bl1 on dev2, next to develop. The
# pipeline promotes and deploys it like develop; drop this block, the CI rules for the
# branch and the stack once the branch has merged.
[[stack]]
name = "bakers-bl1"
[stack.config]
server           = "dev2"
git_provider     = "git.key-tec.de"
git_account      = "keyki"
repo             = "bakers-build/bakers-build"
branch           = "feat/bl-1-customer-project-man"
run_directory    = "."
file_paths       = ["docker-compose.yml", "docker-compose.traefik.yml"]
auto_pull        = true
registry_provider = "git.key-tec.de:5050"
registry_account = "gitlab+deploy-token-30"
webhook_enabled  = false
poll_for_updates = false
extra_args       = ["--wait"]
ignore_services  = ["init-perms", "deploy"]
environment = """
DOMAIN=bl1.dev.bakers.build
STACK_NAME=bakers-bl1
DB_NAME=bakers
DB_USER=bakers
DB_PASSWORD=[[BB_BL1_DB_PASSWORD]]
DB_ROOT_PASSWORD=[[BB_BL1_DB_ROOT_PW]]
DRUPAL_HASH_SALT=[[BB_BL1_HASH_SALT]]
REGISTRY_IMAGE_PHP=git.key-tec.de:5050/bakers-build/bakers-build/php:feat-bl-1-customer-project-man
REGISTRY_IMAGE_NGINX=git.key-tec.de:5050/bakers-build/bakers-build/nginx:feat-bl-1-customer-project-man
# First install, once on dev2: docker compose --profile install run --rm install
# No Google sign-in: its redirect URI is host-bound. Mail shares develop's SMTP account.
BB_OAUTH_GOOGLE_CLIENT_ID=
BB_OAUTH_GOOGLE_CLIENT_SECRET=
MAIL_SMTP_DSN=[[BB_DEVELOP_MAIL_SMTP_DSN]]
MAIL_FROM_ADDRESS=[[BB_DEVELOP_MAIL_FROM_ADDRESS]]
MAIL_FROM_NAME=[[BB_DEVELOP_MAIL_FROM_NAME]]
"""

# Production. branch main -> stack bakers-prod on its own server (Komodo server
# "bakers-prod", 162.55.171.54), Traefik ingress like dev2. Domain app.bakers.build,
# DNS only in Cloudflare so Traefik's TLS-ALPN challenge reaches the host.
[[stack]]
name = "bakers-prod"
[stack.config]
server           = "bakers-prod"
git_provider     = "github.com"
git_account      = ""
repo             = "bakers-build/bakers-build"
branch           = "main"
run_directory    = "."
file_paths       = ["docker-compose.yml", "docker-compose.traefik.yml"]
auto_pull        = true
registry_provider = "ghcr.io"
registry_account = ""
webhook_enabled  = false
poll_for_updates = false
extra_args       = ["--wait"]
ignore_services  = ["init-perms", "deploy"]
environment = """
DOMAIN=app.bakers.build
STACK_NAME=bakers-prod
DB_NAME=bakers
DB_USER=bakers
DB_PASSWORD=[[BB_PROD_DB_PASSWORD]]
DB_ROOT_PASSWORD=[[BB_PROD_DB_ROOT_PW]]
DRUPAL_HASH_SALT=[[BB_PROD_HASH_SALT]]
REGISTRY_IMAGE_PHP=ghcr.io/bakers-build/bakers-build/php:main
REGISTRY_IMAGE_NGINX=ghcr.io/bakers-build/bakers-build/nginx:main
# The public docs and plugin marketplace (docs service, profile docs), content from the
# released main. bakers.build and www.bakers.build: A records to this host, DNS only, like
# app.bakers.build; www redirects to bakers.build.
COMPOSE_PROFILES=docs
DOCS_DOMAIN=bakers.build
DOCS_ALIAS_DOMAIN=www.bakers.build
REGISTRY_IMAGE_DOCS=ghcr.io/bakers-build/bakers-build/docs:main
# Auto-deploy runs scripts/deploy/site-deploy.sh: drush deploy (the runner dumps first). It installs
# only a reachable database without any table, so a bootstrap false-negative cannot wipe
# prod. The explicit first install stays available on the prod host:
#   docker compose --profile install run --rm install
# OAuth / social sign-in (BB-476): Google client credentials, prod's own
# registration — the redirect URI is host-bound (BB-476 D9). Empty at launch.
BB_OAUTH_GOOGLE_CLIENT_ID=[[BB_PROD_OAUTH_GOOGLE_CLIENT_ID]]
BB_OAUTH_GOOGLE_CLIENT_SECRET=[[BB_PROD_OAUTH_GOOGLE_CLIENT_SECRET]]
# BB_PROD_MAIL_SMTP_DSN and BB_PROD_MAIL_FROM_ADDRESS must hold the REAL SMTP
# values in Komodo (copied from the previous instance's mail variables); provision-secrets
# would fill hex-random and break passwordless sign-in. BB_PROD_MAIL_FROM_NAME is
# "bakers.build".
MAIL_SMTP_DSN=[[BB_PROD_MAIL_SMTP_DSN]]
MAIL_FROM_ADDRESS=[[BB_PROD_MAIL_FROM_ADDRESS]]
MAIL_FROM_NAME=[[BB_PROD_MAIL_FROM_NAME]]
"""
