#ddev-generated
# RAW (unsanitized) DB pull from a drush site alias — a fetch-only ddev-pull provider.
# Dumps the SOURCE alias to a gzipped SQL file under .ddev/.downloads; `ddev pull` then imports
# it natively. It does NOT self-import; DDEV performs the import (no --skip-import).
# Needs `ddev auth ssh` (the web container SSHes to the remote). Source alias comes from
# providers.drush.alias in .keytec-ai.yml (-> PROVIDERS_DRUSH_ALIAS via `keytec-ai config
# to-env` + the pre-start feed); a one-off `ddev pull drush --environment=alias=@x` overrides it.
# One source dump regardless of site (no per-site --uri) — it always lands in the same local DB.
# WARNING: no trust boundary — this pulls RAW production data straight into your local DB.
environment_variables:
  alias: ""
db_pull_command:
  command: |
    set -eu -o pipefail
    A="${alias:-${PROVIDERS_DRUSH_ALIAS:-}}"
    [ -n "${A}" ] || { echo "ERROR: no source alias — set providers.drush.alias in .keytec-ai.yml (or ddev pull drush --environment=alias=@site.env)" >&2; exit 1; }
    DL="${DDEV_APPROOT:-/var/www/html}/.ddev/.downloads"
    # Stream the dump from the SOURCE alias to local stdout and gzip it locally into the DDEV
    # download dir. Streaming (not --result-file=<path>) is required for a REMOTE alias: a
    # result-file would be written on the remote host, never here. Write to a .part temp and
    # rename only on success (pipefail aborts before the rename if the dump fails), so a failed
    # dump never leaves a bogus (empty-gzip) db.sql.gz for ddev to import — and the host
    # dispatcher can treat the presence of db.sql.gz as proof the dump was delivered and ddev
    # proceeded to import. `ddev pull` imports this artifact and KEEPS it in .ddev/.downloads
    # as a cache; sync-sanitize shreds the raw dump at the end of every run (raw prod at rest is
    # the trust boundary — DDEV does NOT remove it after import).
    # Cache/transient tables are always dumped structure-only (drush fnmatch-expands the globs on
    # the SOURCE): pure throwaway data — on a real project this shrank the dump 51 GB -> 3.5 GB.
    drush -y "${A}" sql:dump --structure-tables-list='cache,cache_*,cachetags,batch,flood,key_value_expire,queue,semaphore,sessions,watchdog' | gzip -c > "${DL}/db.sql.gz.part"
    mv -f "${DL}/db.sql.gz.part" "${DL}/db.sql.gz"
    echo "delivered ${A} dump -> .ddev/.downloads/db.sql.gz"
