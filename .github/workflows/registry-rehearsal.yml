name: Private registry rehearsal
on:
  push:
    branches: [ci/ghcr-rehearsal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-rehearsal
  cancel-in-progress: false
jobs:
  registry:
    runs-on: ${{ fromJSON(vars.RUNNER_AFTER_MERGE || '"warp-ubuntu-latest-x64-4x"') }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 180
    env:
      DOMAIN: nginx
      STACK_NAME: gate
      DB_NAME: db
      DB_USER: db
      DB_PASSWORD: db
      DB_ROOT_PASSWORD: root
      DRUPAL_HASH_SALT: gate-stack-hash-salt-not-a-secret-0123
      REGISTRY_IMAGE_PHP: bakers-gate/php:local
      REGISTRY_IMAGE_NGINX: bakers-gate/nginx:local
      REGISTRY_IMAGE_E2E: bakers-gate/e2e:local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and test the same images
        run: bash scripts/ci/github-image-gate.sh
      - name: Export tested runtime images
        run: bash scripts/ci/github-image-export.sh
      - uses: actions/upload-artifact@v4
        with:
          name: verified-images-${{ github.run_attempt }}
          path: verified-images/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Publish and pull private images
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/github-registry-rehearsal.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-gate-evidence
          path: gate-reports/
          retention-days: 7

  transfer:
    needs: registry
    runs-on: ${{ fromJSON(vars.RUNNER_AFTER_MERGE || '"warp-ubuntu-latest-x64-4x"') }}
    permissions:
      contents: read
    env:
      RELEASE_HEAD: ${{ github.sha }}
      SOURCE_RUN_ID: ${{ github.run_id }}
      SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_SOURCE_SHA: ${{ github.sha }}
      CI_RELEASE_VERSION: 0.0.0-rehearsal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-images-${{ github.run_attempt }}
          path: verified-images
      - name: Import exact tested images on another runner
        run: bash scripts/ci/github-image-import.sh
      - name: Verify stable metadata and layer identity across retries
        run: |
          bash scripts/ci/github-image-label.sh
          for image in php nginx docs; do docker image inspect "bakers-gate/$image:local" --format '{{.Id}}'; done > first-ids
          bash scripts/ci/github-image-import.sh
          bash scripts/ci/github-image-label.sh
          for image in php nginx docs; do docker image inspect "bakers-gate/$image:local" --format '{{.Id}}'; done > second-ids
          diff -u first-ids second-ids
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-transfer-evidence
          path: gate-reports/
          retention-days: 7
